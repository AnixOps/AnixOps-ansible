[pytest]
# Repository-wide pytest configuration. Run from the repo root:
#   python3 -m pytest -q
testpaths = tests
python_files = test_*.py
addopts = -ra
xfail_strict = true
norecursedirs = .git .ansible .cache .venv venv collections node_modules __pycache__
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
markers =
    hygiene: repository-wide encoding, whitespace and secret checks (tests/test_repo_hygiene.py)
    structure: Ansible role and playbook convention checks (tests/test_role_structure.py)
    integration: tests that drive a real or local Ansible run
    slow: tests that take more than a few seconds
