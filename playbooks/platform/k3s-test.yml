---
# =============================================================================
# Remote k3s test cluster | 远程 k3s 测试集群
# =============================================================================
# Scope      : k8s_test (one host at a time, any failure stops the batch)
# Risk       : MEDIUM - remote test servers only
# Rollback   : /usr/local/bin/k3s-uninstall.sh on the server
# Pre-flight : facts + k8s_provision prerequisites
# Post-check : k8s_provision verification + kubeconfig fetched to the controller
#
# No Helm and no application deployment: use kubectl apply -f <manifest> afterwards.
#
# Usage | 使用:
#   ansible-playbook -i inventories/production/hosts.yml playbooks/platform/k3s-test.yml
#   bash scripts/anixops.sh deploy-remote-test
#
# Tags: k3s_test (all plays), k3s_test_provision, k3s_test_kubeconfig
# =============================================================================

- name: Provision the remote k3s test cluster
  hosts: k8s_test
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - k3s_test
    - k3s_test_provision

  tasks:
    - name: Show target summary
      ansible.builtin.debug:
        msg:
          - "Target: {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})"
          - "Location: {{ location | default('Unknown') }}, cluster: {{ cluster_name | default('k3s-test') }}"
          - "Provider: k3s {{ k3s_version | default('role default') }}"

    - name: Provision k3s with the k8s_provision role
      ansible.builtin.import_role:
        name: k8s_provision
      vars:
        k8s_provision_provider: k3s

- name: Fetch the kubeconfig from the test cluster
  hosts: k8s_test
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - k3s_test
    - k3s_test_kubeconfig

  vars:
    k3s_kubeconfig_remote: "{{ kubeconfig_remote_path | default('/etc/rancher/k3s/k3s.yaml') }}"
    k3s_kubeconfig_local: "{{ kubeconfig_local_path | default('~/.kube/k3s-' ~ inventory_hostname ~ '.yaml') }}"

  tasks:
    - name: Fetch the kubeconfig
      ansible.builtin.fetch:
        src: "{{ k3s_kubeconfig_remote }}"
        dest: "{{ k3s_kubeconfig_local }}"
        flat: true

    - name: Restrict the local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_local }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Point the local kubeconfig at the server address
      ansible.builtin.replace:
        path: "{{ k3s_kubeconfig_local }}"
        regexp: 'server: https://127\.0\.0\.1:6443'
        replace: "server: https://{{ ansible_host | default(inventory_hostname) }}:6443"
      delegate_to: localhost
      become: false

    - name: Show the deployment summary
      ansible.builtin.debug:
        msg:
          - "k3s test cluster is running on {{ inventory_hostname }}"
          - "Local kubeconfig: {{ k3s_kubeconfig_local }}"
          - "Next: export KUBECONFIG={{ k3s_kubeconfig_local }} && kubectl get nodes"
          - "Rollback: /usr/local/bin/k3s-uninstall.sh on the server"
