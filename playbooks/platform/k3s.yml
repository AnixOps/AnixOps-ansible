---
# =============================================================================
# Production k3s deployment | 生产环境 k3s 部署
# =============================================================================
# Scope      : k8s_servers (one host at a time, any failure stops the batch)
# Risk       : HIGH - installs a real Kubernetes control plane
# Rollback   : /usr/local/bin/k3s-uninstall.sh on the server
# Pre-flight : OS family, architecture, memory >= 1024 MB, port 6443 free unless
#              k3s is already installed
# Post-check : k8s_provision verification + kubeconfig fetched to the controller
#
# Usage | 使用:
#   ansible-playbook -i inventories/production/hosts.yml playbooks/platform/k3s.yml
#   ansible-playbook ... -e k3s_fetch_kubeconfig=false     # skip the local kubeconfig copy
#
# Tags: k3s (all plays), k3s_preflight, k3s_provision, k3s_verify
# =============================================================================

- name: Pre-flight checks for k3s hosts
  hosts: k8s_servers
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - k3s
    - k3s_preflight

  tasks:
    - name: Show target summary
      ansible.builtin.debug:
        msg:
          - "Target: {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})"
          - "Location: {{ location | default('Unknown') }}, environment: {{ server_environment | default('unknown') }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_architecture }})"
          - "Memory: {{ ansible_memtotal_mb }} MB, k8s role: {{ k8s_role | default('master') }}"

    - name: Assert the host meets the k3s requirements
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - ansible_architecture in ['x86_64', 'aarch64']
          - ansible_memtotal_mb | int >= 1024
        fail_msg: >-
          {{ inventory_hostname }} does not meet the k3s requirements: Debian/Ubuntu on x86_64 or aarch64 with at
          least 1024 MB RAM (found {{ ansible_distribution }} {{ ansible_architecture }}, {{ ansible_memtotal_mb }} MB).
        quiet: true

    - name: Check whether k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_preflight_binary

    - name: Ensure the API server port is free on a fresh host
      when: not k3s_preflight_binary.stat.exists
      block:
        - name: Probe port 6443
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 6443
            state: stopped
            timeout: 3
      rescue:
        - name: Fail because port 6443 is already in use
          ansible.builtin.fail:
            msg: >-
              Port 6443 is in use on {{ inventory_hostname }} but k3s is not installed. Stop the process that
              owns it (ss -ltnp 'sport = :6443') before provisioning.

- name: Provision the k3s cluster
  hosts: k8s_servers
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - k3s
    - k3s_provision

  tasks:
    - name: Provision k3s with the k8s_provision role
      ansible.builtin.import_role:
        name: k8s_provision
      vars:
        k8s_provision_provider: k3s

- name: Verify k3s and fetch the kubeconfig
  hosts: k8s_servers
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - k3s
    - k3s_verify

  vars:
    k3s_kubeconfig_remote: "{{ kubeconfig_remote_path | default('/etc/rancher/k3s/k3s.yaml') }}"
    k3s_kubeconfig_local: "{{ kubeconfig_local_path | default('~/.kube/k3s-' ~ inventory_hostname ~ '.yaml') }}"

  tasks:
    - name: Wait for the k3s node to be Ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=60s
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_remote }}"
      register: k3s_nodes_ready
      changed_when: false
      retries: 10
      delay: 10
      until: k3s_nodes_ready.rc == 0
      when: k8s_role | default('master') not in ['worker', 'agent']

    - name: Fetch the kubeconfig to the controller
      when:
        - k3s_fetch_kubeconfig | default(true) | bool
        - k8s_role | default('master') not in ['worker', 'agent']
      block:
        - name: Fetch the kubeconfig
          ansible.builtin.fetch:
            src: "{{ k3s_kubeconfig_remote }}"
            dest: "{{ k3s_kubeconfig_local }}"
            flat: true

        - name: Restrict the local kubeconfig permissions
          ansible.builtin.file:
            path: "{{ k3s_kubeconfig_local }}"
            mode: "0600"
          delegate_to: localhost
          become: false

        - name: Point the local kubeconfig at the server address
          ansible.builtin.replace:
            path: "{{ k3s_kubeconfig_local }}"
            regexp: 'server: https://127\.0\.0\.1:6443'
            replace: "server: https://{{ ansible_host | default(inventory_hostname) }}:6443"
          delegate_to: localhost
          become: false

    - name: Show the deployment summary
      ansible.builtin.debug:
        msg:
          - "k3s is running on {{ inventory_hostname }} ({{ k8s_role | default('master') }})"
          - "Local kubeconfig: {{ k3s_kubeconfig_local }} (export KUBECONFIG=... && kubectl get nodes)"
          - "Server files: {{ k3s_kubeconfig_remote }}, /etc/rancher/k3s/config.yaml"
          - "Rollback: /usr/local/bin/k3s-uninstall.sh"
