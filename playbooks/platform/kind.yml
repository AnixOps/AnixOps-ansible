---
# =============================================================================
# Local kind cluster | 本地 kind 集群
# =============================================================================
# Scope      : k8s_local (localhost, connection: local)
# Risk       : LOW - local development only
# Rollback   : kind delete cluster --name <kind_cluster_name>
# Pre-flight : k8s_provision prerequisites (Docker daemon, pinned kind + kubectl)
# Post-check : k8s_provision verification
#
# Runs as the invoking user (become: false) because kind talks to the user's Docker
# daemon; the role elevates only to install binaries under /usr/local/bin.
# No Helm and no application deployment: use kubectl apply -f <manifest> afterwards.
#
# Usage | 使用:
#   ansible-playbook -i inventories/development/hosts.yml playbooks/platform/kind.yml
#   bash scripts/anixops.sh deploy-local
#
# Tags: kind
# =============================================================================

- name: Provision the local kind cluster
  hosts: k8s_local
  become: false
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags:
    - kind

  tasks:
    - name: Show target summary
      ansible.builtin.debug:
        msg:
          - "Target: {{ inventory_hostname }} (provider: kind)"
          - "Cluster: {{ kind_cluster_name | default('anixops-dev') }}"

    - name: Provision kind with the k8s_provision role
      ansible.builtin.import_role:
        name: k8s_provision
      vars:
        k8s_provision_provider: kind

    - name: Show the deployment summary
      ansible.builtin.debug:
        msg:
          - "kind cluster {{ kind_cluster_name | default('anixops-dev') }} is ready"
          - "Context: kubectl cluster-info --context kind-{{ kind_cluster_name | default('anixops-dev') }}"
          - "Rollback: kind delete cluster --name {{ kind_cluster_name | default('anixops-dev') }}"
