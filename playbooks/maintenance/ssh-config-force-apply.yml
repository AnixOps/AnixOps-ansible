---
# =============================================================================
# Force apply SSH configuration | 强制应用 SSH 配置
# =============================================================================
# Re-applies the SSH configuration through the common role (which validates
# the rendered sshd_config and rolls back on failure), then restarts sshd
# unconditionally and waits for the port to come back from the controller.
#
# WARNING: sshd is restarted on every host, one host at a time. Established
# sessions normally survive, but keep a second session open while running it.
#
#   ansible-playbook playbooks/maintenance/ssh-config-force-apply.yml
#   ansible-playbook playbooks/maintenance/ssh-config-force-apply.yml --limit jp-1
#   ansible-playbook playbooks/maintenance/ssh-config-force-apply.yml -e ssh_force_apply_no_pause=true
#
# Variables:
#   ssh_force_apply_no_pause  false  skip the 3 second pause before each restart
#   ssh_port                  22     port expected to answer after the restart
#
# Play tags: ssh
# Scope: all servers, serial 1, max_fail_percentage 0 (first failure stops the run)
# Rollback: ansible-playbook playbooks/maintenance/rollback.yml -e "rollback_role=common"
# Risk: HIGH (SSH lockout if the configuration or firewall is wrong)
# =============================================================================

- name: Force apply SSH configuration | 强制应用 SSH 配置
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags: [ssh]

  tasks:
    - name: Apply the SSH configuration through the common role | 通过 common 角色应用 SSH 配置
      ansible.builtin.include_role:
        name: common
        tasks_from: ssh.yml

    - name: Run the handlers notified by the role | 执行角色触发的处理程序
      ansible.builtin.meta: flush_handlers

    - name: Determine the SSH service unit | 确定 SSH 服务单元
      ansible.builtin.set_fact:
        ssh_force_apply_unit: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
        ssh_force_apply_port: "{{ ssh_port | default(ansible_port | default(22)) | int }}"

    - name: Pause before restarting SSH | 重启 SSH 前暂停
      ansible.builtin.pause:
        seconds: 3
        prompt: "Restarting {{ ssh_force_apply_unit }} on {{ inventory_hostname }} in 3 seconds (Ctrl+C to abort)"
      when:
        - not ansible_check_mode
        - not (ssh_force_apply_no_pause | default(false) | bool)

    - name: Restart the SSH service | 重启 SSH 服务
      ansible.builtin.systemd_service:
        name: "{{ ssh_force_apply_unit }}"
        state: restarted

    - name: Wait for the SSH port to accept connections | 等待 SSH 端口可连接
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ssh_force_apply_port | int }}"
        delay: 2
        timeout: 60
        state: started
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Collect service facts | 收集服务状态
      ansible.builtin.service_facts:

    - name: Assert the SSH service is running | 断言 SSH 服务正在运行
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][ssh_force_apply_unit ~ '.service']['state'] | default('absent') == 'running'
        fail_msg: >-
          {{ inventory_hostname }}: {{ ssh_force_apply_unit }}.service is
          {{ ansible_facts['services'][ssh_force_apply_unit ~ '.service']['state'] | default('absent') }}
          after the restart
        quiet: true
      when: not ansible_check_mode

    - name: Read the effective sshd settings | 读取生效的 sshd 设置
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: ssh_force_apply_effective
      changed_when: false
      check_mode: false

    - name: Show the SSH force apply summary | 显示 SSH 强制应用摘要
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ssh_force_apply_unit }} restarted, port {{ ssh_force_apply_port }} answering;
          {{ ssh_force_apply_effective.stdout_lines | default([])
             | select('match', '^(port|passwordauthentication|pubkeyauthentication|permitrootlogin|usepam) ')
             | join(', ') }}
