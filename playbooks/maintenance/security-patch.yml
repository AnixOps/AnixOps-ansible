---
# Weekly security patch workflow | 每周安全补丁流程
#
# For every target host (one at a time):
#   setup        -> gather facts, install/verify Trivy, refresh its vulnerability DB
#   scan-before  -> Trivy scan of OS packages (HIGH/CRITICAL by default)
#   remediate    -> apply OS updates (apt dist-upgrade / dnf security update),
#                   detect whether a reboot is pending, optionally reboot
#   scan-after   -> rescan to confirm what was fixed
#   summary      -> build the per-host summary dictionary
#   failure      -> (rescue) record a `scan_failed` summary with the error
#   cleanup      -> (always) remove the temporary installer
# Then, on localhost: report -> aggregate every host summary into a JSON report
# plus a Markdown summary that GitHub Actions turns into an issue / step summary.
#
# Scan-only mode:   -e security_patch_apply_updates=false
# Allow reboots:    -e security_patch_allow_reboot=true   (or per group in the inventory)
# See docs/SECURITY_PATCHING.md for the full variable reference and runbook.

- name: Weekly security vulnerability scan and remediation
  hosts: all:!localhost
  serial: 1
  become: true
  # Facts are gathered INSIDE the block (first task of setup.yml): with serial: 1 any
  # host that fails outside block/rescue ends the whole playbook (Ansible stops when
  # every host of a batch failed) and the report play would never run.
  gather_facts: false
  # The run must visit every host and report on all of them, so a failing host must
  # never stop the batch. Per-host failures are caught by the block/rescue below.
  max_fail_percentage: 100
  any_errors_fatal: false
  # ignore_unreachable is the ONE sanctioned exception to the "fail loudly" rule:
  # an unreachable host is kept in the play, fails the facts check in setup.yml and is
  # recorded by failure.yml as `scan_failed` (unreachable: true); report.yml adds a
  # placeholder summary for hosts that produced no summary at all and counts both in
  # `unreachable_count`, so no host silently drops out of the report / GitHub issue.
  ignore_unreachable: true
  tags: [security_patch]

  vars:
    # Operator knobs. These are DEFAULTS only: the first pre_task resolves the
    # effective `security_patch_<knob>` per host, so every knob can be overridden per
    # host or group in the inventory (e.g. `security_patch_allow_reboot: true` in
    # group_vars/web_servers) or globally with `-e security_patch_<knob>=...`.
    # (Play-level vars would otherwise shadow inventory variables.)
    security_patch_defaults: &security_patch_defaults
      # false = scan-only: report findings but never install packages or reboot.
      apply_updates: true
      # true = reboot (ansible.builtin.reboot) when updates were applied and the OS
      # reports that a reboot is required.
      allow_reboot: false
      reboot_timeout: 600
      # Trivy severities to report on (comma separated, Trivy syntax).
      severity: "HIGH,CRITICAL"
      # How many post-remediation findings are embedded per host in the report.
      max_findings_in_report: 10
      # Seconds to wait for the dpkg/apt lock (unattended-upgrades may hold it).
      apt_lock_timeout: 300
      # RedHat family: true = only security errata (dnf --security), false = all updates.
      dnf_security_only: true
      # RedHat family: install dnf-utils so `needs-restarting -r` can detect pending reboots.
      install_dnf_utils: true
      # Trivy release tag to install, e.g. "v0.56.2" (empty = latest release). When the
      # installed Trivy does not match the pin it is reinstalled.
      trivy_version: ""
      trivy_install_script: "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh"
      # Optional checksum for the installer script, e.g. "sha256:<hex>" (empty = no check).
      trivy_installer_checksum: ""
      trivy_installer_path: "/tmp/trivy-install.sh"
      trivy_bin: "/usr/local/bin/trivy"
      trivy_cache_dir: "/var/cache/trivy"
      # Refresh the vulnerability DB once before scanning (predictable scan time); the
      # scans then run with --skip-db-update.
      trivy_update_db: true
      # Optional alternative DB registry (Trivy --db-repository), e.g. a mirror.
      trivy_db_repository: ""
      trivy_timeout: "15m"
      # Directories excluded from the filesystem walk (container layers and snaps are
      # not host packages); the cache dir is always excluded as well.
      trivy_skip_dirs:
        - /var/lib/docker
        - /var/lib/containerd
        - /snap

    # --- Derived (not knobs) ------------------------------------------------------
    security_patch_trivy_summarizer: "{{ playbook_dir }}/../../scripts/summarize_trivy.py"
    # Shared scan command line; scan-before/scan-after append the target path.
    security_patch_trivy_scan_argv:
      - "{{ security_patch_trivy_bin }}"
      - fs
      - --quiet
      - --no-progress
      - --cache-dir
      - "{{ security_patch_trivy_cache_dir }}"
      - --format
      - json
      - --exit-code
      - "0"
      - --timeout
      - "{{ security_patch_trivy_timeout }}"
      - --severity
      - "{{ security_patch_severity }}"
      - --pkg-types
      - os
      - --scanners
      - vuln
      - --skip-dirs
      - "{{ (security_patch_trivy_skip_dirs + [security_patch_trivy_cache_dir]) | join(',') }}"
    security_patch_trivy_optional_argv: >-
      {{
        (['--skip-db-update'] if security_patch_trivy_update_db | bool else [])
        + (['--db-repository', security_patch_trivy_db_repository]
           if security_patch_trivy_db_repository | length > 0 else [])
      }}

  pre_tasks:
    - name: Resolve effective security patch settings
      ansible.builtin.set_fact:
        security_patch_apply_updates: >-
          {{ security_patch_apply_updates | default(security_patch_defaults.apply_updates) | bool }}
        security_patch_allow_reboot: >-
          {{ security_patch_allow_reboot | default(security_patch_defaults.allow_reboot) | bool }}
        security_patch_reboot_timeout: >-
          {{ security_patch_reboot_timeout | default(security_patch_defaults.reboot_timeout) | int }}
        security_patch_severity: >-
          {{ security_patch_severity | default(security_patch_defaults.severity) }}
        security_patch_max_findings_in_report: >-
          {{ security_patch_max_findings_in_report | default(security_patch_defaults.max_findings_in_report) | int }}
        security_patch_apt_lock_timeout: >-
          {{ security_patch_apt_lock_timeout | default(security_patch_defaults.apt_lock_timeout) | int }}
        security_patch_dnf_security_only: >-
          {{ security_patch_dnf_security_only | default(security_patch_defaults.dnf_security_only) | bool }}
        security_patch_install_dnf_utils: >-
          {{ security_patch_install_dnf_utils | default(security_patch_defaults.install_dnf_utils) | bool }}
        security_patch_trivy_version: >-
          {{ security_patch_trivy_version | default(security_patch_defaults.trivy_version) | string }}
        security_patch_trivy_install_script: >-
          {{ security_patch_trivy_install_script | default(security_patch_defaults.trivy_install_script) }}
        security_patch_trivy_installer_checksum: >-
          {{ security_patch_trivy_installer_checksum | default(security_patch_defaults.trivy_installer_checksum) }}
        security_patch_trivy_installer_path: >-
          {{ security_patch_trivy_installer_path | default(security_patch_defaults.trivy_installer_path) }}
        security_patch_trivy_bin: >-
          {{ security_patch_trivy_bin | default(security_patch_defaults.trivy_bin) }}
        security_patch_trivy_cache_dir: >-
          {{ security_patch_trivy_cache_dir | default(security_patch_defaults.trivy_cache_dir) }}
        security_patch_trivy_update_db: >-
          {{ security_patch_trivy_update_db | default(security_patch_defaults.trivy_update_db) | bool }}
        security_patch_trivy_db_repository: >-
          {{ security_patch_trivy_db_repository | default(security_patch_defaults.trivy_db_repository) }}
        security_patch_trivy_timeout: >-
          {{ security_patch_trivy_timeout | default(security_patch_defaults.trivy_timeout) }}
        security_patch_trivy_skip_dirs: >-
          {{ security_patch_trivy_skip_dirs | default(security_patch_defaults.trivy_skip_dirs) }}

    - name: Initialize security patch facts
      ansible.builtin.set_fact:
        security_patch_trivy_version_detected: "unknown"
        security_patch_findings_before: []
        security_patch_findings_after: []
        security_patch_before_patchable_count: 0
        security_patch_before_unpatchable_count: 0
        security_patch_after_patchable_count: 0
        security_patch_after_unpatchable_count: 0
        security_patch_reboot_required: false
        security_patch_rebooted: false
        security_patch_update_result:
          rc: 0
          changed: false
          stdout: ""
          stderr: ""
        security_patch_summary:
          host: "{{ inventory_hostname }}"
          os_family: "{{ ansible_os_family | default('unknown') }}"
          pkg_mgr: "{{ ansible_pkg_mgr | default('unknown') }}"
          status: "pending"
          alert_reason: ""
          before_count: 0
          before_patchable_count: 0
          before_unpatchable_count: 0
          after_count: 0
          after_patchable_count: 0
          after_unpatchable_count: 0
          update_rc: 0
          update_changed: false
          reboot_required: false
          rebooted: false
          apply_updates: "{{ security_patch_apply_updates | bool }}"
          severity: "{{ security_patch_severity }}"
          trivy_version: "unknown"
          unreachable: false
          findings: []

  tasks:
    - name: Scan, remediate and summarize the host
      block:
        - name: Run security patch setup tasks
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/setup.yml"

        - name: Run pre-remediation security patch scan
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/scan-before.yml"

        - name: Run remediation tasks
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/remediate.yml"

        - name: Run post-remediation security patch scan
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/scan-after.yml"

        - name: Build host summary
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/summary.yml"

      rescue:
        - name: Record scan failure summary
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/failure.yml"

      always:
        - name: Remove temporary Trivy installer
          ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/cleanup.yml"

- name: Publish security patch report
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags: [security_patch, report]

  vars:
    # Same defaults as the host play (YAML anchor); report.yml falls back to them for
    # the report header and for placeholder summaries. -e overrides reach both plays.
    security_patch_defaults: *security_patch_defaults
    security_patch_report_path: "{{ playbook_dir }}/../../security-patch-report.json"
    security_patch_report_markdown_path: "{{ security_patch_report_path | regex_replace('\\.json$', '') ~ '.md' }}"

  tasks:
    - name: Assemble security patch report
      ansible.builtin.include_tasks: "{{ playbook_dir }}/security-patch/report.yml"
