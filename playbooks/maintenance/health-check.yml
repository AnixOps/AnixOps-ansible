---
# =============================================================================
# Health check | 健康检查
# =============================================================================
# Read-only verification of every managed server. This is the single health
# playbook: site.yml and quick-setup.yml import it as their post-check.
#
#   ansible-playbook playbooks/maintenance/health-check.yml
#   ansible-playbook playbooks/maintenance/health-check.yml --limit web_servers
#   ansible-playbook playbooks/maintenance/health-check.yml -e health_check_report_path=./health-report.json
#   ansible-playbook playbooks/maintenance/health-check.yml -e health_check_soft=true   # never fail
#
# Checks per host (units and endpoints depend on the host's groups):
#   - uptime, 1/5/15 min load, root filesystem usage, memory usage
#   - systemd units: ssh|sshd, chrony|chronyd, node_exporter, promtail (all),
#     nginx (web_servers), prometheus, loki, grafana-server (observability),
#     postgresql@<version>-<cluster> (postgres_servers), v2board when the unit exists (v2board_servers),
#     V2bX (v2bx_servers)
#   - HTTP 200 on 127.0.0.1: node_exporter :9100/metrics, promtail :9080/ready (all),
#     nginx :80/health (web_servers), prometheus :9090/-/healthy, loki :3100/ready,
#     grafana :3000/api/health (observability)
# A host fails when a unit is not running, an endpoint does not answer 200, or
# disk/memory usage reaches the thresholds below.
#
# Variables (override with -e):
#   health_disk_warn_percent   85     root filesystem usage that fails the host
#   health_mem_warn_percent    90     memory usage that fails the host
#   health_check_timeout       5      seconds per endpoint probe
#   health_check_retries       3      endpoint probe attempts
#   health_check_delay         5      seconds between endpoint probe attempts
#   health_check_soft          false  print failures but do not fail the play
#   health_check_report_path   ""     when set, write an aggregated JSON report on the controller
#   health_check_base_only     false  only the baseline checks of group `all` (quick-setup sets this,
#                                     because it does not install the group services)
#
# Scope: all servers, serial 100% (read-only, parallel), max_fail_percentage 50
# Rollback: not applicable (nothing is changed on the hosts)
# Risk: LOW
# =============================================================================

- name: Health check | 健康检查
  hosts: all
  become: false
  gather_facts: true
  serial: "100%"
  max_fail_percentage: 50
  any_errors_fatal: false
  tags: [health]

  vars:
    # Groups whose checks apply to this host; quick-setup passes health_check_base_only=true.
    health_check_groups: "{{ ['all'] + ([] if health_check_base_only | default(false) | bool else group_names) }}"
    # Units (without .service) that must be running on every host of the group.
    health_required_services_by_group:
      all:
        - node_exporter
        - promtail
      web_servers:
        - nginx
      observability:
        - prometheus
        - loki
        - grafana-server
      postgres_servers:
        # postgresql.service is a oneshot wrapper (active/exited, reported as 'stopped'); the server runs
        # in the per-cluster instance unit. Keep the defaults in sync with roles/postgresql/defaults.
        - "postgresql@{{ postgresql_version | default('15') }}-{{ postgresql_cluster_name | default('main') }}"
      v2bx_servers:
        - V2bX
    # Units that are only checked when the unit exists on the host.
    health_optional_services_by_group:
      v2board_servers:
        - v2board
    # HTTP endpoints on the host itself that must answer 200.
    health_endpoints_by_group:
      all:
        - name: node_exporter
          url: "http://127.0.0.1:9100/metrics"
        - name: promtail
          url: "http://127.0.0.1:9080/ready"
      web_servers:
        - name: nginx
          url: "http://127.0.0.1:80/health"
      observability:
        - name: prometheus
          url: "http://127.0.0.1:9090/-/healthy"
        - name: loki
          url: "http://127.0.0.1:3100/ready"
        - name: grafana
          url: "http://127.0.0.1:3000/api/health"

  tasks:
    - name: Resolve the units and endpoints expected on this host | 解析本机应有的服务与端点
      ansible.builtin.set_fact:
        health_required_units: >-
          {{
            [('sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh'),
             ('chronyd' if ansible_facts['os_family'] == 'RedHat' else 'chrony')]
            + (health_required_services_by_group | dict2items
               | selectattr('key', 'in', health_check_groups)
               | map(attribute='value') | flatten | list)
          }}
        health_optional_units: >-
          {{
            health_optional_services_by_group | dict2items
            | selectattr('key', 'in', health_check_groups)
            | map(attribute='value') | flatten | list
          }}
        health_endpoints: >-
          {{
            health_endpoints_by_group | dict2items
            | selectattr('key', 'in', health_check_groups)
            | map(attribute='value') | flatten | list
          }}
        health_service_states: {}
        health_endpoint_states: {}
        health_check_failures: []

    - name: Collect service facts | 收集服务状态
      ansible.builtin.service_facts:

    - name: Read the load average | 读取系统负载
      ansible.builtin.slurp:
        src: /proc/loadavg
      register: health_loadavg

    - name: Record the state of each expected unit | 记录各预期单元的状态
      ansible.builtin.set_fact:
        health_service_states: "{{ health_service_states | combine({item: health_unit_state}) }}"
      vars:
        health_unit_facts: "{{ ansible_facts['services'][item ~ '.service'] | default({}) }}"
        health_unit_state: >-
          {{ 'absent' if (health_unit_facts | length == 0
                          or health_unit_facts['status'] | default('') == 'not-found')
             else health_unit_facts['state'] }}
      loop: "{{ (health_required_units + health_optional_units) | unique }}"

    - name: Probe the local HTTP endpoints | 探测本机 HTTP 端点
      ansible.builtin.uri:
        url: "{{ item.url }}"
        status_code: 200
        timeout: "{{ health_check_timeout | default(5) | int }}"
        return_content: false
      loop: "{{ health_endpoints }}"
      loop_control:
        label: "{{ item.name }} {{ item.url }}"
      register: health_endpoint_probe
      retries: "{{ health_check_retries | default(3) | int }}"
      delay: "{{ health_check_delay | default(5) | int }}"
      until: health_endpoint_probe.status | default(-1) == 200
      failed_when: false

    - name: Record the HTTP status of each endpoint | 记录各端点的 HTTP 状态
      ansible.builtin.set_fact:
        health_endpoint_states: >-
          {{ health_endpoint_states | combine({item.item.name: item.status | default(-1) | int}) }}
      loop: "{{ health_endpoint_probe.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Compute resource usage | 计算资源使用率
      ansible.builtin.set_fact:
        health_disk_used_percent: >-
          {{ ((100 - ((health_root_mount['size_available'] | int) * 100
                      / (health_root_mount['size_total'] | int))) | round | int)
             if (health_root_mount['size_total'] | default(0) | int) > 0 else -1 }}
        health_mem_used_percent: >-
          {{ ((health_mem_used_mb | int) * 100 / (ansible_facts['memtotal_mb'] | int)) | round | int }}
        health_load: "{{ (health_loadavg['content'] | b64decode).split()[0:3] | join('/') }}"
        health_uptime: >-
          {{ ((ansible_facts['uptime_seconds'] | int) // 86400) ~ 'd'
             ~ (((ansible_facts['uptime_seconds'] | int) % 86400) // 3600) ~ 'h' }}
      vars:
        health_root_mount: >-
          {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first | default({}) }}
        health_mem_used_mb: >-
          {{ ansible_facts['memory_mb']['nocache']['used']
             | default((ansible_facts['memtotal_mb'] | int) - (ansible_facts['memfree_mb'] | int)) }}

    - name: Flag expected units that are not running | 标记未运行的预期单元
      ansible.builtin.set_fact:
        health_check_failures: "{{ health_check_failures + ['unit ' ~ item.key ~ ' is ' ~ item.value] }}"
      loop: "{{ health_service_states | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value not in ['running', 'active']
        - not (item.key in health_optional_units and item.value == 'absent')

    - name: Flag endpoints that did not answer HTTP 200 | 标记未返回 HTTP 200 的端点
      ansible.builtin.set_fact:
        health_check_failures: "{{ health_check_failures + ['endpoint ' ~ item.key ~ ' returned ' ~ item.value] }}"
      loop: "{{ health_endpoint_states | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value | int != 200

    - name: Flag root filesystem usage above the threshold | 标记根文件系统使用率超限
      ansible.builtin.set_fact:
        health_check_failures: >-
          {{ health_check_failures
             + ['disk / at ' ~ health_disk_used_percent ~ '% (limit '
                ~ (health_disk_warn_percent | default(85)) ~ '%)'] }}
      when: health_disk_used_percent | int >= health_disk_warn_percent | default(85) | int

    - name: Flag memory usage above the threshold | 标记内存使用率超限
      ansible.builtin.set_fact:
        health_check_failures: >-
          {{ health_check_failures
             + ['memory at ' ~ health_mem_used_percent ~ '% (limit '
                ~ (health_mem_warn_percent | default(90)) ~ '%)'] }}
      when: health_mem_used_percent | int >= health_mem_warn_percent | default(90) | int

    - name: Build the host health summary | 构建主机健康摘要
      ansible.builtin.set_fact:
        health_check_summary:
          host: "{{ inventory_hostname }}"
          alias: "{{ server_alias | default(inventory_hostname) }}"
          groups: "{{ group_names }}"
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          uptime_seconds: "{{ ansible_facts['uptime_seconds'] | int }}"
          load: "{{ health_load }}"
          disk_used_percent: "{{ health_disk_used_percent | int }}"
          mem_used_percent: "{{ health_mem_used_percent | int }}"
          services: "{{ health_service_states }}"
          endpoints: "{{ health_endpoint_states }}"
          failures: "{{ health_check_failures }}"
          status: "{{ 'healthy' if health_check_failures | length == 0 else 'unhealthy' }}"
          checked_at: "{{ ansible_facts['date_time']['iso8601'] }}"

    - name: Show the host health summary | 显示主机健康摘要
      ansible.builtin.debug:
        msg:
          - >-
            {{ inventory_hostname }} [{{ health_check_summary['status'] }}] {{ health_check_summary['os'] }},
            up {{ health_uptime }}, load {{ health_load }}, disk / {{ health_disk_used_percent }}%,
            mem {{ health_mem_used_percent }}%
          - "units: {{ health_service_states.items() | map('join', '=') | join(', ') }}"
          - "endpoints: {{ health_endpoint_states.items() | map('join', '=') | join(', ') or 'none' }}"
          - "failures: {{ health_check_failures | join('; ') or 'none' }}"

    - name: Write the aggregated health report on the controller | 在控制节点写入汇总健康报告
      when: health_check_report_path | default('') | length > 0
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Collect the host summaries | 收集各主机摘要
          ansible.builtin.set_fact:
            health_check_report_hosts: >-
              {{ health_check_report_hosts | default([])
                 + [hostvars[item]['health_check_summary'] | default(health_check_placeholder, true)] }}
          vars:
            health_check_placeholder:
              host: "{{ item }}"
              alias: "{{ hostvars[item]['server_alias'] | default(item) }}"
              status: "unknown"
              failures:
                - "no summary produced (unreachable or failed before reporting)"
          loop: "{{ ansible_play_hosts_all }}"

        - name: Build the aggregated report | 构建汇总报告
          ansible.builtin.set_fact:
            health_check_report:
              generated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
              total_hosts: "{{ health_check_report_hosts | length }}"
              healthy_count: "{{ health_check_report_healthy | length }}"
              unhealthy_count: "{{ health_check_report_hosts | length - health_check_report_healthy | length }}"
              hosts: "{{ health_check_report_hosts }}"
          vars:
            health_check_report_healthy: >-
              {{ health_check_report_hosts | selectattr('status', 'equalto', 'healthy') | list }}

        - name: Write the report file | 写入报告文件
          ansible.builtin.copy:
            dest: "{{ health_check_report_path }}"
            content: "{{ health_check_report | to_nice_json }}"
            mode: "0644"

    - name: Assert that the host is healthy | 断言主机健康
      ansible.builtin.assert:
        that:
          - health_check_failures | length == 0
        fail_msg: "{{ inventory_hostname }} is unhealthy: {{ health_check_failures | join('; ') }}"
        success_msg: "{{ inventory_hostname }} is healthy"
        quiet: true
      when: not (health_check_soft | default(false) | bool)
