# =============================================================================
# Firewall setup | 防火墙设置
# =============================================================================
# Applies the lockout-proof host firewall (roles/firewall) to every server:
#   - the SSH port (ansible_port / ssh_port) is always allowed first
#   - public ports (firewall_public_ports + proxy_additional_ports) are open
#   - restricted ports (firewall_restricted_ports) are reachable only from
#     monitoring_whitelist and denied for everyone else
#
# Scope: all servers, serial 30%, max_fail_percentage 25
# Risk: MEDIUM (firewall changes); mitigated by the SSH-first rule ordering and
#       the post-enable verification inside the role
# Rollback: `ufw disable` (Debian) / `systemctl stop firewalld` (RedHat), or
#       restore the /etc/ufw backups created by the role (see roles/firewall/README.md)
#
# Usage | 使用方法:
#   ansible-playbook playbooks/maintenance/firewall-setup.yml
#   ansible-playbook playbooks/maintenance/firewall-setup.yml --limit web_servers
#   ansible-playbook playbooks/maintenance/firewall-setup.yml --check --diff
#
# Knobs | 可调参数:
#   firewall_require_whitelist=true   fail before touching a host when restricted
#                                     ports are configured and the whitelist is empty
#   firewall_default_incoming_policy  allow (default) | deny | reject
# =============================================================================

- name: Configure firewall rules and monitoring whitelist | 配置防火墙规则和监控白名单
  hosts: all
  become: true
  gather_facts: true
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [firewall]

  pre_tasks:
    - name: Compute the effective firewall plan | 计算防火墙生效计划
      ansible.builtin.include_role:
        name: firewall
        tasks_from: preflight
      when: firewall_enabled | default(true) | bool

    - name: Show the effective firewall plan | 显示防火墙生效计划
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }} ({{ ansible_os_family }}), default incoming policy: {{ firewall_default_incoming_policy | default('allow') }}"
          - "SSH ports kept open: {{ firewall_ssh_ports | join(', ') }}"
          - "Public ports: {{ firewall_effective_public_ports | join(', ') }}"
          - "Restricted ports: {{ firewall_effective_restricted_ports | join(', ') | default('none', true) }}"
          - "Whitelist entries: {{ firewall_effective_whitelist | length }}"
      when: firewall_enabled | default(true) | bool

    - name: Require a non-empty monitoring whitelist | 要求监控白名单非空
      ansible.builtin.assert:
        that:
          - firewall_effective_whitelist | length > 0
        fail_msg: >-
          Monitoring whitelist is empty while restricted ports
          ({{ firewall_effective_restricted_ports | join(', ') }}) are configured. Set GLOBAL_WHITELIST_IPS /
          *_V4_SSH (see monitoring_allowed_ips in inventories/production/group_vars/all/main.yml) or run with
          -e firewall_require_whitelist=false to apply the deny rules without any whitelist.
        quiet: true
      when:
        - firewall_enabled | default(true) | bool
        - firewall_require_whitelist | default(true) | bool
        - firewall_effective_restricted_ports | length > 0

  roles:
    - role: firewall

  post_tasks:
    - name: Read the UFW status | 读取 UFW 状态
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      register: firewall_setup_ufw_status
      changed_when: false
      check_mode: false
      when:
        - firewall_enabled | default(true) | bool
        - ansible_os_family == 'Debian'

    - name: Read the firewalld zone configuration | 读取 firewalld 区域配置
      ansible.builtin.command:
        argv: [firewall-cmd, --list-all]
      register: firewall_setup_firewalld_status
      changed_when: false
      check_mode: false
      when:
        - firewall_enabled | default(true) | bool
        - ansible_os_family == 'RedHat'

    - name: Show the active firewall configuration | 显示当前防火墙配置
      ansible.builtin.debug:
        msg: "{{ (firewall_setup_ufw_status if ansible_os_family == 'Debian' else firewall_setup_firewalld_status).stdout_lines | default([]) }}"
      when: firewall_enabled | default(true) | bool

    - name: Firewall setup summary | 防火墙设置摘要
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: firewall {{ 'configured' if firewall_enabled | default(true) | bool else 'skipped (firewall_enabled=false)' }}"
          - "Public: {{ firewall_effective_public_ports | default([]) | join(', ') | default('n/a', true) }}"
          - "Restricted: {{ firewall_effective_restricted_ports | default([]) | join(', ') | default('none', true) }} -> {{ firewall_effective_whitelist | default([]) | length }} whitelisted address(es)"
          - "Verify from a whitelisted host: curl -s http://{{ ansible_host | default(inventory_hostname) }}:9100/metrics | head -1"
