---
# =============================================================================
# Repair the Docker apt repository | 修复 Docker apt 源
# =============================================================================
# Fixes "E: Conflicting values set for option Signed-By" on Debian/Ubuntu hosts
# by replacing legacy Docker keyrings and source lists with the layout from
# https://docs.docker.com/engine/install/debian/ (deb822 source + ASCII key).
#
# The playbook first probes `apt-get update`; it only repairs hosts whose apt
# output contains "Conflicting", unless fix_docker_force=true. Non-Debian
# hosts are skipped.
#
#   ansible-playbook playbooks/maintenance/fix-docker.yml
#   ansible-playbook playbooks/maintenance/fix-docker.yml -e fix_docker_force=true --limit pl-1
#
# Variables:
#   fix_docker_force  false  repair even when no apt conflict is detected
#
# Play tags: docker
# Scope: all servers (Debian family only), serial 30%, max_fail_percentage 25
# Rollback: restore /etc/apt/sources.list.d/docker.* from your own backup; the
#           removed legacy files are regenerated by the official Docker install steps
# Risk: LOW (apt metadata only, no packages are installed or removed)
# =============================================================================

- name: Repair the Docker apt repository configuration | 修复 Docker apt 源配置
  hosts: all
  become: true
  gather_facts: true
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [docker]

  vars:
    fix_docker_keyring_path: /etc/apt/keyrings/docker.asc
    fix_docker_legacy_files:
      - /usr/share/keyrings/docker-archive-keyring.gpg
      - /etc/apt/keyrings/docker.gpg
      - /etc/apt/sources.list.d/docker.list
      - /etc/apt/sources.list.d/docker-ce.list

  tasks:
    - name: Probe apt for conflicting Docker sources | 探测 apt 中冲突的 Docker 源
      ansible.builtin.command:
        argv:
          - apt-get
          - update
      register: fix_docker_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Decide whether a repair is needed | 判断是否需要修复
      ansible.builtin.set_fact:
        fix_docker_needed: >-
          {{ ansible_facts['os_family'] == 'Debian'
             and ((fix_docker_force | default(false) | bool) or 'Conflicting' in fix_docker_probe_output) }}
      vars:
        fix_docker_probe_output: "{{ (fix_docker_probe.stdout | default('')) ~ (fix_docker_probe.stderr | default('')) }}"

    - name: Repair the Docker apt repository | 修复 Docker apt 源
      when: fix_docker_needed | bool
      block:
        - name: Remove legacy Docker keyrings and source lists | 移除旧的 Docker 密钥环和源列表
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ fix_docker_legacy_files }}"

        - name: Ensure the apt keyrings directory exists | 确保 apt 密钥环目录存在
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Download the official Docker GPG key | 下载官方 Docker GPG 密钥
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
            dest: "{{ fix_docker_keyring_path }}"
            owner: root
            group: root
            mode: "0644"
          register: fix_docker_key
          retries: 3
          delay: 5
          until: fix_docker_key is succeeded

        - name: Install python3-debian for deb822 source management | 安装 python3-debian 以管理 deb822 源
          ansible.builtin.apt:
            name: python3-debian
            state: present
            update_cache: true
          register: fix_docker_python_debian
          retries: 3
          delay: 10
          until: fix_docker_python_debian is succeeded

        - name: Configure the Docker apt source in deb822 format | 以 deb822 格式配置 Docker apt 源
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: stable
            architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
            signed_by: "{{ fix_docker_keyring_path }}"
            state: present
            mode: "0644"

        - name: Refresh the apt cache with the repaired sources | 使用修复后的源刷新 apt 缓存
          ansible.builtin.apt:
            update_cache: true
          register: fix_docker_apt_update
          retries: 3
          delay: 10
          until: fix_docker_apt_update is succeeded
          changed_when: false

    - name: Show the Docker apt repair summary | 显示 Docker apt 修复摘要
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ fix_docker_outcome }}
      vars:
        fix_docker_outcome: >-
          {{ 'not a Debian-family host, skipped' if ansible_facts['os_family'] != 'Debian'
             else ('Docker apt source repaired (key ' ~ fix_docker_keyring_path
                   ~ ', source /etc/apt/sources.list.d/docker.sources)')
             if fix_docker_needed | bool
             else 'no apt conflict detected, nothing changed' }}
