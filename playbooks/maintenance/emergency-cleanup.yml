---
# =============================================================================
# Legacy — stops cloudflared/warp-svc/headscale/tailscaled
# 遗留 — 停止 cloudflared / warp-svc / headscale / tailscaled
# =============================================================================
# One-off cleanup that was used before the Cloudflare Mesh migration to stop
# and disable the retired networking agents. Kept for reference; it only acts
# on units that exist on the host and leaves everything else untouched.
#
# WARNING: stopping these agents removes the connectivity they provide.
#
#   ansible-playbook playbooks/maintenance/emergency-cleanup.yml --limit <host>
#
# Play tags: legacy_cleanup
# Scope: all servers, serial 1, max_fail_percentage 0
# Rollback: systemctl enable --now <unit> on the affected host
# Risk: MEDIUM (connectivity loss on hosts that still rely on these agents)
# =============================================================================

- name: Stop retired network agents (legacy cleanup) | 停止已退役的网络代理（遗留清理）
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: false
  tags: [legacy_cleanup]

  vars:
    emergency_cleanup_units:
      - cloudflared
      - warp-svc
      - headscale
      - tailscaled

  tasks:
    - name: Collect service facts | 收集服务状态
      ansible.builtin.service_facts:

    - name: Determine which retired units exist on this host | 确定本机存在的已退役单元
      ansible.builtin.set_fact:
        emergency_cleanup_present: >-
          {{ emergency_cleanup_present | default([]) + [item] }}
      vars:
        emergency_cleanup_unit_facts: "{{ ansible_facts['services'][item ~ '.service'] | default({}) }}"
      loop: "{{ emergency_cleanup_units }}"
      when:
        - emergency_cleanup_unit_facts | length > 0
        - emergency_cleanup_unit_facts['status'] | default('') not in ['not-found', 'masked']

    - name: Stop and disable the retired units | 停止并禁用已退役单元
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ emergency_cleanup_present | default([]) }}"

    - name: Show the cleanup summary | 显示清理摘要
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: stopped and disabled
          {{ emergency_cleanup_present | default([]) | join(', ') or 'nothing (no retired units present)' }}
