---
# =============================================================================
# Lifecycle management playbook | 服务生命周期管理
# =============================================================================
# One entry point for status / deploy / rollback / cleanup of a service role,
# driven by roles/lifecycle (versioned snapshot directories with manifests +
# JSON state/history under /var/lib/anixops/state).
#
# Exactly ONE action tag is required:
#   --tags status    show version, service state, history, snapshot count
#   --tags deploy    pre_deploy hook -> include the service role -> post_deploy hook
#   --tags rollback  pre_rollback hook -> post_rollback hook
#   --tags cleanup   cleanup hook (needs -e cleanup_confirm=yes)
#
# Usage | 用法:
#   ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role=nginx --tags status
#   ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role=prometheus \
#     --tags deploy --limit observability
#   ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role=nginx \
#     -e lifecycle_version=prev --tags rollback --limit jp-1
#   ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role=loki \
#     -e cleanup_confirm=yes --tags cleanup --limit jp-1
#
# Variables | 变量:
#   lifecycle_target_role   (required) nginx, common, prometheus, loki, grafana, node_exporter,
#                           promtail, firewall, acme_ssl, postgresql, v2board, v2bx, speedtest
#   lifecycle_target_hosts  host pattern (default all) - normally narrowed further with --limit
#   lifecycle_serial        batch size (default 1); lifecycle_max_fail: max failed % (default 0)
#   lifecycle_version       rollback target: prev (default) | initial | v<YYYYMMDDTHHMMSS>
#   lifecycle_dry_run=true  rollback/cleanup only print their plan
#   lifecycle_confirm_all   true allows rollback/cleanup on more than lifecycle_max_hosts (1) hosts
#   cleanup_confirm=yes     required for cleanup; cleanup_keep_backups (5), cleanup_force,
#                           cleanup_keep_data (true), cleanup_keep_package (false)
#   The legacy flag -e lifecycle_hook_type=... is ignored: the action tag selects the hooks.
# =============================================================================

- name: Lifecycle management | 生命周期管理
  hosts: "{{ lifecycle_target_hosts | default('all') }}"
  serial: "{{ lifecycle_serial | default(1) }}"
  max_fail_percentage: "{{ lifecycle_max_fail | default(0) }}"
  any_errors_fatal: false
  become: true
  gather_facts: true
  tags: [lifecycle]
  vars:
    lifecycle_actions: [status, deploy, rollback, cleanup]
    lifecycle_requested_actions: "{{ ansible_run_tags | intersect(lifecycle_actions) }}"
    lifecycle_action: "{{ lifecycle_requested_actions | first | default('none') }}"

  pre_tasks:
    - name: Validate lifecycle parameters | 校验参数
      ansible.builtin.fail:
        msg: >-
          Usage: ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role=<role>
          --tags <status|deploy|rollback|cleanup> [--limit <host|group>].
          Exactly one action tag is required (got: {{ ansible_run_tags | join(', ') }});
          lifecycle_target_role={{ lifecycle_target_role | default('<undefined>') }}.
      when: >-
        lifecycle_target_role is not defined
        or lifecycle_target_role | length == 0
        or lifecycle_requested_actions | length != 1
      tags: [always]

    - name: Refuse fleet-wide rollback or cleanup without confirmation | 拒绝未经确认的批量回滚/清理
      ansible.builtin.fail:
        msg: >-
          {{ lifecycle_action }} would run on {{ ansible_play_hosts_all | length }} hosts
          ({{ ansible_play_hosts_all | join(', ') }}) but lifecycle_max_hosts is
          {{ lifecycle_max_hosts | default(1) }}. Narrow the target with --limit <host> or pass
          -e lifecycle_confirm_all=true to confirm the fleet-wide operation.
      run_once: true
      when:
        - lifecycle_action in ['rollback', 'cleanup']
        - ansible_play_hosts_all | length > lifecycle_max_hosts | default(1) | int
        - not lifecycle_confirm_all | default(false) | bool
      tags: [always]

    - name: Show lifecycle operation | 显示操作信息
      ansible.builtin.debug:
        msg: >-
          lifecycle {{ lifecycle_action }} | role={{ lifecycle_target_role }}
          host={{ inventory_hostname }} ({{ ansible_play_hosts_all | length }} host(s) in play)
          {{ 'version=' ~ lifecycle_version if lifecycle_version is defined else '' }}
      tags: [always]

  tasks:
    # --- status ---------------------------------------------------------------
    - name: Show service status | 查看服务状态
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [status]
      vars:
        lifecycle_hook: status
      tags: [status]

    # --- deploy: pre_deploy -> service role -> post_deploy ------------------
    - name: Run pre-deploy hook | 执行部署前 hook
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [deploy]
      vars:
        lifecycle_hook: pre_deploy
      tags: [deploy]

    - name: Deploy the target role | 部署目标角色
      ansible.builtin.include_role:
        name: "{{ lifecycle_target_role }}"
        apply:
          tags: [deploy]
      tags: [deploy]

    - name: Run post-deploy hook | 执行部署后 hook
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [deploy]
      vars:
        lifecycle_hook: post_deploy
      tags: [deploy]

    # --- rollback: pre_rollback -> post_rollback -------------------------------
    - name: Run pre-rollback hook | 执行回滚前 hook
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [rollback]
      vars:
        lifecycle_hook: pre_rollback
      tags: [rollback]

    - name: Run post-rollback hook | 执行回滚后 hook
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [rollback]
      vars:
        lifecycle_hook: post_rollback
      tags: [rollback]

    # --- cleanup ----------------------------------------------------------------
    - name: Run cleanup hook | 执行清理 hook
      ansible.builtin.include_role:
        name: lifecycle
        apply:
          tags: [cleanup]
      vars:
        lifecycle_hook: cleanup
      tags: [cleanup]

  post_tasks:
    - name: Show lifecycle summary | 显示摘要
      ansible.builtin.debug:
        msg: >-
          lifecycle {{ lifecycle_action }} finished | role={{ lifecycle_target_role }}
          host={{ inventory_hostname }} result={{ lifecycle_result | default('completed') }}
      tags: [always]
