---
# Host summary | 主机汇总
# The summary is built as ONE Jinja expression so that counters stay integers and
# flags stay booleans in the JSON report (per-key templates would stringify them).
# Keys consumed by scripts/upsert_security_patch_issue.py and the tests: host, status,
# alert_reason, before_count, after_count, reboot_required, findings.

- name: Build host summary
  ansible.builtin.set_fact:
    security_patch_summary: >-
      {{
        {
          'host': inventory_hostname,
          'os_family': ansible_os_family,
          'pkg_mgr': ansible_pkg_mgr | default('unknown'),
          'status': security_patch_status,
          'alert_reason': security_patch_alert_reason,
          'before_count': security_patch_before_total | int,
          'before_patchable_count': security_patch_before_patchable_count | int,
          'before_unpatchable_count': security_patch_before_unpatchable_count | int,
          'after_count': security_patch_after_total | int,
          'after_patchable_count': security_patch_after_patchable_count | int,
          'after_unpatchable_count': security_patch_after_unpatchable_count | int,
          'update_rc': security_patch_update_result.rc | default(0) | int,
          'update_changed': security_patch_update_result.changed | default(false) | bool,
          'reboot_required': security_patch_reboot_required | default(false) | bool,
          'rebooted': security_patch_rebooted | default(false) | bool,
          'apply_updates': security_patch_apply_updates | bool,
          'severity': security_patch_severity,
          'trivy_version': security_patch_trivy_version_detected | default('unknown'),
          'unreachable': false,
          'findings': security_patch_findings_after[:(security_patch_max_findings_in_report | int)]
        }
      }}
  vars:
    security_patch_before_total: "{{ security_patch_findings_before | length }}"
    security_patch_after_total: "{{ security_patch_findings_after | length }}"
    security_patch_severity_words: "{{ security_patch_severity | lower | replace(',', ' or ') }}"
    security_patch_status: >-
      {{
        'needs_attention' if security_patch_after_total | int > 0
        else 'patched' if security_patch_before_total | int > 0
        else 'clean'
      }}
    security_patch_alert_reason: >-
      {{
        'updates were not applied (scan-only mode) and vulnerabilities remain'
        if security_patch_after_total | int > 0 and not security_patch_apply_updates | bool
        else 'package update command failed and vulnerabilities remain'
        if security_patch_after_total | int > 0 and (security_patch_update_result.rc | default(0) | int) != 0
        else 'patchable vulnerabilities remain after remediation'
        if security_patch_after_total | int > 0 and security_patch_after_patchable_count | int > 0
        else 'vulnerabilities remain without a package fix'
        if security_patch_after_total | int > 0
        else 'security updates were applied successfully; reboot required to complete'
        if security_patch_before_total | int > 0 and security_patch_reboot_required | default(false) | bool
        else 'security updates were applied successfully'
        if security_patch_before_total | int > 0
        else 'no ' ~ security_patch_severity_words ~ ' OS vulnerabilities found'
      }}

- name: Show host summary
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: status={{ security_patch_summary.status }}
      before={{ security_patch_summary.before_count }} after={{ security_patch_summary.after_count }}
      reboot_required={{ security_patch_summary.reboot_required }} rebooted={{ security_patch_summary.rebooted }}
      ({{ security_patch_summary.alert_reason }})
