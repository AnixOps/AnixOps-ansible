---
# Failure summary (rescue) | 失败汇总
# Produces the same keys as summary.yml with status `scan_failed` and the error
# message of the failed task as alert_reason, so the report never misses a host.

- name: Record scan failure summary
  ansible.builtin.set_fact:
    security_patch_summary: >-
      {{
        {
          'host': inventory_hostname,
          'os_family': ansible_os_family | default('unknown'),
          'pkg_mgr': ansible_pkg_mgr | default('unknown'),
          'status': 'scan_failed',
          'alert_reason': security_patch_failure_reason | trim | truncate(500),
          'before_count': security_patch_findings_before | default([]) | length,
          'before_patchable_count': security_patch_before_patchable_count | default(0) | int,
          'before_unpatchable_count': security_patch_before_unpatchable_count | default(0) | int,
          'after_count': security_patch_findings_after | default([]) | length,
          'after_patchable_count': security_patch_after_patchable_count | default(0) | int,
          'after_unpatchable_count': security_patch_after_unpatchable_count | default(0) | int,
          'update_rc': security_patch_update_result.rc | default(0) | int,
          'update_changed': security_patch_update_result.changed | default(false) | bool,
          'reboot_required': security_patch_reboot_required | default(false) | bool,
          'rebooted': security_patch_rebooted | default(false) | bool,
          'apply_updates': security_patch_apply_updates | bool,
          'severity': security_patch_severity,
          'trivy_version': security_patch_trivy_version_detected | default('unknown'),
          'placeholder': false,
          'findings': (security_patch_findings_after | default([]))[:(security_patch_max_findings_in_report | int)]
        }
      }}
  vars:
    security_patch_failure_reason: >-
      {{
        ansible_failed_result.msg
        | default(ansible_failed_result.stderr | default('security scan failed'))
      }}

- name: Show scan failure summary
  ansible.builtin.debug:
    msg:
      - "Security patch run failed on {{ inventory_hostname }}"
      - "{{ security_patch_summary.alert_reason }}"
