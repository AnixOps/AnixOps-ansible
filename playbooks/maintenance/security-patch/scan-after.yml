---
# Post-remediation scan | 修复后扫描
# Same command line as scan-before.yml so the two result sets are comparable.

- name: Scan for vulnerabilities after remediation
  ansible.builtin.command:
    argv: "{{ security_patch_trivy_scan_argv + security_patch_trivy_optional_argv + ['/'] }}"
  register: security_patch_scan_after
  changed_when: false
  failed_when: false
  no_log: true

- name: Verify the post-remediation scan succeeded
  ansible.builtin.assert:
    that:
      - security_patch_scan_after.rc | default(1) | int == 0
      - security_patch_scan_after.stdout | default('') | length > 0
    quiet: true
    fail_msg: >-
      Trivy post-remediation scan failed on {{ inventory_hostname }}
      (rc={{ security_patch_scan_after.rc | default('n/a') }}):
      {{ security_patch_scan_after.stderr | default(security_patch_scan_after.msg | default(''))
         | trim | regex_replace('\n', ' | ') | truncate(500) }}

- name: Summarize post-remediation findings
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - python3
      - "{{ security_patch_trivy_summarizer }}"
    stdin: "{{ hostvars[inventory_hostname].security_patch_scan_after.stdout }}"
  register: security_patch_findings_after_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: Verify the post-remediation summarizer succeeded
  ansible.builtin.assert:
    that:
      - security_patch_findings_after_raw.rc | default(1) | int == 0
    quiet: true
    fail_msg: >-
      summarize_trivy.py failed for the post-remediation scan of {{ inventory_hostname }}
      (rc={{ security_patch_findings_after_raw.rc | default('n/a') }}):
      {{ security_patch_findings_after_raw.stderr | default(security_patch_findings_after_raw.msg | default(''))
         | trim | regex_replace('\n', ' | ') | truncate(500) }}

- name: Parse post-remediation findings
  ansible.builtin.set_fact:
    security_patch_findings_after: "{{ security_patch_findings_after_raw.stdout | from_json }}"
  no_log: true

- name: Count post-remediation findings
  ansible.builtin.set_fact:
    security_patch_after_patchable_count: >-
      {{ security_patch_findings_after | selectattr('fixed_version', 'match', '.+') | list | length }}
    security_patch_after_unpatchable_count: >-
      {{ security_patch_findings_after | rejectattr('fixed_version', 'match', '.+') | list | length }}
