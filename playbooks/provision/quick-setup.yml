---
# =============================================================================
# Quick setup | 快速设置
# =============================================================================
# Bootstrap new servers with the base stack only: common configuration,
# Node Exporter, Promtail and the firewall, followed by the health check.
# Use site.yml for the full deployment (web tier, observability, applications).
#
#   ansible-playbook playbooks/provision/quick-setup.yml
#   ansible-playbook playbooks/provision/quick-setup.yml --limit new-host
#   ansible-playbook playbooks/provision/quick-setup.yml --tags common,firewall
#
# Play tags: common, node_exporter, promtail, firewall, health
# Scope: all servers, serial 30%, max_fail_percentage 25
# Rollback: ansible-playbook playbooks/maintenance/rollback.yml -e "rollback_role=common"
# Risk: MEDIUM (all servers, limited scope)
# Pre-flight: OS family, Python 3 and free disk assertions (tag always)
# Post-check: playbooks/maintenance/health-check.yml (tag health, baseline checks only)
#
# Variables:
#   preflight_min_free_mb  1024  minimum free space on / required to continue
# =============================================================================

- name: Preflight checks | 部署前检查
  hosts: all
  become: false
  gather_facts: true
  serial: "100%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [always]

  tasks:
    - name: Assert the operating system family is supported | 断言操作系统受支持
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat']
        fail_msg: >-
          {{ inventory_hostname }}: unsupported OS family
          '{{ ansible_facts['os_family'] | default('unknown') }}' (supported: Debian, RedHat)
        quiet: true

    - name: Assert the remote interpreter is Python 3 | 断言远程解释器为 Python 3
      ansible.builtin.assert:
        that:
          - ansible_facts['python']['version']['major'] | int == 3
        fail_msg: >-
          {{ inventory_hostname }}: remote interpreter is Python
          {{ ansible_facts['python_version'] | default('unknown') }}, Python 3 is required
        quiet: true

    - name: Assert the root filesystem has enough free space | 断言根文件系统剩余空间充足
      ansible.builtin.assert:
        that:
          - preflight_root_free_mb | int >= preflight_min_free_mb | default(1024) | int
        fail_msg: >-
          {{ inventory_hostname }}: only {{ preflight_root_free_mb }} MB free on /
          (minimum {{ preflight_min_free_mb | default(1024) }} MB, override with -e preflight_min_free_mb=N)
        quiet: true
      vars:
        preflight_root_free_mb: >-
          {{ ((ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
              | map(attribute='size_available') | first | default(0)) | int) // 1048576 }}

    - name: Record the deployment start time | 记录部署开始时间
      ansible.builtin.set_fact:
        deploy_started_at: "{{ ansible_facts['date_time']['iso8601'] }}"

- name: Deploy common configuration | 部署通用配置
  hosts: all
  become: true
  gather_facts: false
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [common]

  pre_tasks:
    - name: Gather facts when the preflight cache is unavailable | 缺少预检事实时收集事实
      ansible.builtin.setup:
      when: ansible_facts['os_family'] is not defined
      tags: [always]

  roles:
    - role: common

- name: Deploy Node Exporter | 部署 Node Exporter
  hosts: all
  become: true
  gather_facts: false
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [node_exporter]

  pre_tasks:
    - name: Gather facts when the preflight cache is unavailable | 缺少预检事实时收集事实
      ansible.builtin.setup:
      when: ansible_facts['os_family'] is not defined
      tags: [always]

  roles:
    - role: node_exporter

- name: Deploy Promtail | 部署 Promtail
  hosts: all
  become: true
  gather_facts: false
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [promtail]

  pre_tasks:
    - name: Gather facts when the preflight cache is unavailable | 缺少预检事实时收集事实
      ansible.builtin.setup:
      when: ansible_facts['os_family'] is not defined
      tags: [always]

  roles:
    - role: promtail

- name: Configure the firewall | 配置防火墙
  hosts: all
  become: true
  gather_facts: false
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [firewall]

  pre_tasks:
    - name: Gather facts when the preflight cache is unavailable | 缺少预检事实时收集事实
      ansible.builtin.setup:
      when: ansible_facts['os_family'] is not defined
      tags: [always]

  roles:
    - role: firewall

- name: Run the post-setup health check | 运行设置后健康检查
  ansible.builtin.import_playbook: ../maintenance/health-check.yml
  vars:
    # quick-setup installs only the baseline, so group services (nginx, prometheus, ...) are not checked.
    health_check_base_only: true
  tags: [health]
