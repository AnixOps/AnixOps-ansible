---
# =============================================================================
# Web servers | Web 服务器
# =============================================================================
# Deploy Nginx on the web_servers group and verify the local /health endpoint
# served by the role's default site.
#
#   ansible-playbook playbooks/provision/web-servers.yml
#   ansible-playbook playbooks/provision/web-servers.yml --limit jp-1
#
# Play tags: nginx
# Scope: web_servers, serial 30%, max_fail_percentage 25
# Rollback: ansible-playbook playbooks/maintenance/rollback.yml -e "rollback_role=nginx"
# Risk: MEDIUM (web-facing servers)
# Post-check: HTTP 200 from http://127.0.0.1/health on every host
# =============================================================================

- name: Deploy Nginx web servers | 部署 Nginx Web 服务器
  hosts: web_servers
  become: true
  gather_facts: true
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [nginx]

  roles:
    - role: nginx

  post_tasks:
    - name: Verify the local Nginx health endpoint | 验证本机 Nginx 健康端点
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_port | default(80) }}/health"
        status_code: 200
        timeout: 5
      register: web_servers_nginx_health
      retries: 5
      delay: 5
      until: web_servers_nginx_health is succeeded

    - name: Show the web server summary | 显示 Web 服务器摘要
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] | default('no IPv4') }}):
          nginx healthy, HTTP {{ web_servers_nginx_health.status }} from /health
