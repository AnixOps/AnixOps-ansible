# -----------------------------------------------------------------------------
# 淇 Docker apt 閰嶇疆锛堝畼鏂规爣鍑嗭級 | Fix Docker apt configuration
# -----------------------------------------------------------------------------
- name: Fix Docker apt configuration | 淇 Docker apt 閰嶇疆
  hosts: all
  serial: "30%"
  max_fail_percentage: 25
  become: yes
  gather_facts: yes
  ignore_unreachable: yes
  tasks:
    - name: Check if apt has Docker conflict | 妫€鏌?apt 鏄惁鏈?Docker 閰嶇疆鍐茬獊
      ansible.builtin.shell: apt update 2>&1 | grep -q "Conflicting" && echo "conflict" || echo "ok"
      register: apt_check
      changed_when: false
      failed_when: false

    - name: Fix Docker apt configuration | 淇 Docker apt 閰嶇疆
      block:
        - name: Remove old/conflicting Docker GPG keys | 绉婚櫎鏃?鍐茬獊鐨?Docker GPG keys
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/share/keyrings/docker-archive-keyring.gpg
            - /etc/apt/keyrings/docker.gpg

        - name: Remove old Docker apt source files | 绉婚櫎鏃х殑 Docker apt source 鏂囦欢
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/docker-ce.list

        - name: Create keyrings directory | 鍒涘缓 keyrings 鐩綍
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Download Docker GPG key (official) |涓嬭浇 Docker GPG key (瀹樻柟)
          ansible.builtin.shell: |
            curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
              -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
          args:
            creates: /etc/apt/keyrings/docker.asc

        - name: Add Docker apt source (official DEB822 format) | 娣诲姞 Docker apt source (瀹樻柟鏍煎紡)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.sources
            content: |
              Types: deb
              URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
              Suites: {{ ansible_distribution_release }}
              Components: stable
              Signed-By: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Update apt cache | 鏇存柊 apt 缂撳瓨
          ansible.builtin.apt:
            update_cache: yes

        - name: Display fix result | 鏄剧ず淇缁撴灉
          ansible.builtin.debug:
            msg: |
              鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?              鉁?Docker apt 閰嶇疆宸蹭慨澶?| Docker apt config fixed
              瀹樻柟閰嶇疆 | Official Config:
              - GPG key: /etc/apt/keyrings/docker.asc
              - Source: /etc/apt/sources.list.d/docker.sources
              鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?      when:
        - ansible_os_family == 'Debian'
        - apt_check.stdout == "conflict"

