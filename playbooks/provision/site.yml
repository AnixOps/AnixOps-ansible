---
# =============================================================================
# AnixOps main playbook | AnixOps 主 Playbook
# =============================================================================
# Full deployment of every managed server. Each service is one play with
# exactly one tag, so `--tags <service>` deploys that service and nothing else.
#
#   ansible-playbook playbooks/provision/site.yml                      # everything
#   ansible-playbook playbooks/provision/site.yml --tags nginx         # one service
#   ansible-playbook playbooks/provision/site.yml --limit web_servers  # one group
#   ansible-playbook playbooks/provision/site.yml --check --diff       # dry run
#
# Play tags: common, node_exporter, promtail, firewall, nginx, prometheus,
#            loki, grafana, postgresql, v2board, v2bx, speedtest, health
# Scope: all servers, serial 30%, max_fail_percentage 25 (preflight runs on
#        every host at once and is tagged `always`)
# Rollback: ansible-playbook playbooks/maintenance/rollback.yml -e "rollback_role=<role>"
# Risk: HIGH (touches every server)
# Pre-flight: OS family, Python 3 and free disk assertions (tag always)
# Post-check: playbooks/maintenance/health-check.yml (tag health)
#
# Variables:
#   preflight_min_free_mb  1024  minimum free space on / required to continue
# =============================================================================

- name: Preflight checks | 部署前检查
  hosts: all
  become: false
  gather_facts: true
  serial: "100%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [always]

  tasks:
    - name: Assert the operating system family is supported | 断言操作系统受支持
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat']
        fail_msg: >-
          {{ inventory_hostname }}: unsupported OS family
          '{{ ansible_facts['os_family'] | default('unknown') }}' (supported: Debian, RedHat)
        quiet: true

    - name: Assert the remote interpreter is Python 3 | 断言远程解释器为 Python 3
      ansible.builtin.assert:
        that:
          - ansible_facts['python']['version']['major'] | int == 3
        fail_msg: >-
          {{ inventory_hostname }}: remote interpreter is Python
          {{ ansible_facts['python_version'] | default('unknown') }}, Python 3 is required
        quiet: true

    - name: Assert the root filesystem has enough free space | 断言根文件系统剩余空间充足
      ansible.builtin.assert:
        that:
          - preflight_root_free_mb | int >= preflight_min_free_mb | default(1024) | int
        fail_msg: >-
          {{ inventory_hostname }}: only {{ preflight_root_free_mb }} MB free on /
          (minimum {{ preflight_min_free_mb | default(1024) }} MB, override with -e preflight_min_free_mb=N)
        quiet: true
      vars:
        preflight_root_free_mb: >-
          {{ ((ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
              | map(attribute='size_available') | first | default(0)) | int) // 1048576 }}

    - name: Record the deployment start time | 记录部署开始时间
      ansible.builtin.set_fact:
        deploy_started_at: "{{ ansible_facts['date_time']['iso8601'] }}"

# -----------------------------------------------------------------------------
# Base system | 基础系统
# -----------------------------------------------------------------------------
- name: Deploy common configuration | 部署通用配置
  hosts: all
  become: true
  gather_facts: false
  serial: "30%"
  max_fail_percentage: 25
  any_errors_fatal: false
  tags: [common]

  pre_tasks:
    - name: Gather facts when the preflight cache is unavailable | 缺少预检事实时收集事实
      ansible.builtin.setup:
      when: ansible_facts['os_family'] is not defined
      tags: [always]

  roles:
    - role: common

