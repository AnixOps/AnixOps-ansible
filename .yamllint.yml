---
# yamllint configuration (also consumed by ansible-lint's yaml[*] rules).
extends: default

ignore: |
  .ansible/
  .cache/
  venv/
  .venv/
  node_modules/
  collections/

rules:
  line-length:
    max: 120
    level: warning
    allow-non-breakable-inline-mappings: true
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
