name: Write job summary
description: >-
  Appends a short markdown table (result, caller-provided fields, run link,
  actor, timestamp) to GITHUB_STEP_SUMMARY and echoes it to the log. Replaces
  the hand-rolled echo banners every deploy workflow used to carry.

inputs:
  title:
    description: Heading of the summary section.
    required: true
  status:
    description: Job status to report (pass job.status).
    required: true
  fields:
    description: >-
      Extra rows, one per line, in the form "Label: value". Empty lines are
      ignored. Pipe characters in values are escaped automatically.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Append summary table
      shell: bash
      env:
        SUMMARY_TITLE: ${{ inputs.title }}
        SUMMARY_STATUS: ${{ inputs.status }}
        SUMMARY_FIELDS: ${{ inputs.fields }}
      run: |
        set -euo pipefail
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        {
          echo "## ${SUMMARY_TITLE}"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Result | **${SUMMARY_STATUS}** |"
          while IFS= read -r line; do
            if [[ -z "${line// /}" ]]; then
              continue
            fi
            key="${line%%:*}"
            value="${line#*:}"
            value="${value# }"
            value="${value//|/\\|}"
            echo "| ${key} | ${value} |"
          done <<< "${SUMMARY_FIELDS}"
          echo "| Triggered by | ${GITHUB_ACTOR} |"
          echo "| Ref | \`${GITHUB_REF_NAME}\` |"
          echo "| Run | [${GITHUB_RUN_ID}](${run_url}) |"
          echo "| Finished | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          echo
        } | tee -a "${GITHUB_STEP_SUMMARY}"
