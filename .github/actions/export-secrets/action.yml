name: Export allow-listed secrets
description: >-
  Exports the repository/environment secrets whose NAMES match an allow-list
  regular expression into GITHUB_ENV, once per job. The inventory generator and
  the roles read their settings with lookup('env', ...), so every deploy step
  used to repeat a 40+ line "env:" block mapping each secret by hand. GitHub
  expressions cannot iterate the secrets context, which is why the serialised
  context (toJSON(secrets)) is handed to a tiny Python script that applies the
  allow-list and writes the heredoc form GITHUB_ENV needs for multi-line values
  (PEM certificates). The allow-list keeps unrelated secrets (GITHUB_TOKEN,
  cloud credentials of other workflows) out of the Ansible process. Secret
  values are never printed; only the exported names are logged.

inputs:
  secrets-json:
    description: The serialised secrets context. Pass toJSON(secrets) from the calling workflow.
    required: true
  allow-pattern:
    description: >-
      Python regular expression; a secret is exported when its name matches
      (re.search). The default covers the fleet SSH addresses, the Ansible
      connection settings and every application/observability secret the roles
      consume through lookup('env', ...).
    required: false
    default: >-
      ^[A-Z0-9_]+_V4_SSH$|^ANSIBLE_(USER|PORT)$|^V2BX_|^V2BOARD_|^PROMETHEUS_URL$|^LOKI_URL$|^GRAFANA_|^OBSERVABILITY_|^SSL_CERTIFICATE_|^ACME_|^CLOUDFLARE_|^FIREWALL_|^GLOBAL_WHITELIST_IPS$|^NOTIFICATION_WEBHOOK_URL$|^SLACK_WEBHOOK_URL$|^ANIXOPS_NODE_PLATFORM_|^SMTP_|^VULTR_API_KEY$

outputs:
  exported-names:
    description: Comma-separated names of the secrets that were exported (never their values).
    value: ${{ steps.export.outputs.exported-names }}
  exported-count:
    description: Number of secrets exported.
    value: ${{ steps.export.outputs.exported-count }}

runs:
  using: composite
  steps:
    - name: Export allow-listed secrets to GITHUB_ENV
      id: export
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
        ALLOW_PATTERN: ${{ inputs.allow-pattern }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/export_secrets.py"
