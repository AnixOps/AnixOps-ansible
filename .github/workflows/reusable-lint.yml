name: Reusable Lint

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          generate-inventory: "false"

      - name: Run yamllint (errors fail, warnings are informational)
        run: |
          set -euo pipefail
          # yamllint exits 1 only for error-level problems; warnings (line-length) are reported but do not fail.
          yamllint -c .yamllint.yml -f github .

      - name: Run ansible-lint (production profile, offline)
        run: |
          set -euo pipefail
          # Honours .ansible-lint (kinds, exclude_paths, empty skip_list). Collections were installed by setup-ansible.
          ansible-lint --offline

      - name: Check backup coverage of configuration templates
        run: |
          set -euo pipefail
          python3 scripts/check-backup-coverage.py

      - name: Encoding guard (UTF-8 without BOM, LF endings, no mojibake)
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          status=0

          # scan <label> <git grep args...>: fails the guard when any tracked text file matches.
          scan() {
            local label="$1"
            shift
            local matches rc=0
            matches="$(git grep -nI "$@" -- . 2>&1)" || rc=$?
            if (( rc == 0 )); then
              echo "::error::${label}"
              echo "${matches}"
              status=1
            elif (( rc != 1 )); then
              echo "::error::git grep failed while checking '${label}': ${matches}"
              status=1
            else
              echo "OK: ${label}"
            fi
          }

          # GBK-decoded UTF-8 leaves these characters behind; build the pattern from code points so this
          # workflow file itself never contains them.
          mojibake_pattern="$(python3 - <<'PY'
          code_points = (0x923A, 0x93C8, 0x95AE, 0x9428, 0x951B, 0x9286, 0x934F, 0x93B4, 0x6D60, 0x7481, 0x9359)
          print("|".join(chr(point) for point in code_points) + r"|\?[^ -~]")
          PY
          )"

          scan "UTF-8 byte order mark found" $'^\xEF\xBB\xBF'
          scan "CRLF line ending found" $'\r'
          scan "Mojibake (GBK-decoded UTF-8) or stray replacement character found" -E "${mojibake_pattern}"

          exit "${status}"
