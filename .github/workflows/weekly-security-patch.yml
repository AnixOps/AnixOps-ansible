name: Weekly Security Patch

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 04:00 UTC
  workflow_dispatch:
    inputs:
      target_group:
        description: 'Target servers'
        required: true
        type: choice
        options:
          - all
          - web_servers
          - proxy_servers
          - observability
          - dev_servers
          - v2bx_servers
          - v2board_servers
          - postgres_servers
        default: 'all'
      apply_updates:
        description: 'Apply the security updates (false = scan and report only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

# Shares the deploy-NodeX-<target> group with deploy.yml / lifecycle.yml; a running patch run is never cancelled.
concurrency:
  group: deploy-NodeX-${{ github.event.inputs.target_group || 'all' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  security-patch:
    name: Weekly security patch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: NodeX
    env:
      # Scheduled runs have no inputs: patch everything and apply updates.
      TARGET_GROUP: ${{ github.event.inputs.target_group || 'all' }}
      APPLY_UPDATES: ${{ github.event.inputs.apply_updates || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          generate-inventory: "false"

      - name: Create inventory from config
        run: |
          set -euo pipefail
          inventory_path="$RUNNER_TEMP/github-actions-hosts.yml"
          python3 tools/generate_inventory.py github-actions --output "$inventory_path"
          echo "ANSIBLE_INVENTORY=${inventory_path}" >> "${GITHUB_ENV}"

      - name: Run security patch playbook
        run: |
          set -euo pipefail
          INVENTORY_PATH="$RUNNER_TEMP/github-actions-hosts.yml"
          REPORT_PATH="$RUNNER_TEMP/security-patch-report.json"

          args=(
            playbooks/maintenance/security-patch.yml
            -i "$INVENTORY_PATH"
            --limit "${TARGET_GROUP},localhost"
            -e "security_patch_report_path=${REPORT_PATH}"
            -e "security_patch_target_group=${TARGET_GROUP}"
            -e "security_patch_apply_updates=${APPLY_UPDATES}"
          )
          printf 'Executing: ansible-playbook'
          printf ' %q' "${args[@]}"
          printf '\n'
          ansible-playbook "${args[@]}"

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Create or update security patch issue
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/security-patch-report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/upsert_security_patch_issue.py

      - name: Write security patch summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Weekly security patch
          status: ${{ job.status }}
          fields: |
            Playbook: `playbooks/maintenance/security-patch.yml`
            Target group: `${{ env.TARGET_GROUP }}`
            Apply updates: ${{ env.APPLY_UPDATES }}
            Trigger: ${{ github.event_name }}
