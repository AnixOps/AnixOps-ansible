name: Deploy

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        required: true
        type: choice
        options:
          - provision/site.yml
          - provision/quick-setup.yml
          - provision/web-servers.yml
          - maintenance/health-check.yml
          - maintenance/firewall-setup.yml
          - maintenance/lifecycle.yml
          - maintenance/emergency-cleanup.yml
        default: 'provision/site.yml'

      target_group:
        description: 'Target group (bounds the blast radius; limit_hosts must be members of it)'
        required: true
        type: choice
        options:
          - all
          - web_servers
          - proxy_servers
          - observability
          - dev_servers
          - v2bx_servers
          - v2board_servers
          - postgres_servers
        default: 'all'

      limit_hosts:
        description: 'Optional comma-separated host names inside target_group (e.g. jp-1,uk-1)'
        required: false
        type: string
        default: ''

      tags:
        description: 'Optional comma-separated play tags (e.g. nginx,firewall)'
        required: false
        type: string
        default: ''

      dry_run:
        description: 'Check mode with diff (no changes)'
        required: false
        type: boolean
        default: false

      verbosity:
        description: 'Ansible verbosity'
        required: false
        type: choice
        options:
          - v
          - vv
          - vvv
        default: 'v'

      confirm:
        description: 'Type "deploy" to confirm a real (non dry-run) deploy to target_group=all'
        required: false
        type: string
        default: ''

  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One deploy at a time per environment + target; a running deploy is never cancelled.
concurrency:
  group: deploy-NodeX-${{ github.event.inputs.target_group || 'all' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Code Quality Check
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/reusable-lint.yml
    permissions:
      contents: read

  deploy-manual:
    name: Deploy ${{ inputs.playbook }} to ${{ inputs.target_group }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: NodeX
    env:
      PLAYBOOK: ${{ inputs.playbook }}
      TARGET_GROUP: ${{ inputs.target_group }}
      LIMIT_HOSTS: ${{ inputs.limit_hosts }}
      PLAY_TAGS: ${{ inputs.tags }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERBOSITY: ${{ inputs.verbosity }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" != "true" && "${TARGET_GROUP}" == "all" && "${CONFIRM}" != "deploy" ]]; then
            echo "::error::A real deploy to target_group=all requires confirm=deploy (or enable dry_run)"
            exit 1
          fi
          if [[ -n "${LIMIT_HOSTS}" && ! "${LIMIT_HOSTS}" =~ ^[A-Za-z0-9_.,-]+$ ]]; then
            echo "::error::limit_hosts must be a comma-separated list of host names"
            exit 1
          fi
          if [[ -n "${PLAY_TAGS}" && ! "${PLAY_TAGS}" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            echo "::error::tags must be a comma-separated list of tag names"
            exit 1
          fi
          case "${VERBOSITY}" in
            v|vv|vvv) ;;
            *)
              echo "::error::verbosity must be one of v, vv, vvv"
              exit 1
              ;;
          esac
          echo "Inputs OK: playbook=${PLAYBOOK} target_group=${TARGET_GROUP} dry_run=${DRY_RUN}"
          echo "           limit_hosts=${LIMIT_HOSTS:-<none>} tags=${PLAY_TAGS:-<all>} verbosity=-${VERBOSITY}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve target hosts
        run: |
          set -euo pipefail
          mapfile -t members < <(
            ansible "${TARGET_GROUP}" --list-hosts | sed -e '1d' -e 's/^[[:space:]]*//' -e '/^$/d'
          )
          if (( ${#members[@]} == 0 )); then
            echo "::error::Target group '${TARGET_GROUP}' has no hosts in the generated inventory"
            exit 1
          fi
          member_of() {
            local candidate
            for candidate in "${members[@]}"; do
              if [[ "${candidate}" == "$1" ]]; then
                return 0
              fi
            done
            return 1
          }
          limit="${TARGET_GROUP}"
          if [[ -n "${LIMIT_HOSTS}" ]]; then
            IFS=',' read -ra wanted <<< "${LIMIT_HOSTS}"
            for host in "${wanted[@]}"; do
              if ! member_of "${host}"; then
                echo "::error::Host '${host}' is not a member of '${TARGET_GROUP}' (members: ${members[*]})"
                exit 1
              fi
            done
            limit="${LIMIT_HOSTS}"
          fi
          echo "LIMIT=${limit}" >> "${GITHUB_ENV}"
          echo "Deploy limit: ${limit} (group members: ${members[*]})"

      - name: Syntax-check the selected playbook
        run: |
          set -euo pipefail
          ansible-playbook --syntax-check "playbooks/${PLAYBOOK}"

      - name: Verify connectivity
        run: |
          set -euo pipefail
          ansible "${LIMIT}" -m ansible.builtin.ping -o

      - name: Run Ansible playbook
        run: |
          set -euo pipefail
          args=("playbooks/${PLAYBOOK}" --limit "${LIMIT}" "-${VERBOSITY}")
          if [[ -n "${PLAY_TAGS}" ]]; then
            args+=(--tags "${PLAY_TAGS}")
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--check --diff)
            echo "Dry run: check mode with diff, no changes will be made"
          fi
          printf 'Executing: ansible-playbook'
          printf ' %q' "${args[@]}"
          printf '\n'
          ansible-playbook "${args[@]}"

      - name: Post-deploy health check
        if: success() && !inputs.dry_run && inputs.playbook != 'maintenance/health-check.yml'
        run: |
          set -euo pipefail
          ansible-playbook playbooks/maintenance/health-check.yml --limit "${LIMIT}" "-${VERBOSITY}"

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Write deployment summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Deployment summary
          status: ${{ job.status }}
          fields: |
            Playbook: `${{ inputs.playbook }}`
            Target group: `${{ inputs.target_group }}`
            Limit: `${{ env.LIMIT || inputs.target_group }}`
            Tags: `${{ inputs.tags || 'all' }}`
            Dry run: ${{ inputs.dry_run }}
            Verbosity: -${{ inputs.verbosity }}

  deploy-tag:
    name: Deploy ${{ matrix.tag }} (tag ${{ github.ref_name }})
    needs: lint
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: NodeX
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # One entry per site.yml play tag, in dependency order (common first, database before panel).
        tag:
          - common
          - node_exporter
          - promtail
          - firewall
          - nginx
          - prometheus
          - loki
          - grafana
          - postgresql
          - v2board
          - v2bx
          - speedtest
    env:
      SITE_TAG: ${{ matrix.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Syntax-check site.yml
        run: |
          set -euo pipefail
          ansible-playbook --syntax-check playbooks/provision/site.yml

      - name: Deploy site.yml play
        run: |
          set -euo pipefail
          args=(playbooks/provision/site.yml --tags "${SITE_TAG}" -v)
          printf 'Executing: ansible-playbook'
          printf ' %q' "${args[@]}"
          printf '\n'
          ansible-playbook "${args[@]}"

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Write deployment summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Tag deployment (${{ matrix.tag }})
          status: ${{ job.status }}
          fields: |
            Playbook: `playbooks/provision/site.yml`
            Tag: `${{ matrix.tag }}`
            Release: `${{ github.ref_name }}`
            Dry run: false

  health-check-tag:
    name: Post-deploy health check (tag ${{ github.ref_name }})
    needs: deploy-tag
    if: github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: NodeX

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run health check
        run: |
          set -euo pipefail
          ansible-playbook playbooks/maintenance/health-check.yml -v

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Write health check summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Post-deploy health check
          status: ${{ job.status }}
          fields: |
            Playbook: `playbooks/maintenance/health-check.yml`
            Release: `${{ github.ref_name }}`
            Deploy result: ${{ needs.deploy-tag.result }}
