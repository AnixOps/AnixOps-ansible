            echo "馃梽锔? Deploying PostgreSQL..."
            echo "鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
            inventory_path="$RUNNER_TEMP/github-actions-hosts.yml"
            CMD="ansible-playbook playbooks/provision/site.yml"
            CMD="$CMD -i \"$inventory_path\""
