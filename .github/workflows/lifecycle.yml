name: Lifecycle Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Lifecycle action'
        required: true
        type: choice
        options:
          - status
          - deploy
          - rollback
          - cleanup
        default: 'status'

      role:
        description: 'Target role'
        required: true
        type: choice
        options:
          - common
          - nginx
          - node_exporter
          - promtail
          - prometheus
          - loki
          - grafana
          - postgresql
          - v2board
          - v2bx
          - speedtest
          - firewall
          - acme_ssl
        default: 'nginx'

      version:
        description: 'Rollback version (prev or vYYYYMMDD_HHMMSS)'
        required: false
        type: string
        default: 'prev'

      target_group:
        description: 'Target servers (group or single host)'
        required: true
        type: choice
        options:
          - all
          - web_servers
          - proxy_servers
          - observability
          - dev_servers
          - v2bx_servers
          - v2board_servers
          - postgres_servers
          - jp-1
          - uk-1
          - us-w-1
          - sg-1
          - hk-1
          - uk-2
          - pl-1
          - fr-1
        default: 'all'

      force:
        description: 'Force execution (required for rollback/cleanup on target_group=all)'
        required: false
        type: boolean
        default: false

      keep_backups:
        description: 'Number of backups to keep (cleanup only)'
        required: false
        type: number
        default: 5

permissions:
  contents: read

# Shares the deploy-NodeX-<target> group with deploy.yml so a lifecycle action never overlaps a deploy
# of the same target; a running job is never cancelled.
concurrency:
  group: deploy-NodeX-${{ github.event.inputs.target_group || 'all' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lifecycle:
    name: Lifecycle ${{ inputs.action }} - ${{ inputs.role }} (${{ inputs.target_group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: NodeX
    env:
      ACTION: ${{ inputs.action }}
      ROLE: ${{ inputs.role }}
      VERSION: ${{ inputs.version }}
      TARGET_GROUP: ${{ inputs.target_group }}
      FORCE: ${{ inputs.force }}
      KEEP_BACKUPS: ${{ inputs.keep_backups }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ "${ACTION}" == "rollback" || "${ACTION}" == "cleanup" ]] \
             && [[ "${TARGET_GROUP}" == "all" && "${FORCE}" != "true" ]]; then
            echo "::error::${ACTION} on target_group=all requires force=true"
            exit 1
          fi
          if [[ "${ACTION}" == "rollback" && ! "${VERSION}" =~ ^(prev|v[0-9]{8}_[0-9]{6})$ ]]; then
            echo "::error::version must be 'prev' or vYYYYMMDD_HHMMSS"
            exit 1
          fi
          if [[ ! "${KEEP_BACKUPS}" =~ ^[0-9]+$ ]]; then
            echo "::error::keep_backups must be a non-negative integer"
            exit 1
          fi
          echo "Inputs OK: action=${ACTION} role=${ROLE} target_group=${TARGET_GROUP}"
          echo "           version=${VERSION} force=${FORCE} keep_backups=${KEEP_BACKUPS}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve target hosts
        run: |
          set -euo pipefail
          mapfile -t members < <(
            ansible "${TARGET_GROUP}" --list-hosts | sed -e '1d' -e 's/^[[:space:]]*//' -e '/^$/d'
          )
          if (( ${#members[@]} == 0 )); then
            echo "::error::Target '${TARGET_GROUP}' matches no host in the generated inventory"
            exit 1
          fi
          echo "Target hosts (${#members[@]}): ${members[*]}"

      - name: Verify connectivity
        run: |
          set -euo pipefail
          ansible "${TARGET_GROUP}" -m ansible.builtin.ping -o

      - name: Execute lifecycle action
        run: |
          set -euo pipefail
          # Application roles are deployed through site.yml play tags; everything else goes through the
          # lifecycle playbook. The case statement only decides WHICH tags to run, the command runs once.
          site_tags=""
          if [[ "${ACTION}" == "deploy" ]]; then
            case "${ROLE}" in
              v2board) site_tags="postgresql,v2board" ;;  # the panel needs its database first
              postgresql|v2bx|speedtest) site_tags="${ROLE}" ;;
            esac
          fi

          if [[ -n "${site_tags}" ]]; then
            args=(playbooks/provision/site.yml --limit "${TARGET_GROUP}" --tags "${site_tags}" -v)
          else
            args=(
              playbooks/maintenance/lifecycle.yml
              --limit "${TARGET_GROUP}"
              --tags "${ACTION}"
              -e "lifecycle_target_role=${ROLE}"
              -v
            )
            case "${ACTION}" in
              rollback)
                args+=(-e "lifecycle_version=${VERSION}" -e lifecycle_hook_type=post_rollback)
                ;;
              cleanup)
                args+=(-e cleanup_confirm=yes -e "cleanup_keep_backups=${KEEP_BACKUPS}")
                if [[ "${FORCE}" == "true" ]]; then
                  args+=(-e cleanup_force=yes)
                fi
                ;;
            esac
          fi

          printf 'Executing: ansible-playbook'
          printf ' %q' "${args[@]}"
          printf '\n'
          ansible-playbook "${args[@]}"

      - name: Post-action health check
        if: success() && (inputs.action == 'deploy' || inputs.action == 'rollback')
        run: |
          set -euo pipefail
          ansible-playbook playbooks/maintenance/health-check.yml --limit "${TARGET_GROUP}" -v

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Write lifecycle summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Lifecycle summary
          status: ${{ job.status }}
          fields: |
            Action: `${{ inputs.action }}`
            Role: `${{ inputs.role }}`
            Target: `${{ inputs.target_group }}`
            Version: `${{ inputs.version }}`
            Force: ${{ inputs.force }}
            Keep backups: ${{ inputs.keep_backups }}
