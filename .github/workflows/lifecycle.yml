name: Lifecycle Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Lifecycle action'
        required: true
        type: choice
        options:
          - status
          - deploy
          - rollback
          - cleanup
        default: 'status'

      role:
        description: 'Target role'
        required: true
        type: choice
        options:
          - common
          - nginx
          - node_exporter
          - promtail
          - prometheus
          - loki
          - grafana
          - postgresql
          - v2board
          - v2bx
          - speedtest
          - firewall
          - acme_ssl
        default: 'nginx'

      version:
        description: 'Rollback version (prev, initial or vYYYYMMDDTHHMMSS)'
        required: false
        type: string
        default: 'prev'

      target_group:
        description: 'Target servers (group or single host)'
        required: true
        type: choice
        options:
          - all
          - web_servers
          - proxy_servers
          - observability
          - dev_servers
          - v2bx_servers
          - v2board_servers
          - postgres_servers
          - jp-1
          - uk-1
          - us-w-1
          - sg-1
          - hk-1
          - uk-2
          - pl-1
          - fr-1
        default: 'all'

      force:
        description: 'Confirm a group-wide rollback/cleanup (required for target_group=all and any multi-host group)'
        required: false
        type: boolean
        default: false

      cleanup_force:
        description: 'Cleanup only: keep going when package removal or configuration archiving fails'
        required: false
        type: boolean
        default: false

      keep_backups:
        description: 'Number of backups to keep (cleanup only)'
        required: false
        type: number
        default: 5

permissions:
  contents: read

# Shares the deploy-NodeX group with deploy.yml / weekly-security-patch.yml so a lifecycle action never
# overlaps another NodeX change; `status` is read-only and gets its own group. Never cancelled.
concurrency:
  group: deploy-NodeX${{ github.event.inputs.action == 'status' && format('-readonly-{0}', github.run_id) || '' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lifecycle:
    name: Lifecycle ${{ inputs.action }} - ${{ inputs.role }} (${{ inputs.target_group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: NodeX
    env:
      ACTION: ${{ inputs.action }}
      ROLE: ${{ inputs.role }}
      VERSION: ${{ inputs.version }}
      TARGET_GROUP: ${{ inputs.target_group }}
      FORCE: ${{ inputs.force }}
      CLEANUP_FORCE: ${{ inputs.cleanup_force }}
      KEEP_BACKUPS: ${{ inputs.keep_backups }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ "${ACTION}" == "rollback" || "${ACTION}" == "cleanup" ]] \
             && [[ "${TARGET_GROUP}" == "all" && "${FORCE}" != "true" ]]; then
            echo "::error::${ACTION} on target_group=all requires force=true"
            exit 1
          fi
          if [[ "${ACTION}" == "rollback" && ! "${VERSION}" =~ ^(prev|initial|v[0-9]{8}T[0-9]{6})$ ]]; then
            echo "::error::version must be 'prev', 'initial' or vYYYYMMDDTHHMMSS"
            exit 1
          fi
          if [[ ! "${KEEP_BACKUPS}" =~ ^[0-9]+$ ]]; then
            echo "::error::keep_backups must be a non-negative integer"
            exit 1
          fi
          # Scope every host-touching step to the role's home group (as in site.yml), so e.g.
          # role=prometheus target_group=all never installs Prometheus outside `observability`.
          case "${ROLE}" in
            nginx|acme_ssl)          role_group=web_servers ;;
            prometheus|loki|grafana) role_group=observability ;;
            postgresql)              role_group=postgres_servers ;;
            v2board)                 role_group=v2board_servers ;;
            v2bx)                    role_group=v2bx_servers ;;
            *)                       role_group=all ;;  # common, node_exporter, promtail, firewall, speedtest
          esac
          if [[ "${role_group}" == "all" ]]; then
            target_pattern="${TARGET_GROUP}"
          else
            target_pattern="${TARGET_GROUP}:&${role_group}"
          fi
          echo "TARGET_PATTERN=${target_pattern}" >> "${GITHUB_ENV}"
          echo "Inputs OK: action=${ACTION} role=${ROLE} target_group=${TARGET_GROUP} pattern=${target_pattern}"
          echo "           version=${VERSION} force=${FORCE} keep_backups=${KEEP_BACKUPS}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export allow-listed secrets
        uses: ./.github/actions/export-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve target hosts
        run: |
          set -euo pipefail
          mapfile -t members < <(
            ansible "${TARGET_PATTERN}" --list-hosts 2>/dev/null | sed -e '1d' -e 's/^[[:space:]]*//' -e '/^$/d'
          )
          if (( ${#members[@]} == 0 )); then
            echo "::error::Target '${TARGET_GROUP}' has no host that runs role '${ROLE}' (pattern ${TARGET_PATTERN})"
            exit 1
          fi
          echo "Target hosts (${#members[@]}): ${members[*]}"

      - name: Verify connectivity
        run: |
          set -euo pipefail
          ansible "${TARGET_PATTERN}" -m ansible.builtin.ping -o

      - name: Execute lifecycle action
        run: |
          set -euo pipefail
          # Application roles are deployed through site.yml play tags; everything else goes through the
          # lifecycle playbook. The case statement only decides WHICH tags to run, the command runs once.
          site_tags=""
          if [[ "${ACTION}" == "deploy" ]]; then
            case "${ROLE}" in
              v2board) site_tags="postgresql,v2board" ;;  # the panel needs its database first
              postgresql|v2bx|speedtest) site_tags="${ROLE}" ;;
            esac
          fi

          if [[ -n "${site_tags}" ]]; then
            args=(playbooks/provision/site.yml --limit "${TARGET_PATTERN}" --tags "${site_tags}" -v)
          else
            args=(
              playbooks/maintenance/lifecycle.yml
              --limit "${TARGET_PATTERN}"
              --tags "${ACTION}"
              -e "lifecycle_target_role=${ROLE}"
              -v
            )
            case "${ACTION}" in
              rollback)
                args+=(-e "lifecycle_version=${VERSION}")
                ;;
              cleanup)
                args+=(-e cleanup_confirm=yes -e "cleanup_keep_backups=${KEEP_BACKUPS}")
                if [[ "${CLEANUP_FORCE}" == "true" ]]; then
                  args+=(-e cleanup_force=yes)
                fi
                ;;
            esac
            # The playbook refuses rollback/cleanup on more than one host without lifecycle_confirm_all;
            # force=true is the operator's explicit confirmation of a group-wide run.
            if [[ "${FORCE}" == "true" ]]; then
              args+=(-e lifecycle_confirm_all=true)
            fi
          fi

          printf 'Executing: ansible-playbook'
          printf ' %q' "${args[@]}"
          printf '\n'
          ansible-playbook "${args[@]}"

      - name: Post-action health check
        if: success() && (inputs.action == 'deploy' || inputs.action == 'rollback')
        run: |
          set -euo pipefail
          ansible-playbook playbooks/maintenance/health-check.yml --limit "${TARGET_PATTERN}" -v

      - name: Remove SSH key material
        if: always()
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/ssh"
          if [[ -d "${key_dir}" ]]; then
            find "${key_dir}" -type f -exec shred -u {} +
            rm -rf "${key_dir}"
          fi

      - name: Write lifecycle summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          title: Lifecycle summary
          status: ${{ job.status }}
          fields: |
            Action: `${{ inputs.action }}`
            Role: `${{ inputs.role }}`
            Target: `${{ inputs.target_group }}`
            Version: `${{ inputs.version }}`
            Force: ${{ inputs.force }}
            Cleanup force: ${{ inputs.cleanup_force }}
            Keep backups: ${{ inputs.keep_backups }}
