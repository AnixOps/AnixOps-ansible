name: Lifecycle Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Lifecycle action'
        required: true
        type: choice
        options:
          - status
          - deploy
          - rollback
          - cleanup
        default: 'status'

      role:
        description: 'Target role'
        required: true
        type: choice
        options:
          - nginx
          - prometheus
          - grafana
          - loki
          - promtail
          - node_exporter
          - common
          - firewall
          - acme_ssl
          - v2bx
          - v2board
          - postgresql
          - speedtest
        default: 'nginx'

      version:
        description: 'Rollback version (prev or vYYYYMMDD_HHMMSS)'
        required: false
        type: string
        default: 'prev'

      target_group:
        description: 'Target servers'
        required: true
        type: choice
        options:
          - all
          - web_servers
          - proxy_servers
          - observability
          - v2bx_servers
          - v2board_servers
          - jp-1
          - uk-1
          - us-w-1
          - sg-1
          - hk-1
          - uk-2
          - pl-1
          - fr-1
        default: 'all'

      force:
        description: 'Force execution (skip confirmation)'
        required: false
        type: boolean
        default: false

      keep_backups:
        description: 'Number of backups to keep (cleanup only)'
        required: false
        type: number
        default: 5

jobs:
  lifecycle:
    name: Lifecycle (${{ github.event.inputs.action }} - ${{ github.event.inputs.role }})
    runs-on: ubuntu-latest
    environment: NodeX

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create inventory from config
        run: |
          inventory_path="$RUNNER_TEMP/github-actions-hosts.yml"
          echo "Generating inventory from servers-config.yml..."
          python3 tools/generate_inventory.py github-actions --output "$inventory_path"
          echo "鉁?Inventory generated"

      - name: Display Lifecycle Configuration
        run: |
          echo "鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
          echo "馃攧 LIFECYCLE MANAGEMENT"
          echo "鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
          echo "Action:          ${{ github.event.inputs.action }}"
          echo "Role:            ${{ github.event.inputs.role }}"
          echo "Target:          ${{ github.event.inputs.target_group }}"
          if [ "${{ github.event.inputs.action }}" = "rollback" ]; then
            echo "Version:         ${{ github.event.inputs.version }}"
          fi
          if [ "${{ github.event.inputs.action }}" = "cleanup" ]; then
            echo "Keep Backups:     ${{ github.event.inputs.keep_backups }}"
          fi
          echo "Force:           ${{ github.event.inputs.force }}"
          echo "鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€"
          echo "Triggered by:    ${{ github.actor }}"
          echo "Branch:          ${{ github.ref_name }}"
          echo "鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?

      - name: Verify Connectivity
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          PL_1_V4_SSH: ${{ secrets.PL_1_V4_SSH }}
          JP_1_V4_SSH: ${{ secrets.JP_1_V4_SSH }}
          UK_1_V4_SSH: ${{ secrets.UK_1_V4_SSH }}
          US_W_1_V4_SSH: ${{ secrets.US_W_1_V4_SSH }}
          SG_1_V4_SSH: ${{ secrets.SG_1_V4_SSH }}
          HK_1_V4_SSH: ${{ secrets.HK_1_V4_SSH }}
          UK_2_V4_SSH: ${{ secrets.UK_2_V4_SSH }}
          FR_1_V4_SSH: ${{ secrets.FR_1_V4_SSH }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
          ANSIBLE_PORT: ${{ secrets.ANSIBLE_PORT }}
        run: |
          inventory_path="$RUNNER_TEMP/github-actions-hosts.yml"
          echo "馃攳 Verifying connectivity..."
          ansible ${{ github.event.inputs.target_group }} \
            -i "$inventory_path" \
            -m ping -v

      - name: Execute Lifecycle Action
        env:
