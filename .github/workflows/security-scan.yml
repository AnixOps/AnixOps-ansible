name: Security Scan

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # Third-party action pinned to a full commit SHA (tag v3.99.7).
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python requirements
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pip-audit
          args=(--requirement requirements.txt --progress-spinner off)
          if [[ -f requirements-dev.txt ]]; then
            args+=(--requirement requirements-dev.txt)
          fi
          pip-audit "${args[@]}"

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for committed private keys and .env files
        run: |
          set -euo pipefail
          found=0

          key_files="$(git ls-files -- '*.pem' '*.key' '*.ppk' '*.p12' '*.pfx' '*id_rsa' '*id_ed25519' '*id_ecdsa' ':(exclude)*.pub')"
          if [[ -n "${key_files}" ]]; then
            echo "::error::Private key material is tracked in git:"
            echo "${key_files}"
            found=1
          fi

          env_files="$(git ls-files -- '.env' '*/.env')"
          if [[ -n "${env_files}" ]]; then
            echo "::error::.env files are tracked in git:"
            echo "${env_files}"
            found=1
          fi

          rc=0
          # A real key block starts the line with the header; quoted mentions in tools/docs do not match.
          pem_blocks="$(git grep -nI -E -e '^[[:space:]]*-----BEGIN (RSA |OPENSSH |EC |DSA |ENCRYPTED )?PRIVATE KEY-----[[:space:]]*$' -- . ':(exclude)*.md' ':(exclude).github/workflows/security-scan.yml')" || rc=$?
          if (( rc == 0 )); then
            echo "::error::Inline private key blocks found in tracked files:"
            echo "${pem_blocks}"
            found=1
          elif (( rc != 1 )); then
            echo "::error::git grep failed: ${pem_blocks}"
            found=1
          fi

          if [[ "${found}" -eq 1 ]]; then
            exit 1
          fi
          echo "OK: no private keys, key blocks or .env files are tracked"

  ansible-policy:
    name: Ansible Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail on ignore_errors in roles and playbooks
        run: |
          set -euo pipefail
          # The hardening brief forbids ignore_errors; use failed_when/block-rescue/register instead.
          rc=0
          matches="$(git grep -nI -i -E 'ignore_errors:[[:space:]]*"?(true|yes)"?' -- 'roles/**/*.yml' 'roles/**/*.yaml' 'playbooks/**/*.yml' 'playbooks/**/*.yaml' 'tests/integration/*.yml')" || rc=$?
          if (( rc == 0 )); then
            echo "::error::ignore_errors is forbidden (use failed_when: false, block/rescue or register + conditions):"
            echo "${matches}"
            exit 1
          elif (( rc != 1 )); then
            echo "::error::git grep failed: ${matches}"
            exit 1
          fi
          echo "OK: no ignore_errors under roles/ or playbooks/"

      - name: Report shell tasks that swallow failures (informational)
        continue-on-error: true
        run: |
          set -euo pipefail
          rc=0
          matches="$(git grep -nI -E '\|\|[[:space:]]+true' -- 'roles/**/*.yml' 'playbooks/**/*.yml')" || rc=$?
          if (( rc == 0 )); then
            echo "::warning::Shell tasks that hide failures were found; prefer failed_when/changed_when:"
            echo "${matches}"
            exit 1
          fi
          echo "OK: no failure-swallowing shell tasks found"
