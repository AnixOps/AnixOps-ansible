name: Ansible CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One CI run per ref; a newer push supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Code Quality Check
    uses: ./.github/workflows/reusable-lint.yml
    permissions:
      contents: read

  unit-tests:
    name: Unit tests, py_compile and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          generate-inventory: "false"

      - name: Install test tooling
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest shellcheck-py

      - name: Run pytest
        run: |
          set -euo pipefail
          python3 -m pytest -q tests

      - name: Byte-compile Python tools and scripts
        run: |
          set -euo pipefail
          mapfile -t py_files < <(git ls-files -- 'tools/*.py' 'scripts/*.py' 'tests/*.py' '.github/actions/*/*.py')
          if (( ${#py_files[@]} == 0 )); then
            echo "No Python files found"
            exit 0
          fi
          python3 -m py_compile "${py_files[@]}"
          echo "Compiled ${#py_files[@]} Python files"

      - name: Shell syntax (bash -n) and shellcheck
        run: |
          set -euo pipefail
          mapfile -t sh_files < <(git ls-files -- 'scripts/*.sh' 'tools/*.sh')
          if (( ${#sh_files[@]} == 0 )); then
            echo "No shell scripts found"
            exit 0
          fi
          for script in "${sh_files[@]}"; do
            bash -n "${script}"
          done
          shellcheck -x "${sh_files[@]}"
          echo "Checked ${#sh_files[@]} shell scripts"

  inventory-drift:
    name: Inventory drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          generate-inventory: "false"
          install-collections: "false"

      - name: Verify hosts.yml matches servers-config.yml
        run: |
          set -euo pipefail
          # Exits 1 when inventories/production/hosts.yml differs from the rendered "local" output.
          python3 tools/generate_inventory.py local --check

  syntax-check:
    name: Playbook syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          generate-inventory: "false"

      - name: Syntax-check every playbook
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          candidates=(playbooks/**/*.yml tests/integration/*.yml)
          checked=0
          failed=0
          for playbook in "${candidates[@]}"; do
            # Task files (e.g. playbooks/maintenance/security-patch/*.yml) are not playbooks: skip them.
            if ! python3 - "${playbook}" <<'PY'
          import sys
          import yaml
          with open(sys.argv[1], encoding="utf-8") as handle:
              document = yaml.safe_load(handle)
          plays = document if isinstance(document, list) else []
          is_playbook = bool(plays) and all(
              isinstance(play, dict) and ("hosts" in play or "import_playbook" in play) for play in plays
          )
          sys.exit(0 if is_playbook else 1)
          PY
            then
              echo "skip (not a playbook): ${playbook}"
              continue
            fi
            echo "::group::ansible-playbook --syntax-check ${playbook}"
            if ansible-playbook -i localhost, --syntax-check "${playbook}"; then
              checked=$((checked + 1))
            else
              echo "::error file=${playbook}::syntax check failed"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Syntax-checked ${checked} playbooks, ${failed} failed"
          if (( checked == 0 )); then
            echo "::error::No playbooks were found"
            exit 1
          fi
          exit "${failed}"

  prepare:
    # hashFiles() evaluates on the runner's workspace, which is empty before checkout, so it cannot
    # guard a whole job; this tiny job checks the repository out and exposes the answer as an output.
    name: Detect optional test suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration_present: ${{ steps.detect.outputs.integration_present }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect localhost integration suite
        id: detect
        run: |
          set -euo pipefail
          if [[ -f tests/integration/localhost-converge.yml ]]; then
            present=true
          else
            present=false
          fi
          echo "integration_present=${present}" >> "${GITHUB_OUTPUT}"
          echo "tests/integration/localhost-converge.yml present: ${present}"

  integration-localhost:
    name: Integration (localhost converge, verify, idempotency)
    needs: prepare
    if: needs.prepare.outputs.integration_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ansible toolchain
        uses: ./.github/actions/setup-ansible
        with:
          generate-inventory: "false"

      - name: Converge localhost
        run: |
          set -euo pipefail
          sudo -E env "PATH=${PATH}" "HOME=${HOME}" \
            ansible-playbook -i localhost, -c local tests/integration/localhost-converge.yml

      - name: Verify localhost
        run: |
          set -euo pipefail
          sudo -E env "PATH=${PATH}" "HOME=${HOME}" \
            ansible-playbook -i localhost, -c local tests/integration/localhost-verify.yml

      - name: Second converge must be idempotent (changed=0)
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/converge-second-run.log"
          sudo -E env "PATH=${PATH}" "HOME=${HOME}" ANSIBLE_FORCE_COLOR=False ANSIBLE_NOCOLOR=1 \
            ansible-playbook -i localhost, -c local tests/integration/localhost-converge.yml | tee "${log}"
          if ! grep -qE '^localhost[[:space:]]*:.*[[:space:]]changed=0[[:space:]]' "${log}"; then
            echo "::error::The second converge run reported changes; the playbook is not idempotent"
            grep -E '^localhost[[:space:]]*:' "${log}" || echo "(no PLAY RECAP line for localhost found)"
            exit 1
          fi
          echo "Idempotency check passed (changed=0)"
