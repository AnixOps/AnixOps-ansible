---
# Internal constants of the firewall role (not meant to be overridden).

# IPv4 address with optional /0-32 prefix.
firewall_ipv4_cidr_regex: >-
  ^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(?:/(?:3[0-2]|[12]?[0-9]))?$

# Pragmatic IPv6 check: hex groups separated by colons (compressed form and
# embedded IPv4 allowed), optional /0-128 prefix.
firewall_ipv6_cidr_regex: >-
  ^(?=.*:)(?!.*:::)(?:[0-9A-Fa-f]{0,4}:){1,7}[0-9A-Fa-f.]{0,15}(?:/(?:12[0-8]|1[01][0-9]|[1-9]?[0-9]))?$

# Single port or ufw-style range "from:to" (checked against 1-65535 separately).
firewall_port_regex: ^[1-9][0-9]{0,4}(?::[1-9][0-9]{0,4})?$

# "ufw show added" line of a whitelist rule created by this role
# (also matches the comment format of the previous role version).
# ufw prints the "from" address normalised; preflight.yml canonicalises the
# whitelist the same way (firewall_ufw_address) before the prune diff.
firewall_ufw_whitelist_rule_regex: >-
  ^ufw allow from (\S+) to any port ([0-9:]+) proto tcp comment 'Monitoring access from .*$

# firewall_default_incoming_policy -> firewalld zone target
firewall_firewalld_target_map:
  allow: ACCEPT
  deny: DROP
  reject: "%%REJECT%%"
