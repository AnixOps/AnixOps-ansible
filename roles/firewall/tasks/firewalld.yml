---
# =============================================================================
# firewalld configuration (RedHat family) | firewalld 配置
# =============================================================================
# Same semantics as ufw.yml: SSH first, public ports, whitelist rich rules
# (priority -100) before the reject rich rules (priority -50), then verify.
# Rich-rule priorities need firewalld >= 0.7 (RHEL/Rocky/Alma 8+).

- name: Install firewalld | 安装 firewalld
  ansible.builtin.package:
    name: firewalld
    state: present
  register: firewall_firewalld_install
  retries: 3
  delay: 10
  until: firewall_firewalld_install is succeeded

- name: Start and enable firewalld | 启动并启用 firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Allow the SSH port before anything else (lockout protection) | 优先放行 SSH 端口（防锁死）
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    port: "{{ item | replace(':', '-') }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ssh_ports }}"

- name: Keep the ssh service allowed while SSH listens on port 22 | SSH 使用 22 端口时保留 ssh 服务
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  when: "'22' in firewall_ssh_ports"

- name: Allow public ports from anywhere | 放行公开端口
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    port: "{{ item | replace(':', '-') }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_effective_public_ports | difference(firewall_ssh_ports) }}"

- name: Remove generic port openings for restricted ports (they would bypass the whitelist) | 删除受限端口的通用放行
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    port: "{{ item | replace(':', '-') }}/tcp"
    permanent: true
    immediate: true
    state: disabled
  loop: "{{ firewall_effective_restricted_ports }}"

- name: Allow restricted ports from whitelisted addresses | 为白名单地址放行受限端口
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    rich_rule: >-
      rule priority="-100" family="{{ 'ipv6' if ':' in item.0 else 'ipv4' }}"
      source address="{{ item.0 }}" port port="{{ item.1 | replace(':', '-') }}" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_whitelist_rules }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1 }}/tcp"
  when: firewall_whitelist_rules_enabled | bool

- name: Reject restricted ports from everywhere else | 拒绝其他来源访问受限端口
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    rich_rule: >-
      rule priority="-50" family="{{ item.1 }}" port port="{{ item.0 | replace(':', '-') }}" protocol="tcp" reject
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_effective_restricted_ports | product(['ipv4', 'ipv6']) | list }}"
  loop_control:
    label: "{{ item.0 }}/tcp ({{ item.1 }})"

- name: Set the zone target from firewall_default_incoming_policy | 根据默认入站策略设置区域目标
  ansible.posix.firewalld:
    zone: "{{ firewall_firewalld_zone }}"
    target: "{{ firewall_firewalld_target_map[firewall_default_incoming_policy] }}"
    permanent: true
    state: present
  when: firewall_firewalld_manage_target | bool
  notify: Reload firewalld

- name: Flush handlers so that pending reloads happen before verification | 验证前先执行重载
  ansible.builtin.meta: flush_handlers

- name: Read the firewalld state | 读取 firewalld 状态
  ansible.builtin.command:
    argv: [firewall-cmd, --state]
  register: firewall_firewalld_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the zone configuration | 读取区域配置
  ansible.builtin.command:
    argv: [firewall-cmd, "--zone={{ firewall_firewalld_zone }}", --list-all]
  register: firewall_firewalld_list_all
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert that firewalld is running and the SSH port is allowed | 断言 firewalld 运行且 SSH 已放行
  ansible.builtin.assert:
    that:
      - firewall_firewalld_state.stdout | default('') | trim == 'running'
      - (item | replace(':', '-') ~ '/tcp') in firewall_firewalld_list_all.stdout | default('')
    fail_msg: >-
      firewalld verification failed on {{ inventory_hostname }}: expected state "running" and {{ item }}/tcp
      in zone {{ firewall_firewalld_zone }}. State: {{ firewall_firewalld_state.stdout | default('') }}.
      Zone: {{ firewall_firewalld_list_all.stdout | default('') }}
    quiet: true
  loop: "{{ firewall_ssh_ports }}"
  when: not ansible_check_mode

- name: Show the firewalld summary | 显示 firewalld 摘要
  ansible.builtin.debug:
    msg:
      - "firewalld running on {{ inventory_hostname }}: zone {{ firewall_firewalld_zone }}"
      - "SSH ports: {{ firewall_ssh_ports | join(', ') }}"
      - "Public ports: {{ firewall_effective_public_ports | join(', ') }}"
      - >-
        Restricted ports: {{ firewall_effective_restricted_ports | join(', ') | default('none', true) }}
        (whitelist entries: {{ firewall_effective_whitelist | length }})
