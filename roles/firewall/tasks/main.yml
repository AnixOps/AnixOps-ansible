---
# =============================================================================
# Firewall role entry point | 防火墙角色入口
# =============================================================================
# Flow: preflight (validate + compute plan) -> UFW or firewalld -> verify.
# Lockout protection: the SSH port is always allowed before any deny rule,
# default policy or enable step is applied.

- name: Skip firewall management when firewall_enabled is false | 防火墙管理已禁用
  ansible.builtin.debug:
    msg: "firewall_enabled is false: the firewall on {{ inventory_hostname }} is left untouched."
  when: not firewall_enabled | bool

- name: Run preflight checks and compute the effective plan | 预检查并计算生效计划
  ansible.builtin.include_tasks: preflight.yml
  when: firewall_enabled | bool

- name: Configure UFW (Debian/Ubuntu) | 配置 UFW
  ansible.builtin.include_tasks: ufw.yml
  when:
    - firewall_enabled | bool
    - ansible_os_family == 'Debian'

- name: Configure firewalld (RedHat family) | 配置 firewalld
  ansible.builtin.include_tasks: firewalld.yml
  when:
    - firewall_enabled | bool
    - ansible_os_family == 'RedHat'
