---
# =============================================================================
# acme_ssl handlers | acme_ssl 处理器
# =============================================================================
# Own copy of `Reload nginx` so the role can run in a play without the nginx
# role. It is skipped when the host has no Nginx unit (service_facts is gathered
# in tasks/main.yml); on systemd hosts an inactive unit is started rather than
# failing the reload.
# =============================================================================

- name: Reload nginx
  ansible.builtin.service:
    name: "{{ acme_ssl_nginx_service_name }}"
    state: reloaded
  when: (acme_ssl_nginx_service_name ~ '.service') in (ansible_facts.services | default({}))
