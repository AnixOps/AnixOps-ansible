---
# =============================================================================
# acme_ssl role defaults | acme_ssl 角色默认变量
# =============================================================================
# All variables are prefixed acme_ssl_. The historical unprefixed inventory keys
# (acme_email, acme_dns_provider, acme_domains, cloudflare_api_token,
# cloudflare_zone_id) are still honoured as fallbacks.
# 所有变量以 acme_ssl_ 为前缀；旧的无前缀变量仍作为回退值被读取。
# =============================================================================

# -----------------------------------------------------------------------------
# Account and domains | 账户与域名
# -----------------------------------------------------------------------------
acme_ssl_email: "{{ acme_email | default('') }}"
acme_ssl_domains: "{{ acme_domains | default([]) }}"
# ACME directory shortcut understood by acme.sh:
# letsencrypt | letsencrypt_test | zerossl | buypass | buypass_test | google
acme_ssl_ca_server: letsencrypt
# ec-256 | ec-384 | 2048 | 3072 | 4096
acme_ssl_key_length: ec-256
# acme.sh stores ECC certificates in <domain>_ecc/.
acme_ssl_ecc_suffix: "{{ '_ecc' if acme_ssl_key_length | string is match('^ec-') else '' }}"
# Re-issue even when a certificate already exists (one-off: -e acme_ssl_force_renew=true).
acme_ssl_force_renew: false
# Extra arguments appended to every `acme.sh --issue`, e.g. ["--ocsp-must-staple"].
acme_ssl_extra_issue_args: []

# -----------------------------------------------------------------------------
# DNS-01 validation | DNS 验证
# -----------------------------------------------------------------------------
acme_ssl_dns_provider: "{{ acme_dns_provider | default('cloudflare') }}"
# acme.sh dnsapi hook per provider; unknown providers map to dns_<provider>.
acme_ssl_dns_hooks:
  cloudflare: dns_cf
acme_ssl_dns_hook: "{{ acme_ssl_dns_hooks[acme_ssl_dns_provider] | default('dns_' ~ acme_ssl_dns_provider) }}"
acme_ssl_cloudflare_api_token: "{{ cloudflare_api_token | default('') }}"
acme_ssl_cloudflare_zone_id: "{{ cloudflare_zone_id | default('') }}"
# Environment handed to acme.sh during --issue (task runs with no_log). acme.sh
# persists the values it used in account.conf so unattended renewals keep working.
acme_ssl_dns_env: >-
  {{ {'CF_Token': acme_ssl_cloudflare_api_token, 'CF_Zone_ID': acme_ssl_cloudflare_zone_id}
     if acme_ssl_dns_provider == 'cloudflare' else {} }}
# Extra environment for other dnsapi hooks, e.g. {"DO_API_KEY": "..."}.
acme_ssl_extra_env: {}

# -----------------------------------------------------------------------------
# acme.sh installation | 安装 acme.sh
# -----------------------------------------------------------------------------
# Pinned release tarball instead of `curl https://get.acme.sh | sh`. Set
# acme_ssl_checksum to "sha256:<hex>" to verify the download.
acme_ssl_version: "3.1.6"
acme_ssl_download_url: "https://github.com/acmesh-official/acme.sh/archive/refs/tags/{{ acme_ssl_version }}.tar.gz"
acme_ssl_checksum: ""
acme_ssl_download_dir: /usr/local/src
acme_ssl_home: /root/.acme.sh

# -----------------------------------------------------------------------------
# Installation into Nginx | 安装到 Nginx
# -----------------------------------------------------------------------------
# Certificates are installed as <dir>/<domain>.crt (full chain) and <domain>.key,
# matching the nginx role's site ssl.cert / ssl.key convention.
acme_ssl_cert_dir: /etc/nginx/ssl
acme_ssl_cert_dir_mode: "0700"
acme_ssl_nginx_service_name: nginx
# Executed by acme.sh after every issue/renewal. try-reload-or-restart reloads a
# running Nginx and does nothing when it is stopped, so a renewal never starts a
# service that an operator stopped on purpose.
acme_ssl_reload_cmd: "systemctl try-reload-or-restart {{ acme_ssl_nginx_service_name }}"

# -----------------------------------------------------------------------------
# Renewal cron | 自动续期
# -----------------------------------------------------------------------------
acme_ssl_cron_enabled: true
# Deterministic pseudo-random slot per host so renewals are spread over the day.
acme_ssl_cron_minute: "{{ 59 | random(seed=inventory_hostname) }}"
acme_ssl_cron_hour: "{{ 23 | random(seed=inventory_hostname ~ '-hour') }}"

# -----------------------------------------------------------------------------
# Packages | 软件包
# -----------------------------------------------------------------------------
acme_ssl_packages: >-
  {{ ['curl', 'openssl', 'socat', 'tar']
     + (['cronie'] if ansible_os_family | default('Debian') == 'RedHat' else ['cron']) }}

# -----------------------------------------------------------------------------
# Lifecycle contract | 生命周期约定 (roles/lifecycle)
# -----------------------------------------------------------------------------
# The role has no daemon of its own: the cron service runs the renewals and the
# installed certificates are served by Nginx on port 443.
acme_ssl_service_name: "{{ 'crond' if ansible_os_family | default('Debian') == 'RedHat' else 'cron' }}"
acme_ssl_port: 443
acme_ssl_health_url: "https://127.0.0.1:{{ acme_ssl_port }}/"
acme_ssl_backup_files:
  - "{{ acme_ssl_home }}/account.conf"
acme_ssl_config_dirs:
  - "{{ acme_ssl_home }}"
  - "{{ acme_ssl_cert_dir }}"
