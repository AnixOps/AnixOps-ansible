---
# =============================================================================
# node_exporter handlers | node_exporter 处理器
# =============================================================================
# The restart handler daemon-reloads itself: when several roles share one
# play their same-named `Reload systemd` handlers merge (the last role loaded
# wins and runs in that role's position), so handler order alone does not
# guarantee a changed unit file is re-read before the restart.
# =============================================================================

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: "{{ node_exporter_service_name }}"
    state: restarted
    daemon_reload: true
