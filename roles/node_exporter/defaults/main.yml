---
# =============================================================================
# node_exporter role - default variables | node_exporter 角色默认变量
# =============================================================================
# Override any value in inventory group_vars/host_vars or with `-e`.
# The global `prometheus.node_exporter.*` dict in group_vars/all is informational
# for operators; the role reads only the prefixed variables below.
# =============================================================================

# --- Release / download ------------------------------------------------------
node_exporter_version: "1.7.0"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download"
# Optional integrity check of the release archive, e.g. "sha256:<hex>".
# An empty string disables verification.
node_exporter_checksum: ""
# Architecture suffix of the release archive (amd64 / arm64). `_target_arch`
# from group_vars/all wins when defined.
node_exporter_arch: "{{ _target_arch | default('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}"
node_exporter_archive_dir: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_archive: "{{ node_exporter_archive_dir }}.tar.gz"
node_exporter_archive_url: "{{ node_exporter_download_url }}/v{{ node_exporter_version }}/{{ node_exporter_archive }}"

# --- Installation ------------------------------------------------------------
node_exporter_install_path: /usr/local/bin/node_exporter
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_unit_path: "/etc/systemd/system/{{ node_exporter_service_name }}.service"

# --- Runtime -----------------------------------------------------------------
node_exporter_port: 9100
# Bind address for the metrics endpoint. Empty or 0.0.0.0 binds all interfaces.
node_exporter_listen_address: "0.0.0.0"
# Collector flags (unchanged from the original role); override to tune collectors.
node_exporter_collector_args:
  - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
  - "--collector.netclass.ignored-devices=^(veth.*)$"
  - "--collector.netdev.device-exclude=^(veth.*)$"
# Extra command line flags appended to ExecStart, e.g. ["--collector.systemd"].
node_exporter_extra_args: []

# --- Verification ------------------------------------------------------------
node_exporter_verify_retries: 6
node_exporter_verify_delay: 5

# --- Lifecycle contract (roles/lifecycle, playbooks/maintenance/rollback.yml) --
node_exporter_service_name: node_exporter
node_exporter_health_host: >-
  {{ '127.0.0.1' if node_exporter_listen_address in ['', '0.0.0.0', '::', '[::]'] else node_exporter_listen_address }}
node_exporter_health_url: "http://{{ node_exporter_health_host }}:{{ node_exporter_port }}/metrics"
node_exporter_backup_files:
  - "{{ node_exporter_unit_path }}"
node_exporter_config_dirs: []
node_exporter_packages: []
