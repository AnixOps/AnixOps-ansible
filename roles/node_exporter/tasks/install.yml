---
# =============================================================================
# node_exporter - install | 安装二进制文件
# =============================================================================
# Downloads the release archive only when the binary is missing or its
# version differs from node_exporter_version (upgrades and downgrades alike).
# =============================================================================

- name: Check whether the node_exporter binary exists
  ansible.builtin.stat:
    path: "{{ node_exporter_install_path }}"
  register: node_exporter_binary_stat

- name: Read the installed node_exporter version
  ansible.builtin.command:
    argv:
      - "{{ node_exporter_install_path }}"
      - --version
  register: node_exporter_version_probe
  changed_when: false
  failed_when: false
  when: node_exporter_binary_stat.stat.exists

- name: Determine the installed node_exporter version
  ansible.builtin.set_fact:
    node_exporter_installed_version: >-
      {{ ((node_exporter_version_probe.stdout | default('')) ~ ' ' ~ (node_exporter_version_probe.stderr | default('')))
         | regex_search('(?<=version )[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}

- name: Show node_exporter version status
  ansible.builtin.debug:
    msg: >-
      node_exporter installed={{ node_exporter_installed_version | default('none', true) }}
      desired={{ node_exporter_version }} arch={{ node_exporter_arch }}

- name: Download and install node_exporter
  when: node_exporter_installed_version != (node_exporter_version | string)
  block:
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: node_exporter.
      register: node_exporter_tmpdir

    - name: Download the node_exporter release archive
      ansible.builtin.get_url:
        url: "{{ node_exporter_archive_url }}"
        dest: "{{ node_exporter_tmpdir.path }}/{{ node_exporter_archive }}"
        checksum: "{{ node_exporter_checksum | default(omit, true) }}"
        mode: "0644"
        timeout: 60
      register: node_exporter_download
      retries: 5
      delay: 10
      until: node_exporter_download is succeeded

    - name: Extract the node_exporter release archive
      ansible.builtin.unarchive:
        src: "{{ node_exporter_tmpdir.path }}/{{ node_exporter_archive }}"
        dest: "{{ node_exporter_tmpdir.path }}"
        remote_src: true

    - name: Install the node_exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_tmpdir.path }}/{{ node_exporter_archive_dir }}/node_exporter"
        dest: "{{ node_exporter_install_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter
  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ node_exporter_tmpdir.path }}"
        state: absent
      when: node_exporter_tmpdir.path is defined
