---
# =============================================================================
# node_exporter - configure | 配置用户与 systemd 单元
# =============================================================================

- name: Create the node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present

- name: Deploy the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "{{ node_exporter_unit_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: node_exporter_unit_result
  notify:
    - Reload systemd
    - Restart node_exporter
