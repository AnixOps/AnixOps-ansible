---
# =============================================================================
# node_exporter role - entry point | node_exporter 角色入口
# =============================================================================
# install.yml   -> download / upgrade the binary (only when the version differs)
# configure.yml -> system user + hardened systemd unit
# service.yml   -> flush handlers, then enable + start the service
# verify.yml    -> HTTP health check; on failure dump the journal, restore the
#                  previous unit file and fail loudly
# =============================================================================

- name: Install node_exporter binary
  ansible.builtin.import_tasks: install.yml
  tags: [node_exporter, node_exporter_install]

- name: Configure node_exporter user and systemd unit
  ansible.builtin.import_tasks: configure.yml
  tags: [node_exporter, node_exporter_configure]

- name: Enable and start node_exporter
  ansible.builtin.import_tasks: service.yml
  tags: [node_exporter, node_exporter_service]

- name: Verify node_exporter health
  ansible.builtin.import_tasks: verify.yml
  tags: [node_exporter, node_exporter_verify]
