---
# =============================================================================
# Prerequisites | 前置条件
# =============================================================================

- name: Install prerequisite packages
  ansible.builtin.package:
    name: "{{ k8s_provision_prerequisite_packages }}"
    state: present
  become: true
  register: k8s_provision_prereq_packages
  retries: 3
  delay: 10
  until: k8s_provision_prereq_packages is succeeded
  when: k8s_provision_prerequisite_packages | length > 0

- name: Check that the Docker daemon is reachable (kind only)
  ansible.builtin.command:
    argv:
      - docker
      - info
  register: k8s_provision_docker_info
  changed_when: false
  failed_when: false
  check_mode: false
  when: k8s_provision_provider == 'kind'

- name: Assert that Docker is available for kind
  ansible.builtin.assert:
    that:
      - k8s_provision_docker_info.rc | default(1) == 0
    fail_msg: >-
      kind requires a running Docker daemon reachable by the Ansible user
      ({{ k8s_provision_docker_info.stderr | default('docker command not found') | trim }}).
    quiet: true
  when: k8s_provision_provider == 'kind'

- name: Include kubectl installation
  ansible.builtin.include_tasks: tools_kubectl.yml
  when: k8s_provision_install_kubectl | bool

- name: Include Helm installation
  ansible.builtin.include_tasks: tools_helm.yml
  when: k8s_provision_install_helm | bool
