---
# =============================================================================
# Provision kind (local development) | 部署 kind（本地开发）
# =============================================================================
# Pinned, checksum-verified kind binary -> create the cluster only when
# "kind get clusters" does not list it -> export kubeconfig.

- name: Check installed kind version
  ansible.builtin.command:
    argv:
      - "{{ k8s_provision_kind_bin }}"
      - --version
  register: k8s_provision_kind_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download kind {{ k8s_provision_kind_version }}
  ansible.builtin.get_url:
    url: "{{ k8s_provision_kind_url }}"
    dest: "{{ k8s_provision_kind_bin }}"
    checksum: "{{ k8s_provision_kind_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0755"
    force: true
  become: true
  register: k8s_provision_kind_download
  retries: "{{ k8s_provision_download_retries }}"
  delay: "{{ k8s_provision_download_delay }}"
  until: k8s_provision_kind_download is succeeded
  when: >-
    k8s_provision_kind_probe.rc | default(1) != 0
    or ('kind version ' ~ k8s_provision_kind_version_number) not in (k8s_provision_kind_probe.stdout | default(''))

- name: Ensure the kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k8s_provision_kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"

- name: List existing kind clusters
  ansible.builtin.command:
    argv:
      - "{{ k8s_provision_kind_bin }}"
      - get
      - clusters
  register: k8s_provision_kind_clusters
  changed_when: false
  check_mode: false

- name: Create kind cluster {{ k8s_provision_kind_cluster_name }}
  when: k8s_provision_kind_cluster_name not in k8s_provision_kind_clusters.stdout_lines
  block:
    - name: Create temporary kind configuration file
      ansible.builtin.tempfile:
        state: file
        suffix: -kind-config.yaml
      register: k8s_provision_kind_config_file

    - name: Render the kind cluster configuration
      ansible.builtin.template:
        src: kind-config.yaml.j2
        dest: "{{ k8s_provision_kind_config_file.path }}"
        mode: "0600"

    - name: Create the kind cluster
      ansible.builtin.command:
        argv:
          - "{{ k8s_provision_kind_bin }}"
          - create
          - cluster
          - --name
          - "{{ k8s_provision_kind_cluster_name }}"
          - --config
          - "{{ k8s_provision_kind_config_file.path }}"
          - --kubeconfig
          - "{{ k8s_provision_kubeconfig_path }}"
          - --wait
          - "{{ k8s_provision_kind_wait }}"
      register: k8s_provision_kind_create
      changed_when: true
  always:
    - name: Remove the temporary kind configuration file
      ansible.builtin.file:
        path: "{{ k8s_provision_kind_config_file.path }}"
        state: absent
      when: k8s_provision_kind_config_file.path is defined

- name: Export the kind kubeconfig
  ansible.builtin.command:
    argv:
      - "{{ k8s_provision_kind_bin }}"
      - export
      - kubeconfig
      - --name
      - "{{ k8s_provision_kind_cluster_name }}"
      - --kubeconfig
      - "{{ k8s_provision_kubeconfig_path }}"
  changed_when: false
