---
# =============================================================================
# kubectl - pinned, checksum-verified, architecture-aware install | 安装 kubectl
# =============================================================================

- name: Check installed kubectl version
  ansible.builtin.command:
    argv:
      - "{{ k8s_provision_kubectl_bin }}"
      - version
      - --client
      - --output=yaml
  register: k8s_provision_kubectl_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download kubectl {{ k8s_provision_kubectl_version }}
  ansible.builtin.get_url:
    url: "{{ k8s_provision_kubectl_url }}"
    dest: "{{ k8s_provision_kubectl_bin }}"
    checksum: "{{ k8s_provision_kubectl_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0755"
    force: true
  become: true
  register: k8s_provision_kubectl_download
  retries: "{{ k8s_provision_download_retries }}"
  delay: "{{ k8s_provision_download_delay }}"
  until: k8s_provision_kubectl_download is succeeded
  when: >-
    k8s_provision_kubectl_probe.rc | default(1) != 0
    or ('gitVersion: ' ~ k8s_provision_kubectl_version) not in (k8s_provision_kubectl_probe.stdout | default(''))

- name: Confirm kubectl runs
  ansible.builtin.command:
    argv:
      - "{{ k8s_provision_kubectl_bin }}"
      - version
      - --client
  changed_when: false
  check_mode: false
