---
# =============================================================================
# k8s_provision - main entry point | 主入口
# =============================================================================
# prerequisites -> provider-specific provisioning (kind | k3s) -> verification

- name: Validate provider and host architecture
  ansible.builtin.assert:
    that:
      - k8s_provision_provider in ['kind', 'k3s']
      - ansible_architecture in k8s_provision_arch_map
    fail_msg: >-
      k8s_provision_provider must be 'kind' or 'k3s' (got '{{ k8s_provision_provider }}') and the host
      architecture must be one of {{ k8s_provision_arch_map.keys() | list | join(', ') }}
      (got '{{ ansible_architecture }}').
    quiet: true

- name: Show provisioning context
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }} (environment: {{ server_environment | default('unknown') }})"
      - "Provider: {{ k8s_provision_provider }}, role: {{ k8s_provision_role }}, arch: {{ k8s_provision_arch }}"
      - >-
        Pins: k3s {{ k8s_provision_k3s_version }}, kind {{ k8s_provision_kind_version }},
        kubectl {{ k8s_provision_kubectl_version }}

- name: Include prerequisite checks
  ansible.builtin.include_tasks: prerequisites.yml

- name: Include kind provisioning tasks
  ansible.builtin.include_tasks: provision_kind.yml
  when: k8s_provision_provider == 'kind'

- name: Include k3s provisioning tasks
  ansible.builtin.include_tasks: provision_k3s.yml
  when: k8s_provision_provider == 'k3s'

- name: Include cluster verification tasks
  ansible.builtin.include_tasks: verify.yml
