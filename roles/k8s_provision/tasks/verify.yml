---
# =============================================================================
# Verify the cluster | 验证集群
# =============================================================================

- name: Verify the k3s agent service (worker nodes)
  when:
    - k8s_provision_provider == 'k3s'
    - k8s_provision_k3s_role == 'agent'
  block:
    # systemd_service with only `name:` fails (required_one_of), so read the state with systemctl.
    - name: Read the k3s agent service state
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ k8s_provision_service_name }}"]
      register: k8s_provision_agent_service
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the k3s agent service is active
      ansible.builtin.assert:
        that:
          - k8s_provision_agent_service.stdout | trim == 'active'
        fail_msg: >-
          {{ k8s_provision_service_name }} is {{ k8s_provision_agent_service.stdout | default('unknown') | trim }}
          on {{ inventory_hostname }}
        quiet: true

- name: Verify the cluster through kubectl
  when: k8s_provision_provider == 'kind' or k8s_provision_k3s_role == 'server'
  environment:
    KUBECONFIG: "{{ k8s_provision_kubeconfig_path }}"
  block:
    - name: Wait for the API server to answer
      ansible.builtin.command:
        argv:
          - "{{ k8s_provision_kubectl_bin }}"
          - cluster-info
      register: k8s_provision_cluster_info
      changed_when: false
      retries: "{{ k8s_provision_ready_retries }}"
      delay: "{{ k8s_provision_ready_delay }}"
      until: k8s_provision_cluster_info.rc == 0

    - name: Wait for all nodes to be Ready
      ansible.builtin.command:
        argv:
          - "{{ k8s_provision_kubectl_bin }}"
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=60s
      register: k8s_provision_nodes_ready
      changed_when: false
      retries: "{{ k8s_provision_ready_retries }}"
      delay: "{{ k8s_provision_ready_delay }}"
      until: k8s_provision_nodes_ready.rc == 0

    - name: Wait for kube-system deployments to be available
      ansible.builtin.command:
        argv:
          - "{{ k8s_provision_kubectl_bin }}"
          - --namespace=kube-system
          - wait
          - --for=condition=Available
          - deployment
          - --all
          - --timeout=120s
      register: k8s_provision_system_deployments
      changed_when: false
      retries: "{{ k8s_provision_ready_retries }}"
      delay: "{{ k8s_provision_ready_delay }}"
      until: k8s_provision_system_deployments.rc == 0

    - name: Collect the node summary
      ansible.builtin.command:
        argv:
          - "{{ k8s_provision_kubectl_bin }}"
          - get
          - nodes
          - --output=wide
      register: k8s_provision_nodes
      changed_when: false

    - name: Show the cluster summary
      ansible.builtin.debug:
        msg: "{{ k8s_provision_nodes.stdout_lines }}"
