---
# =============================================================================
# fail2ban with verified roll-out | fail2ban 验证式下发
# =============================================================================
# Only included when common_fail2ban_enabled is true (see tasks/main.yml).

- name: Install fail2ban | 安装 fail2ban
  ansible.builtin.package:
    name: "{{ common_fail2ban_packages }}"
    state: present
  register: common_fail2ban_install
  retries: "{{ common_package_retries | int }}"
  delay: "{{ common_package_retry_delay | int }}"
  until: common_fail2ban_install is succeeded

- name: Roll out fail2ban jail.local with verification | 下发 jail.local 并验证
  block:
    - name: Deploy jail.local | 部署 jail.local
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: common_fail2ban_jail
      notify: Restart fail2ban

    - name: Test the complete fail2ban configuration before restarting | 重启前测试完整配置
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - -t
      changed_when: false

    - name: Ensure fail2ban is enabled and running | 确保 fail2ban 已启用并运行
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Apply pending fail2ban restart | 应用待处理的 fail2ban 重启
      ansible.builtin.meta: flush_handlers

    - name: Verify the fail2ban server answers | 验证 fail2ban 服务可响应
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - ping
      register: common_fail2ban_ping
      retries: "{{ common_fail2ban_verify_retries | int }}"
      delay: "{{ common_fail2ban_verify_delay | int }}"
      until: common_fail2ban_ping.rc == 0
      changed_when: false

  rescue:
    - name: Restore the previous jail.local | 恢复之前的 jail.local
      ansible.builtin.copy:
        src: "{{ common_fail2ban_jail.backup_file }}"
        dest: /etc/fail2ban/jail.local
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - common_fail2ban_jail.backup_file is defined
        - common_fail2ban_jail.backup_file | length > 0

    - name: Restart fail2ban with the restored configuration | 使用恢复的配置重启 fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
      when:
        - common_fail2ban_jail.backup_file is defined
        - common_fail2ban_jail.backup_file | length > 0

    - name: Fail after fail2ban rollback | fail2ban 回滚后报错
      ansible.builtin.fail:
        msg: >-
          fail2ban verification failed on {{ inventory_hostname }}.
          {{ 'Previous jail.local restored from ' ~ common_fail2ban_jail.backup_file ~ ' and fail2ban restarted.'
             if (common_fail2ban_jail.backup_file | default('') | length > 0)
             else 'Nothing to restore (jail.local was unchanged).' }}
          Error: {{ ansible_failed_result.msg | default('see the failed task above') }}
