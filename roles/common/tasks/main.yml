---
# =============================================================================
# Common role - base configuration and hardening | 基础配置与安全加固
# =============================================================================
# Task files run in this order; each optional stage has a `common_manage_*`
# toggle in defaults/main.yml.
#   preflight -> packages -> hostname -> time -> users -> ssh -> sysctl
#   -> limits -> fail2ban -> services
# =============================================================================

- name: Run preflight checks | 预检
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - common
    - common_preflight

- name: Manage base packages | 管理基础软件包
  ansible.builtin.import_tasks: packages.yml
  when: common_manage_packages | bool
  tags:
    - common
    - common_packages

- name: Manage hostname | 管理主机名
  ansible.builtin.import_tasks: hostname.yml
  when: common_manage_hostname | bool
  tags:
    - common
    - common_hostname

- name: Manage timezone, locale and NTP | 管理时区、区域设置与 NTP
  ansible.builtin.import_tasks: time.yml
  when: common_manage_time | bool
  tags:
    - common
    - common_time

- name: Manage admin users | 管理管理员用户
  ansible.builtin.import_tasks: users.yml
  when: common_manage_users | bool
  tags:
    - common
    - common_users

- name: Manage SSH daemon | 管理 SSH 服务
  ansible.builtin.import_tasks: ssh.yml
  when: common_manage_ssh | bool
  tags:
    - common
    - common_ssh

- name: Manage kernel parameters | 管理内核参数
  ansible.builtin.import_tasks: sysctl.yml
  when: common_manage_sysctl | bool
  tags:
    - common
    - common_sysctl

- name: Manage PAM resource limits | 管理 PAM 资源限制
  ansible.builtin.import_tasks: limits.yml
  when: common_manage_limits | bool
  tags:
    - common
    - common_limits

- name: Manage fail2ban | 管理 fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
  when:
    - common_manage_fail2ban | bool
    - common_fail2ban_enabled | bool
  tags:
    - common
    - common_fail2ban

- name: Disable unneeded services | 禁用不需要的服务
  ansible.builtin.import_tasks: services.yml
  when: common_manage_services | bool
  tags:
    - common
    - common_services
