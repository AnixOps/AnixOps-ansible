---
# =============================================================================
# Stop and disable unneeded services | 停止并禁用不需要的服务
# =============================================================================
# Units are touched only when they exist. Sockets and path units are handled
# before the service so systemd cannot re-activate it on demand.

- name: Collect service facts | 收集服务事实
  ansible.builtin.service_facts:
  when: common_disable_services | length > 0

- name: List socket and path units | 列出 socket 与 path 单元
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - --no-legend
      - --no-pager
      - --type=socket,path
  register: common_activation_units
  changed_when: false
  failed_when: false
  when: common_disable_services | length > 0

- name: Build the list of units to disable | 生成待禁用单元列表
  ansible.builtin.set_fact:
    common_units_to_disable: >-
      {%- set units = [] -%}
      {%- set known_units = common_activation_units.stdout_lines | default([]) | map('split') | map('first') | list -%}
      {%- for svc in common_disable_services -%}
        {%- for suffix in ['socket', 'path'] -%}
          {%- if (svc ~ '.' ~ suffix) in known_units -%}
            {%- set _ = units.append(svc ~ '.' ~ suffix) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set unit = svc ~ '.service' -%}
        {%- if unit in ansible_facts.services
              and ansible_facts.services[unit].status not in ['not-found', 'masked'] -%}
          {%- set _ = units.append(unit) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ units }}
  when: common_disable_services | length > 0

- name: Stop and disable unneeded units | 停止并禁用不需要的单元
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ common_units_to_disable | default([]) }}"
