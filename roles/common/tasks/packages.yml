---
# =============================================================================
# Base packages | 基础软件包
# =============================================================================
# Repository hygiene (third-party apt sources, signing keys) belongs to the
# role that owns the repository (e.g. roles/grafana); this role only refreshes
# the cache and installs the base tool set.

- name: Refresh apt cache (Debian/Ubuntu) | 刷新 apt 缓存
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time | int }}"
    lock_timeout: "{{ common_apt_lock_timeout | int }}"
  register: common_apt_cache
  retries: "{{ common_package_retries | int }}"
  delay: "{{ common_package_retry_delay | int }}"
  until: common_apt_cache is succeeded
  changed_when: false
  when:
    - ansible_os_family == 'Debian'
    - common_refresh_apt_cache | bool

- name: Install base packages (Debian/Ubuntu) | 安装基础软件包
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    lock_timeout: "{{ common_apt_lock_timeout | int }}"
  register: common_apt_install
  retries: "{{ common_package_retries | int }}"
  delay: "{{ common_package_retry_delay | int }}"
  until: common_apt_install is succeeded
  when:
    - ansible_os_family == 'Debian'
    - common_packages | length > 0

- name: Refresh dnf metadata (RedHat) | 刷新 dnf 元数据
  ansible.builtin.dnf:
    update_cache: true
  register: common_dnf_cache
  retries: "{{ common_package_retries | int }}"
  delay: "{{ common_package_retry_delay | int }}"
  until: common_dnf_cache is succeeded
  changed_when: false
  when: ansible_os_family == 'RedHat'

- name: Install base packages (RedHat) | 安装基础软件包
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  register: common_dnf_install
  retries: "{{ common_package_retries | int }}"
  delay: "{{ common_package_retry_delay | int }}"
  until: common_dnf_install is succeeded
  when:
    - ansible_os_family == 'RedHat'
    - common_packages | length > 0
