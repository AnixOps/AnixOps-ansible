---
# =============================================================================
# Hostname | 主机名
# =============================================================================

- name: Set the system hostname | 设置系统主机名
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname not in common_hostname_skip_list

- name: Map the hostname to 127.0.1.1 in /etc/hosts | 在 /etc/hosts 中映射主机名
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present
    owner: root
    group: root
    mode: "0644"
  when: common_hostname not in common_hostname_skip_list
