---
# =============================================================================
# Kernel parameters | 内核参数
# =============================================================================

- name: Apply kernel parameters | 应用内核参数
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ common_sysctl_file }}"
    state: present
    reload: true
    ignoreerrors: "{{ common_sysctl_ignore_unknown_keys | bool }}"
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
