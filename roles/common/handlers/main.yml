---
# =============================================================================
# Common role handlers | common 角色处理器
# =============================================================================

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ common_ssh_service_name | default(common_service_name) }}"
    state: restarted

- name: Reload sshd
  ansible.builtin.service:
    name: "{{ common_ssh_service_name | default(common_service_name) }}"
    state: reloaded

- name: Restart chrony
  ansible.builtin.service:
    name: "{{ common_chrony_service_name }}"
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
