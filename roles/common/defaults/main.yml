---
# =============================================================================
# Common role - default variables | common 角色默认变量
# =============================================================================
# Every variable is prefixed with `common_`. Where a global knob already exists
# in inventories/production/group_vars/all/main.yml (timezone, locale,
# ssh_port, ssh_allow_root, ssh_password_authentication,
# ssh_pubkey_authentication, ntp_servers, common_packages, admin_users,
# security, sysctl_config) the prefixed variable falls back to it, so operators
# keep editing group_vars and nothing changes for them.
# =============================================================================

# -----------------------------------------------------------------------------
# Feature toggles | 功能开关
# -----------------------------------------------------------------------------
common_manage_hostname: true
common_manage_packages: true
common_manage_time: true
common_manage_users: true
common_manage_ssh: true
common_manage_sysctl: true
common_manage_limits: true
common_manage_fail2ban: true
common_manage_services: true

# -----------------------------------------------------------------------------
# Hostname | 主机名
# -----------------------------------------------------------------------------
common_hostname: "{{ inventory_hostname }}"
# Names that are never written to the host (connection: local / ad-hoc runs).
common_hostname_skip_list:
  - localhost
  - 127.0.0.1

# -----------------------------------------------------------------------------
# Packages | 软件包
# -----------------------------------------------------------------------------
# `common_packages` is the INSTALL list. It is also a global key in
# group_vars/all, which takes precedence over this default.
common_packages:
  - curl
  - wget
  - vim
  - htop
  - git
  - unzip
  - tar
  - chrony
common_refresh_apt_cache: true
common_apt_cache_valid_time: 3600
# Seconds to wait for the apt/dpkg lock (unattended-upgrades, cloud-init...).
common_apt_lock_timeout: 300
common_package_retries: 5
common_package_retry_delay: 10

# -----------------------------------------------------------------------------
# Time: timezone, locale, chrony | 时间：时区、区域设置、chrony
# -----------------------------------------------------------------------------
common_timezone: "{{ timezone | default('Asia/Shanghai') }}"
common_locale: "{{ locale | default('en_US.UTF-8') }}"
# Debian/Ubuntu need the `locales` package before a locale can be generated.
common_locale_packages:
  - locales
common_ntp_servers: "{{ ntp_servers | default(['0.pool.ntp.org', '1.pool.ntp.org']) }}"
# Optional `pool` directives in addition to `server` lines.
common_ntp_pools: []
common_chrony_package: chrony
common_chrony_service_name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
common_chrony_conf_path: "{{ '/etc/chrony.conf' if ansible_os_family == 'RedHat' else '/etc/chrony/chrony.conf' }}"
# `chronyd -p -f FILE` parses a config and exits (chrony >= 4.0: bullseye,
# jammy, bookworm, noble). Set to "" to skip validation on older releases.
common_chrony_validate_cmd: "{{ '/usr/sbin/chronyd -p -f %s' if ansible_os_family == 'Debian' else '' }}"
common_chrony_makestep: "1.0 3"
# Raw lines appended verbatim to chrony.conf.
common_chrony_extra_config: ""

# -----------------------------------------------------------------------------
# Admin users | 管理员用户
# -----------------------------------------------------------------------------
# Each item: name (required), shell, state (present|absent), groups (list),
# authorized_keys (list of public key strings), authorized_keys_exclusive
# (bool, remove keys not in the list), remove (bool, delete home when absent).
common_admin_users: "{{ admin_users | default([]) }}"
common_admin_default_shell: /bin/bash
common_sudo_group: "{{ 'wheel' if ansible_os_family == 'RedHat' else 'sudo' }}"
# When true every present admin user gets `NOPASSWD:ALL` through a validated
# sudoers drop-in. When false the drop-in is removed.
common_admin_sudo_nopasswd: false
common_admin_sudoers_file: /etc/sudoers.d/90-common-admins

# -----------------------------------------------------------------------------
# SSH daemon | SSH 服务
# -----------------------------------------------------------------------------
common_ssh_port: "{{ ssh_port | default(22) }}"
common_ssh_allow_root: "{{ ssh_allow_root | default(true) }}"
common_ssh_password_authentication: "{{ ssh_password_authentication | default(true) }}"
common_ssh_pubkey_authentication: "{{ ssh_pubkey_authentication | default(true) }}"
common_ssh_address_family: any
# Empty list = listen on every address of the selected family.
common_ssh_listen_addresses:
  - "0.0.0.0"
common_ssh_allow_users: []
common_ssh_allow_groups: []
common_ssh_login_grace_time: 30
common_ssh_max_auth_tries: 3
common_ssh_max_sessions: 10
common_ssh_max_startups: "10:30:60"
common_ssh_client_alive_interval: 300
common_ssh_client_alive_count_max: 2
common_ssh_allow_tcp_forwarding: true
common_ssh_allow_agent_forwarding: false
common_ssh_x11_forwarding: false
common_ssh_use_dns: false
common_ssh_log_level: INFO
common_ssh_banner: none
common_ssh_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - ecdh-sha2-nistp521
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp256
  - diffie-hellman-group-exchange-sha256
common_ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
common_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
common_ssh_sftp_server_path: >-
  {{ '/usr/libexec/openssh/sftp-server' if ansible_os_family == 'RedHat'
     else '/usr/lib/openssh/sftp-server' }}
# Raw lines appended verbatim to sshd_config (e.g. Match blocks).
common_ssh_extra_config: ""
# Ubuntu >= 22.10 starts sshd through ssh.socket, which ignores `Port` in
# sshd_config. When true the role switches an enabled socket to the classic
# ssh.service so that sshd_config is authoritative.
common_ssh_disable_socket_activation: true
# Post-change verification (config roll-out pattern, see README).
# true  = the controller connects to common_ssh_verify_host:common_ssh_port
# false = the managed host checks 127.0.0.1:common_ssh_port (bastion setups)
common_ssh_verify_from_controller: true
common_ssh_verify_host: "{{ ansible_host | default(inventory_hostname) }}"
common_ssh_verify_timeout: 30
common_ssh_verify_retries: 3
common_ssh_verify_delay: 5

# -----------------------------------------------------------------------------
# Kernel parameters | 内核参数
# -----------------------------------------------------------------------------
common_sysctl: "{{ sysctl_config | default({}) }}"
common_sysctl_file: /etc/sysctl.conf
# Pass `-e` to sysctl so keys missing in containers/VMs do not abort the run.
common_sysctl_ignore_unknown_keys: true

# -----------------------------------------------------------------------------
# Security: PAM limits and fail2ban | 安全：资源限制与 fail2ban
# -----------------------------------------------------------------------------
common_security: "{{ security | default({}) }}"
common_security_limits: "{{ common_security.limits | default([]) }}"
common_limits_file: /etc/security/limits.conf
common_fail2ban_enabled: "{{ common_security.fail2ban_enabled | default(false) }}"
common_fail2ban_ban_time: "{{ common_security.fail2ban_ban_time | default(3600) }}"
common_fail2ban_find_time: "{{ common_security.fail2ban_find_time | default(600) }}"
common_fail2ban_max_retry: "{{ common_security.fail2ban_max_retry | default(5) }}"
# Never ban these sources (add your controller / office IPs here).
common_fail2ban_ignore_ips:
  - 127.0.0.1/8
  - "::1"
# journald backend: works without rsyslog (Debian 12+ has no auth.log).
common_fail2ban_backend: systemd
# Empty = distribution default (Debian 12 uses nftables via jail.d).
common_fail2ban_banaction: ""
common_fail2ban_dest_email: root@localhost
common_fail2ban_packages: "{{ ['fail2ban', 'python3-systemd'] if ansible_os_family == 'Debian' else ['fail2ban'] }}"
# Raw INI text appended to jail.local for additional jails.
common_fail2ban_extra_jails: ""
common_fail2ban_verify_retries: 5
common_fail2ban_verify_delay: 3

# -----------------------------------------------------------------------------
# Services to stop and disable when their unit exists | 禁用的服务
# -----------------------------------------------------------------------------
common_disable_services:
  - avahi-daemon
  - cups

# -----------------------------------------------------------------------------
# Lifecycle contract (consumed by roles/lifecycle) | 生命周期契约
# -----------------------------------------------------------------------------
common_port: "{{ common_ssh_port }}"
common_health_url: ""
common_service_name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
common_backup_files:
  - /etc/ssh/sshd_config
  - "{{ common_chrony_conf_path }}"
  - /etc/fail2ban/jail.local
  - "{{ common_sysctl_file }}"
  - "{{ common_limits_file }}"
common_config_dirs:
  - /etc/ssh
  - /etc/chrony
  - /etc/fail2ban
# The generic contract key `<role>_packages` means "packages removed on
# cleanup". For this role `common_packages` is the INSTALL list of base tools
# (python3, curl, chrony...) and must never be uninstalled, so the cleanup
# list is a separate, intentionally empty variable.
common_cleanup_packages: []
