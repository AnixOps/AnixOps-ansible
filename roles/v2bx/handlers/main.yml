---
# =============================================================================
# V2bX handlers | V2bX 处理器
# =============================================================================
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart V2bX
  ansible.builtin.systemd:
    name: "{{ v2bx_service_name }}"
    state: restarted
    enabled: true
