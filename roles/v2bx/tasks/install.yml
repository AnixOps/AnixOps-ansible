---
# =============================================================================
# V2bX installation | V2bX 安装
# =============================================================================
# get_url with force=false skips the download when the file already exists, so
# a second run touches the network only when v2bx_force_update /
# v2bx_update_geodata is true or a checksum no longer matches.

- name: Create V2bX directories | 创建 V2bX 目录
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ v2bx_install_dir }}", mode: "0755" }
    - { path: "{{ v2bx_config_dir }}", mode: "0750" }
    - { path: "{{ v2bx_data_dir }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Download the V2bX binary | 下载 V2bX 二进制
  ansible.builtin.get_url:
    url: "{{ v2bx_binary_url }}"
    dest: "{{ v2bx_install_dir }}/{{ v2bx_bin_name }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ v2bx_force_update | bool }}"
    checksum: "{{ v2bx_binary_checksum if v2bx_binary_checksum | length > 0 else omit }}"
    timeout: 120
  register: v2bx_binary_download
  retries: 5
  delay: 10
  until: v2bx_binary_download is succeeded
  notify: Restart V2bX

- name: Download geo data files | 下载 geo 数据文件
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ v2bx_install_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    force: "{{ v2bx_update_geodata | bool }}"
    checksum: "{{ item.checksum if item.checksum | length > 0 else omit }}"
    timeout: 120
  loop:
    - { name: geoip.dat, url: "{{ v2bx_geoip_url }}", checksum: "{{ v2bx_geoip_checksum }}" }
    - { name: geosite.dat, url: "{{ v2bx_geosite_url }}", checksum: "{{ v2bx_geosite_checksum }}" }
  loop_control:
    label: "{{ item.name }}"
  register: v2bx_geodata_download
  retries: 5
  delay: 10
  until: v2bx_geodata_download is succeeded
  notify: Restart V2bX
