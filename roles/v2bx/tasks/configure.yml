---
# =============================================================================
# V2bX configuration | V2bX 配置
# =============================================================================
# Render config.json (validated as JSON) and the hardened unit, flush handlers
# so daemon-reload / restart happen before the service is started. On failure
# the previous config.json is restored, the service restarted and the play
# fails with the journal tail.

- name: Configure and start V2bX | 配置并启动 V2bX
  block:
    - name: Render config.json | 渲染 config.json
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ v2bx_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0600"
        backup: true
      register: v2bx_config_result
      no_log: true
      notify: Restart V2bX

    - name: Validate config.json syntax | 校验 config.json 语法
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - "{{ v2bx_config_dir }}/config.json"
          - /dev/null
      changed_when: false

    - name: Install the V2bX systemd unit | 安装 V2bX systemd 单元
      ansible.builtin.template:
        src: V2bX.service.j2
        dest: "/etc/systemd/system/{{ v2bx_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: v2bx_unit_result
      notify:
        - Reload systemd
        - Restart V2bX

    - name: Apply pending handlers before starting the service | 启动前执行挂起的处理器
      ansible.builtin.meta: flush_handlers

    - name: Enable and start V2bX | 启用并启动 V2bX
      ansible.builtin.systemd:
        name: "{{ v2bx_service_name }}"
        state: started
        enabled: true
        daemon_reload: true
  rescue:
    - name: Restore the previous config.json | 恢复上一版 config.json
      ansible.builtin.copy:
        src: "{{ v2bx_config_result.backup_file }}"
        dest: "{{ v2bx_config_dir }}/config.json"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      register: v2bx_config_restored
      no_log: true
      when:
        - v2bx_config_result is changed
        - v2bx_config_result.backup_file is defined

    - name: Restart V2bX with the restored configuration | 使用恢复的配置重启 V2bX
      ansible.builtin.systemd:
        name: "{{ v2bx_service_name }}"
        state: restarted
      register: v2bx_restore_restart
      failed_when: false
      when: v2bx_config_restored is changed

    - name: Collect the V2bX journal | 收集 V2bX 日志
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ v2bx_service_name }}"
          - -n
          - "100"
          - --no-pager
          - --no-hostname
      register: v2bx_journal
      changed_when: false
      failed_when: false

    - name: Fail with diagnostics | 输出诊断信息并失败
      ansible.builtin.fail:
        msg: |
          V2bX configuration failed on {{ inventory_hostname }} at task
          '{{ ansible_failed_task.name | default('unknown') }}': {{ ansible_failed_result.msg | default('') }}
          Previous config.json restored: {{ v2bx_config_restored is changed }}.
          Journal tail:
          {{ v2bx_journal.stdout | default('') }}
