---
# =============================================================================
# V2bX main tasks | V2bX 主任务
# =============================================================================
# validate -> resolve AuthKey -> install -> configure -> verify

- name: Validate required variables | 校验必需变量
  ansible.builtin.assert:
    that:
      - v2bx_api_host | default('') | length > 0
      - v2bx_protocols | default([]) | length > 0
      - v2bx_node_name | default('') | length > 0
    fail_msg: |
      Missing required V2bX configuration | 缺少必需配置:
      - V2BX_API_HOST   (panel base URL, e.g. http://100.96.0.5:8080)
      - V2BX_PROTOCOLS  (JSON array or comma list, e.g. ["vmess","vless"])
      - V2BX_NODE_NAME  (defaults to the inventory hostname)
    quiet: true

- name: Validate AuthKey prerequisites | 校验 AuthKey 前置条件
  ansible.builtin.assert:
    that:
      - v2bx_auth_key | length > 0 or not (v2bx_auto_generate_authkey | bool) or v2bx_panel_api_token | length > 0
    fail_msg: >-
      v2bx_auto_generate_authkey is enabled but V2BOARD_API_TOKEN is empty;
      export it or provide V2BX_AUTH_KEY.
    quiet: true

- name: Include AuthKey resolution tasks | 解析 AuthKey
  ansible.builtin.include_tasks: authkey.yml

- name: Include installation tasks | 安装
  ansible.builtin.include_tasks: install.yml

- name: Include configuration tasks | 配置
  ansible.builtin.include_tasks: configure.yml

- name: Include verification tasks | 验证
  ansible.builtin.include_tasks: verify.yml
