---
# =============================================================================
# V2bX role defaults | V2bX 角色默认变量
# =============================================================================
# Values are read from environment variables (GitHub Actions secrets or a local
# shell) and can be overridden in inventory. Empty env values fall back to the
# documented default ("or" semantics, not "| default()").
# =============================================================================

# --- Installation | 安装 -----------------------------------------------------
v2bx_repo_owner: "AnixOps"
v2bx_repo_name: "V2bX_AnixOps"
v2bx_repo_branch: "dev_new"
v2bx_install_dir: "/usr/local/V2bX"
v2bx_config_dir: "/etc/V2bX"
v2bx_data_dir: "/var/lib/V2bX"
v2bx_bin_name: "V2bX"
v2bx_arch: "{{ _target_arch | default(('arm64' if ansible_architecture == 'aarch64' else 'amd64')) }}"

# The upstream repository publishes a rolling release tagged "latest".
# Override with V2BX_BINARY_URL to install a pinned build.
v2bx_binary_url: >-
  {{ lookup('env', 'V2BX_BINARY_URL')
     or 'https://github.com/' ~ v2bx_repo_owner ~ '/' ~ v2bx_repo_name
        ~ '/releases/download/latest/' ~ v2bx_bin_name ~ '-linux-' ~ v2bx_arch }}
# Optional checksum in get_url format, e.g. "sha256:<hex>".
v2bx_binary_checksum: ""
# Re-download the binary even when it already exists.
v2bx_force_update: false

# Geo data (downloaded only when missing unless v2bx_update_geodata is true)
v2bx_geoip_url: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
v2bx_geosite_url: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
v2bx_geoip_checksum: ""
v2bx_geosite_checksum: ""
v2bx_update_geodata: false

# --- Core | 内核 -------------------------------------------------------------
# sing | xray | hysteria2
v2bx_core: "{{ lookup('env', 'V2BX_CORE') or 'sing' }}"

# --- Panel connection | 面板连接 --------------------------------------------
# Panel base URL reachable from the node, e.g. http://100.96.0.5:8080
v2bx_api_host: "{{ lookup('env', 'V2BX_API_HOST') or '' }}"
# Node name registered in the panel. V2BX_NODE_NAME applies to every host of a
# run, so prefer a per-host override (host_vars) when deploying several nodes.
v2bx_node_name: "{{ lookup('env', 'V2BX_NODE_NAME') or inventory_hostname }}"
v2bx_auto_register: true
v2bx_credential_file: "{{ v2bx_data_dir }}/credential.json"

# --- AuthKey | 注册密钥 -------------------------------------------------------
# Resolution order: V2BX_AUTH_KEY env > key stored on the node > panel API.
# The obtained key is stored in v2bx_authkey_file (0600) and reused on later
# runs so config.json stays stable and the service is not restarted needlessly.
v2bx_auth_key: "{{ lookup('env', 'V2BX_AUTH_KEY') or '' }}"
v2bx_authkey_file: "{{ v2bx_config_dir }}/authkey"
v2bx_auto_generate_authkey: "{{ lookup('env', 'V2BX_AUTO_GENERATE_AUTHKEY') or 'true' }}"
# Same token the v2board role writes into config.yaml (app.api_token).
v2bx_panel_api_token: "{{ lookup('env', 'V2BOARD_API_TOKEN') or '' }}"
v2bx_authkey_expire_days: "{{ lookup('env', 'V2BX_AUTHKEY_EXPIRE_DAYS') or 1 }}"
v2bx_authkey_api_path: "/api/v2/internal/auth-keys"
# Host that performs the panel API call (the controller by default).
v2bx_authkey_api_delegate: "localhost"
v2bx_authkey_api_timeout: 30

# --- Protocols | 协议 --------------------------------------------------------
# V2BX_PROTOCOLS accepts a JSON array ('["vmess","vless"]') or a comma
# separated list ('vmess,vless'). Each entry becomes a node whose port, TLS and
# transport settings are fetched from the panel.
v2bx_protocols_env: "{{ lookup('env', 'V2BX_PROTOCOLS') }}"
v2bx_protocols: >-
  {{ (v2bx_protocols_env | from_json) if (v2bx_protocols_env | trim).startswith('[')
     else ((v2bx_protocols_env.split(',') | map('trim') | reject('equalto', '') | list)
           if v2bx_protocols_env | trim | length > 0 else ['vmess']) }}

# --- Certificates | 证书 ------------------------------------------------------
v2bx_cert_mode: "{{ lookup('env', 'V2BX_CERT_MODE') or 'self' }}"
v2bx_cert_domain: "{{ lookup('env', 'V2BX_CERT_DOMAIN') or '' }}"

# --- Security / runtime | 安全与运行参数 --------------------------------------
v2bx_enable_sign: true
v2bx_encrypt_credential: true
v2bx_log_level: "{{ lookup('env', 'V2BX_LOG_LEVEL') or 'info' }}"
v2bx_heartbeat_interval: 60
# V2bX binds privileged ports and raw sockets; root keeps the historical behaviour.
v2bx_service_user: "root"
# Extra units V2bX should start after (e.g. ["warp-svc.service"]).
v2bx_extra_after_units: []

# --- Verification | 验证 ------------------------------------------------------
v2bx_credential_wait_retries: 12
v2bx_credential_wait_delay: 5
v2bx_port_wait_timeout: 60

# =============================================================================
# Lifecycle contract (consumed by roles/lifecycle) | 生命周期契约
# =============================================================================
# Listening ports are assigned by the panel; set v2bx_port > 0 to wait for a
# specific port after start. V2bX exposes no HTTP health endpoint.
v2bx_port: 0
v2bx_health_url: ""
v2bx_backup_files:
  - "{{ v2bx_config_dir }}/config.json"
  - "{{ v2bx_authkey_file }}"
  - "{{ v2bx_credential_file }}"
v2bx_config_dirs:
  - "{{ v2bx_config_dir }}"
  - "{{ v2bx_data_dir }}"
v2bx_packages: []
v2bx_service_name: "V2bX"
