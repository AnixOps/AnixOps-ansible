---
# =============================================================================
# Lifecycle role - default variables | 生命周期角色默认变量
# =============================================================================
# Every knob is role-prefixed (lifecycle_*). The un-prefixed names that the
# CLI (scripts/anixops.sh), the GitHub workflow and older playbooks pass with
# `-e` (state_dir, hooks_backup_base_dir, cleanup_keep_backups, cleanup_confirm,
# cleanup_force, notification_webhook_url, ...) keep working as fallbacks.
#
# Required input (no defaults on purpose):
#   lifecycle_target_role  name of the service role to manage (nginx, loki, ...)
#   lifecycle_hook         one of lifecycle_valid_hooks. The legacy name
#                          lifecycle_hook_type is honoured when lifecycle_hook
#                          is not set.
# =============================================================================

lifecycle_valid_hooks:
  - pre_deploy
  - post_deploy
  - pre_rollback
  - post_rollback
  - status
  - cleanup

# Load the target role's defaults (its lifecycle contract: <role>_service_name,
# <role>_port, <role>_health_url, <role>_backup_files, <role>_config_dirs,
# <role>_packages) WITHOUT running any of its tasks. Needed so pre_deploy,
# status, rollback and cleanup know what to back up / restore / remove before
# (or without) the service role itself being included. Inventory values still
# win because role defaults have the lowest precedence.
lifecycle_load_target_defaults: true

# -----------------------------------------------------------------------------
# State files | 状态文件
# -----------------------------------------------------------------------------
lifecycle_state_dir: "{{ state_dir | default('/var/lib/anixops/state') }}"
lifecycle_state_file: "{{ state_file | default(lifecycle_state_dir ~ '/' ~ lifecycle_target_role ~ '_state.json') }}"
lifecycle_history_file: "{{ history_file | default(lifecycle_state_dir ~ '/' ~ lifecycle_target_role ~ '_history.json') }}"
lifecycle_pre_deploy_file: "{{ lifecycle_state_dir }}/{{ lifecycle_target_role }}_pre_deploy.json"
lifecycle_pre_rollback_file: "{{ lifecycle_state_dir }}/{{ lifecycle_target_role }}_pre_rollback.json"

# -----------------------------------------------------------------------------
# Hook execution | Hook 执行控制
# -----------------------------------------------------------------------------
lifecycle_hooks_enabled: "{{ hooks_enabled | default(true) }}"
# Dry run: post_rollback and cleanup only print their plan and stop.
lifecycle_dry_run: "{{ hooks_dry_run | default(false) }}"

# -----------------------------------------------------------------------------
# Backups (versioned snapshot directories) | 备份
# -----------------------------------------------------------------------------
# Layout: <base_dir>/<role>/<YYYYMMDDTHHMMSS>/{pre,post}/{NN-<basename>,manifest.json}
lifecycle_hooks_backup_enabled: "{{ hooks_backup_enabled | default(true) }}"
lifecycle_hooks_backup_base_dir: "{{ hooks_backup_base_dir | default('/var/backups') }}"
lifecycle_hooks_backup_dir_mode: "0700"
# Snapshot versions older than this many days are pruned by pre_deploy
# (0 disables age-based pruning). The newest lifecycle_hooks_backup_min_keep
# versions are always kept regardless of age.
lifecycle_hooks_backup_retention_days: "{{ hooks_backup_retention_days | default(30) }}"
lifecycle_hooks_backup_min_keep: 3

# -----------------------------------------------------------------------------
# Verification | 验证
# -----------------------------------------------------------------------------
lifecycle_hooks_verify_enabled: "{{ hooks_verify_enabled | default(true) }}"
# When strict, post_deploy / post_rollback FAIL if the service is unhealthy
# (state and history are still written first, so the failure is recorded).
lifecycle_hooks_verify_strict: true
lifecycle_hooks_verify_retries: "{{ hooks_verify_retries | default(6) }}"
lifecycle_hooks_verify_delay: "{{ hooks_verify_delay | default(5) }}"
lifecycle_hooks_verify_timeout: "{{ hooks_verify_timeout | default(30) }}"
lifecycle_hooks_verify_status_codes: [200, 204]

# -----------------------------------------------------------------------------
# Notifications | 通知
# -----------------------------------------------------------------------------
lifecycle_hooks_notify_enabled: "{{ hooks_notify_enabled | default(true) }}"
lifecycle_notification_webhook_url: "{{ notification_webhook_url | default(lookup('env', 'NOTIFICATION_WEBHOOK_URL')) }}"
lifecycle_notification_slack_url: "{{ notification_slack_url | default(lookup('env', 'SLACK_WEBHOOK_URL')) }}"
lifecycle_notification_timeout: 10

# -----------------------------------------------------------------------------
# Rollback | 回滚
# -----------------------------------------------------------------------------
# lifecycle_version selects the target: prev (default) | initial | v<YYYYMMDDTHHMMSS>
# lifecycle_restore_from: absolute snapshot directory (with manifest.json) to
#   restore instead of resolving lifecycle_version through the history.
lifecycle_hooks_graceful_stop: "{{ hooks_graceful_stop | default(false) }}"
# Old (pre-manifest) backup directories hold bare basenames; restoring them
# into /etc/<role>/ is only right for some roles, so it is opt-in.
lifecycle_rollback_allow_legacy: false
# Put the pre-rollback snapshot back when the rolled-back service fails its
# health check (validation failures ALWAYS revert).
lifecycle_rollback_revert_on_unhealthy: false

# Config validators run after a restore; a non-zero exit reverts the restore.
# A validator whose binary is not installed is skipped.
lifecycle_validators:
  nginx:
    - {bin: nginx, argv: [nginx, -t]}
  acme_ssl:
    - {bin: nginx, argv: [nginx, -t]}
  common:
    - {bin: sshd, argv: [sshd, -t]}
    - {bin: fail2ban-client, argv: [fail2ban-client, -t]}
  prometheus:
    - {bin: promtool, argv: [promtool, check, config, /etc/prometheus/prometheus.yml]}
lifecycle_validator_path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# -----------------------------------------------------------------------------
# Cleanup | 清理
# -----------------------------------------------------------------------------
# cleanup_confirm=yes (or cleanup_force=yes) is mandatory.
lifecycle_cleanup_confirm: "{{ cleanup_confirm | default(false) }}"
# force: also continue when archiving fails and when a package is not installed.
lifecycle_cleanup_force: "{{ cleanup_force | default(false) }}"
# conservative keeps data dirs / honours the keep_* flags; aggressive removes
# config dirs and packages regardless of them.
lifecycle_cleanup_strategy: "{{ cleanup_strategy | default('conservative') }}"
lifecycle_cleanup_keep_data: "{{ cleanup_keep_data | default(true) }}"
lifecycle_cleanup_keep_package: "{{ cleanup_keep_package | default(false) }}"
lifecycle_cleanup_keep_state: false
lifecycle_cleanup_archive_enabled: true
lifecycle_cleanup_remove_unit: true
lifecycle_cleanup_archive_path: "{{ cleanup_archive_path | default('/var/lib/anixops/archive') }}"
lifecycle_cleanup_keep_backups: "{{ cleanup_keep_backups | default(5) }}"

# -----------------------------------------------------------------------------
# Play-level knobs consumed by playbooks/maintenance/lifecycle.yml
# -----------------------------------------------------------------------------
lifecycle_serial: 1
lifecycle_max_fail: 0
lifecycle_max_hosts: 1
