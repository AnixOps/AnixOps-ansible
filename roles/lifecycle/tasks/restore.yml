---
# =============================================================================
# Shared restore routine | 共用恢复流程
# =============================================================================
# Input : lifecycle_restore_dir  snapshot directory written by snapshot.yml
# Output: lifecycle_restore_entries, lifecycle_restore_results,
#         lifecycle_restore_changed, lifecycle_restore_needs_daemon_reload
#
# Every file goes back to the ORIGINAL path recorded in manifest.json with its
# recorded owner/group/mode. Directories without a manifest (written by the
# pre-manifest version of this role) are refused unless
# lifecycle_rollback_allow_legacy=true.

- name: Reset restore entry list | 重置恢复条目列表
  ansible.builtin.set_fact:
    lifecycle_restore_entries: []

- name: Check restore manifest | 检查恢复清单
  ansible.builtin.stat:
    path: "{{ lifecycle_restore_dir }}/manifest.json"
    get_checksum: false
  register: lifecycle_restore_manifest_stat

- name: Read restore manifest | 读取恢复清单
  ansible.builtin.slurp:
    src: "{{ lifecycle_restore_dir }}/manifest.json"
  register: lifecycle_restore_manifest_raw
  when: lifecycle_restore_manifest_stat.stat.exists

- name: Parse restore manifest | 解析恢复清单
  ansible.builtin.set_fact:
    lifecycle_restore_entries: "{{ (lifecycle_restore_manifest_raw.content | b64decode | from_json).files | default([]) }}"
  when: lifecycle_restore_manifest_stat.stat.exists

- name: Refuse a manifest-less backup directory | 拒绝没有清单的备份目录
  ansible.builtin.fail:
    msg: >-
      {{ lifecycle_restore_dir }} has no manifest.json (it was written by a
      pre-manifest version of this role, or is not a snapshot directory). Set
      lifecycle_rollback_allow_legacy=true to restore its files into
      /etc/{{ lifecycle_target_role }}/<basename>, or use
      playbooks/maintenance/rollback.yml for file-level backups.
  when:
    - not lifecycle_restore_manifest_stat.stat.exists
    - not lifecycle_rollback_allow_legacy | bool

- name: List files of a legacy backup directory | 列出旧格式备份目录中的文件
  ansible.builtin.find:
    paths: "{{ lifecycle_restore_dir }}"
    file_type: file
  register: lifecycle_restore_legacy_find
  when: not lifecycle_restore_manifest_stat.stat.exists

- name: Build legacy restore entries | 构建旧格式恢复条目
  ansible.builtin.set_fact:
    lifecycle_restore_entries: >-
      {{ lifecycle_restore_entries + [{
           'stored': item.path | basename,
           'original': '/etc/' ~ lifecycle_target_role ~ '/' ~ (item.path | basename | regex_replace('\\.backup.*$', '')),
           'owner': item.pw_name | default('root'),
           'group': item.gr_name | default('root'),
           'mode': item.mode | default('0644')
         }] }}
  loop: "{{ lifecycle_restore_legacy_find.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: not lifecycle_restore_manifest_stat.stat.exists

- name: Fail when the snapshot holds no files | 快照为空时失败
  ansible.builtin.fail:
    msg: "Snapshot {{ lifecycle_restore_dir }} contains no files to restore."
  when: lifecycle_restore_entries | length == 0

- name: Check parent directories of restore targets | 检查目标父目录
  ansible.builtin.stat:
    path: "{{ item.original | dirname }}"
    get_checksum: false
  loop: "{{ lifecycle_restore_entries }}"
  loop_control:
    label: "{{ item.original | dirname }}"
  register: lifecycle_restore_parent_stat

- name: Create missing parent directories | 创建缺失的父目录
  ansible.builtin.file:
    path: "{{ item.item.original | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ lifecycle_restore_parent_stat.results }}"
  loop_control:
    label: "{{ item.item.original | dirname }}"
  when: not item.stat.exists

- name: Restore files from snapshot | 从快照恢复文件
  ansible.builtin.copy:
    src: "{{ lifecycle_restore_dir }}/{{ item.stored }}"
    dest: "{{ item.original }}"
    remote_src: true
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ lifecycle_restore_entries }}"
  loop_control:
    label: "{{ item.original }}"
  register: lifecycle_restore_results

- name: Summarise restore | 汇总恢复结果
  ansible.builtin.set_fact:
    lifecycle_restore_changed: "{{ lifecycle_restore_results.results | selectattr('changed') | list | length > 0 }}"
    lifecycle_restore_needs_daemon_reload: >-
      {{ lifecycle_restore_entries | map(attribute='original') | select('match', '^/etc/systemd/') | list | length > 0 }}
