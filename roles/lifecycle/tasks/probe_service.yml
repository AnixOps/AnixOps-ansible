---
# =============================================================================
# Shared read-only service probe | 共用的服务状态探测
# =============================================================================
# `systemd_service` needs state/enabled/daemon_reload (required_one_of), so a
# pure status read uses `systemctl show`, which never changes anything and is
# tolerated when systemd or the unit is absent.
# Output: lifecycle_service_probe = {present, load_state, active_state, sub_state, unit_file_state}

- name: Query systemd unit properties | 查询 systemd unit 属性
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ lifecycle_service_name }}"
      - --property=LoadState,ActiveState,SubState,UnitFileState
      - --no-pager
  register: lifecycle_service_probe_raw
  changed_when: false
  failed_when: false
  when: lifecycle_service_name | length > 0

- name: Record service state | 记录服务状态
  ansible.builtin.set_fact:
    lifecycle_service_probe:
      unit: "{{ lifecycle_service_name }}"
      present: "{{ lifecycle_service_probe_parsed.LoadState | default('not-found') == 'loaded' }}"
      load_state: "{{ lifecycle_service_probe_parsed.LoadState | default('not-found') }}"
      active_state: "{{ lifecycle_service_probe_parsed.ActiveState | default('unknown') }}"
      sub_state: "{{ lifecycle_service_probe_parsed.SubState | default('unknown') }}"
      unit_file_state: "{{ lifecycle_service_probe_parsed.UnitFileState | default('unknown') }}"
  vars:
    lifecycle_service_probe_parsed: >-
      {{ dict(lifecycle_service_probe_raw.stdout_lines | default([]) | select('search', '=')
              | map('split', '=', 1) | list) }}
