---
# =============================================================================
# Pre-rollback hook | 回滚前 hook
# =============================================================================
# Records the current version and service state (fact + JSON file, so
# post_rollback can run in a later play) and optionally stops the service.

- name: Set rollback timestamp | 设置回滚时间戳
  ansible.builtin.set_fact:
    lifecycle_rollback_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Check state file | 检查状态文件
  ansible.builtin.stat:
    path: "{{ lifecycle_state_file }}"
    get_checksum: false
  register: lifecycle_state_stat

- name: Read state file | 读取状态文件
  ansible.builtin.slurp:
    src: "{{ lifecycle_state_file }}"
  register: lifecycle_state_raw
  when: lifecycle_state_stat.stat.exists

- name: Parse current state | 解析当前状态
  ansible.builtin.set_fact:
    lifecycle_current_state: >-
      {{ (lifecycle_state_raw.content | b64decode | from_json) if lifecycle_state_stat.stat.exists else {} }}

- name: Probe service state before rollback | 回滚前探测服务状态
  ansible.builtin.include_tasks: probe_service.yml

- name: Record pre-rollback state | 记录回滚前状态
  ansible.builtin.set_fact:
    lifecycle_pre_rollback_state:
      role: "{{ lifecycle_target_role }}"
      host: "{{ inventory_hostname }}"
      version: "{{ lifecycle_current_state.current_version | default('unknown') }}"
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_service_probe.active_state }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"

- name: Write pre-rollback state file | 写入回滚前状态文件
  ansible.builtin.copy:
    content: "{{ lifecycle_pre_rollback_state | to_nice_json }}\n"
    dest: "{{ lifecycle_pre_rollback_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Stop service gracefully before rollback | 回滚前优雅停止服务
  ansible.builtin.systemd_service:
    name: "{{ lifecycle_service_name }}"
    state: stopped
  when:
    - lifecycle_hooks_graceful_stop | bool
    - lifecycle_service_name | length > 0
    - lifecycle_pre_rollback_state.service_state == 'active'

- name: Set lifecycle result | 设置结果
  ansible.builtin.set_fact:
    lifecycle_result: pre_rollback_completed
