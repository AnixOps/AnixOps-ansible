---
# =============================================================================
# Post-deploy hook | 部署后 hook
# =============================================================================
# Snapshots the configuration AFTER the deployment into <version>/post/, verifies
# the service (port, systemd state, health URL), writes state + history, sends
# a notification and - in strict mode - fails when the service is unhealthy.

- name: Resolve deployment version and backup directory | 解析部署版本与备份目录
  ansible.builtin.set_fact:
    lifecycle_deploy_version: "{{ lifecycle_deploy_version | default('v' ~ ansible_date_time.iso8601_basic_short) }}"
    lifecycle_backup_dir: "{{ lifecycle_backup_dir | default(lifecycle_backup_root ~ '/' ~ ansible_date_time.iso8601_basic_short) }}"
    lifecycle_deploy_start_epoch: "{{ lifecycle_deploy_start_epoch | default(ansible_date_time.epoch) }}"
    lifecycle_post_deploy_health_ok: true

- name: Snapshot configuration after deployment | 部署后快照
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    lifecycle_snapshot_dir: "{{ lifecycle_backup_dir }}/post"
    lifecycle_snapshot_phase: post
    lifecycle_snapshot_version: "{{ lifecycle_deploy_version }}"
  when:
    - lifecycle_hooks_backup_enabled | bool
    - lifecycle_backup_files | length > 0

- name: Probe service state after deployment | 部署后探测服务状态
  ansible.builtin.systemd_service:
    name: "{{ lifecycle_service_name }}"
  register: lifecycle_post_deploy_service
  failed_when: false
  when: lifecycle_service_name | length > 0

- name: Verify service health | 验证服务健康
  when: lifecycle_hooks_verify_enabled | bool
  block:
    - name: Wait for the service port | 等待服务端口
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ lifecycle_port | int }}"
        timeout: "{{ lifecycle_hooks_verify_timeout | int }}"
        state: started
      when: lifecycle_port | int > 0

    - name: Query the health endpoint | 请求健康检查地址
      ansible.builtin.uri:
        url: "{{ lifecycle_health_url_effective }}"
        method: GET
        status_code: "{{ lifecycle_hooks_verify_status_codes }}"
        timeout: "{{ lifecycle_hooks_verify_timeout | int }}"
        validate_certs: false
      register: lifecycle_post_deploy_health
      retries: "{{ lifecycle_hooks_verify_retries | int }}"
      delay: "{{ lifecycle_hooks_verify_delay | int }}"
      until: lifecycle_post_deploy_health.status in lifecycle_hooks_verify_status_codes
      when: lifecycle_health_url_effective | length > 0
  rescue:
    - name: Mark health check as failed | 标记健康检查失败
      ansible.builtin.set_fact:
        lifecycle_post_deploy_health_ok: false

- name: Evaluate deployment health | 评估部署健康状态
  ansible.builtin.set_fact:
    lifecycle_post_deploy_healthy: >-
      {{ lifecycle_post_deploy_health_ok | bool
         and (lifecycle_service_name | length == 0
              or (lifecycle_post_deploy_service.status.ActiveState | default('unknown')) == 'active') }}

- name: Check history file | 检查历史文件
  ansible.builtin.stat:
    path: "{{ lifecycle_history_file }}"
    get_checksum: false
  register: lifecycle_history_stat

- name: Read history file | 读取历史文件
  ansible.builtin.slurp:
    src: "{{ lifecycle_history_file }}"
  register: lifecycle_history_raw
  when: lifecycle_history_stat.stat.exists

- name: Parse history | 解析历史
  ansible.builtin.set_fact:
    lifecycle_history_data: "{{ (lifecycle_history_raw.content | b64decode | from_json) if lifecycle_history_stat.stat.exists else [] }}"

- name: Build deployment record | 生成部署记录
  ansible.builtin.set_fact:
    lifecycle_deployment_record:
      version: "{{ lifecycle_deploy_version }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      status: >-
        {{ 'unverified' if not lifecycle_hooks_verify_enabled | bool
           else ('success' if lifecycle_post_deploy_healthy | bool else 'failed') }}
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_post_deploy_service.status.ActiveState | default('unknown') }}"
      health_url: "{{ lifecycle_health_url_effective }}"
      health_status: "{{ lifecycle_post_deploy_health.status | default(0) }}"
      duration_seconds: "{{ ansible_date_time.epoch | int - lifecycle_deploy_start_epoch | int }}"
      backup_location: "{{ lifecycle_backup_dir }}"
      files_backed_up: "{{ lifecycle_snapshot_entries | default([]) | length }}"
      triggered_by: "{{ lookup('env', 'GITHUB_ACTOR') | default(lookup('env', 'USER'), true) | default('unknown', true) }}"

- name: Write state file | 写入状态文件
  ansible.builtin.copy:
    content: "{{ lifecycle_state_data | to_nice_json }}\n"
    dest: "{{ lifecycle_state_file }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    lifecycle_state_data:
      role: "{{ lifecycle_target_role }}"
      host: "{{ inventory_hostname }}"
      current_version: "{{ lifecycle_deployment_record.version }}"
      timestamp: "{{ lifecycle_deployment_record.timestamp }}"
      status: "{{ lifecycle_deployment_record.status }}"
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_deployment_record.service_state }}"
      health_status: "{{ lifecycle_deployment_record.health_status }}"
      backup_location: "{{ lifecycle_backup_dir }}"
      history_file: "{{ lifecycle_history_file }}"
      rollback_available: "{{ lifecycle_deployment_record.files_backed_up | int > 0 }}"

- name: Write history file | 写入历史文件
  ansible.builtin.copy:
    content: "{{ (lifecycle_history_data + [lifecycle_deployment_record]) | to_nice_json }}\n"
    dest: "{{ lifecycle_history_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Send deployment notification | 发送部署通知
  ansible.builtin.include_tasks: notify.yml
  vars:
    lifecycle_notify_event: deploy
    lifecycle_notify_status: "{{ lifecycle_deployment_record.status }}"
    lifecycle_notify_details:
      version: "{{ lifecycle_deployment_record.version }}"
      duration_seconds: "{{ lifecycle_deployment_record.duration_seconds }}"
      service_state: "{{ lifecycle_deployment_record.service_state }}"
      health_status: "{{ lifecycle_deployment_record.health_status }}"

- name: Fail when the deployed service is unhealthy | 服务不健康时失败
  ansible.builtin.fail:
    msg: >-
      {{ lifecycle_target_role }} on {{ inventory_hostname }} is unhealthy after deployment
      (service {{ lifecycle_service_name }}={{ lifecycle_deployment_record.service_state }},
      health={{ lifecycle_deployment_record.health_status }} from
      '{{ lifecycle_health_url_effective }}'). The deployment was recorded as failed.
      Pre-deploy snapshot: {{ lifecycle_backup_dir }}/pre. Roll back with:
      ansible-playbook playbooks/maintenance/lifecycle.yml -e lifecycle_target_role={{ lifecycle_target_role }}
      --tags rollback --limit {{ inventory_hostname }}
  when:
    - lifecycle_hooks_verify_enabled | bool
    - lifecycle_hooks_verify_strict | bool
    - not lifecycle_post_deploy_healthy | bool

- name: Set lifecycle result | 设置结果
  ansible.builtin.set_fact:
    lifecycle_result: post_deploy_completed
