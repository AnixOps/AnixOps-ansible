---
# =============================================================================
# Pre-deploy hook | 部署前 hook
# =============================================================================
# Creates a new version directory <backup_root>/<YYYYMMDDTHHMMSS>/ and snapshots
# the current configuration into its pre/ sub-directory (with manifest.json),
# records the service state and prunes versions older than the retention period.

- name: Set deployment version and backup directory | 设置部署版本与备份目录
  ansible.builtin.set_fact:
    lifecycle_backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    lifecycle_deploy_version: "v{{ ansible_date_time.iso8601_basic_short }}"
    lifecycle_deploy_start_epoch: "{{ ansible_date_time.epoch }}"
    lifecycle_backup_dir: "{{ lifecycle_backup_root }}/{{ ansible_date_time.iso8601_basic_short }}"

- name: Ensure backup root exists | 确保备份根目录存在
  ansible.builtin.file:
    path: "{{ lifecycle_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: lifecycle_hooks_backup_enabled | bool

- name: Snapshot configuration before deployment | 部署前快照
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    lifecycle_snapshot_dir: "{{ lifecycle_backup_dir }}/pre"
    lifecycle_snapshot_phase: pre
    lifecycle_snapshot_version: "{{ lifecycle_deploy_version }}"
  when:
    - lifecycle_hooks_backup_enabled | bool
    - lifecycle_backup_files | length > 0

- name: Note when the role declares no backup files | 角色未声明备份文件时提示
  ansible.builtin.debug:
    msg: >-
      {{ lifecycle_target_role }} declares no {{ lifecycle_target_role }}_backup_files;
      nothing was snapshotted and rollback will not be possible for this deployment.
  when: lifecycle_backup_files | length == 0

- name: Probe service state before deployment | 部署前探测服务状态
  ansible.builtin.include_tasks: probe_service.yml

- name: Keep the pre-deploy service state | 保存部署前服务状态
  ansible.builtin.set_fact:
    lifecycle_pre_deploy_service: "{{ lifecycle_service_probe }}"

- name: List all snapshot versions | 列出全部快照版本
  ansible.builtin.find:
    paths: "{{ lifecycle_backup_root }}"
    file_type: directory
    recurse: false
  register: lifecycle_all_versions
  when:
    - lifecycle_hooks_backup_enabled | bool
    - lifecycle_hooks_backup_retention_days | int > 0

- name: List snapshot versions older than the retention period | 列出超过保留期的快照
  ansible.builtin.find:
    paths: "{{ lifecycle_backup_root }}"
    file_type: directory
    recurse: false
    age: "{{ lifecycle_hooks_backup_retention_days }}d"
  register: lifecycle_old_versions
  when:
    - lifecycle_hooks_backup_enabled | bool
    - lifecycle_hooks_backup_retention_days | int > 0

- name: Prune expired snapshot versions while keeping the newest ones | 清理过期快照
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lifecycle_prunable_versions | select('in', lifecycle_expired_versions) | list }}"
  vars:
    lifecycle_prunable_versions: >-
      {{ (lifecycle_all_versions.files | default([]) | sort(attribute='mtime', reverse=true)
          | map(attribute='path') | list)[lifecycle_hooks_backup_min_keep | int:] }}
    lifecycle_expired_versions: "{{ lifecycle_old_versions.files | default([]) | map(attribute='path') | list }}"
  when:
    - lifecycle_hooks_backup_enabled | bool
    - lifecycle_hooks_backup_retention_days | int > 0

- name: Record pre-deploy state | 记录部署前状态
  ansible.builtin.copy:
    content: "{{ lifecycle_pre_deploy_state | to_nice_json }}\n"
    dest: "{{ lifecycle_pre_deploy_file }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    lifecycle_pre_deploy_state:
      role: "{{ lifecycle_target_role }}"
      host: "{{ inventory_hostname }}"
      version: "{{ lifecycle_deploy_version }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_pre_deploy_service.active_state }}"
      backup_location: "{{ lifecycle_backup_dir }}"
      files_backed_up: "{{ lifecycle_snapshot_entries | default([]) | length }}"

- name: Set lifecycle result | 设置结果
  ansible.builtin.set_fact:
    lifecycle_result: pre_deploy_completed
