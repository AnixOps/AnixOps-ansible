---
# =============================================================================
# Post-rollback hook | 回滚后 hook
# =============================================================================
# Resolves the rollback target from the deployment history, snapshots the
# current files (so the rollback itself is reversible), restores the target
# snapshot to the ORIGINAL paths recorded in its manifest, validates, restarts
# the service, verifies health and records the outcome.
#
# Version semantics (record N = deployment N; its pre/ snapshot holds the config
# from BEFORE deployment N, its post/ snapshot the config right AFTER it):
#   prev        -> post/ of the deployment before the current one
#                  (pre/ of the current one is the equivalent fallback)
#   initial     -> pre/ of the first recorded deployment
#   v<stamp>    -> post/ of that deployment
#   lifecycle_restore_from=<dir> -> that snapshot directory, bypassing history

- name: Check pre-rollback state file | 检查回滚前状态文件
  ansible.builtin.stat:
    path: "{{ lifecycle_pre_rollback_file }}"
    get_checksum: false
  register: lifecycle_pre_rollback_file_stat
  when: lifecycle_pre_rollback_state is not defined

- name: Read pre-rollback state file | 读取回滚前状态文件
  ansible.builtin.slurp:
    src: "{{ lifecycle_pre_rollback_file }}"
  register: lifecycle_pre_rollback_raw
  when:
    - lifecycle_pre_rollback_state is not defined
    - lifecycle_pre_rollback_file_stat.stat.exists

- name: Load pre-rollback state when the pre_rollback hook did not run in this play | 载入回滚前状态
  ansible.builtin.set_fact:
    lifecycle_pre_rollback_state: >-
      {{ (lifecycle_pre_rollback_raw.content | b64decode | from_json)
         if lifecycle_pre_rollback_raw.content is defined
         else {'version': 'unknown', 'service_state': 'unknown'} }}
  when: lifecycle_pre_rollback_state is not defined

- name: Set rollback timestamp | 设置回滚时间戳
  ansible.builtin.set_fact:
    lifecycle_rollback_timestamp: "{{ lifecycle_rollback_timestamp | default(lifecycle_now_stamp) }}"
    lifecycle_rollback_requested: "{{ lifecycle_version | default('prev', true) }}"
    lifecycle_rollback_current: "{{ lifecycle_pre_rollback_state.version | default('unknown') }}"
    lifecycle_rollback_explicit_dir: "{{ lifecycle_restore_from | default('', true) }}"
    lifecycle_post_rollback_health_ok: true

# --- Resolve the target from the history --------------------------------------
- name: Check deployment history | 检查部署历史
  ansible.builtin.stat:
    path: "{{ lifecycle_history_file }}"
    get_checksum: false
  register: lifecycle_history_stat

- name: Fail when there is no deployment history | 无部署历史时失败
  ansible.builtin.fail:
    msg: >-
      No deployment history for {{ lifecycle_target_role }} on {{ inventory_hostname }}
      ({{ lifecycle_history_file }} is missing), so there is nothing the lifecycle role can
      roll back to. Deploy through playbooks/maintenance/lifecycle.yml --tags deploy first, or
      use playbooks/maintenance/rollback.yml to restore file-level backups.
  when:
    - not lifecycle_history_stat.stat.exists
    - lifecycle_rollback_explicit_dir | length == 0

- name: Read history file | 读取历史文件
  ansible.builtin.slurp:
    src: "{{ lifecycle_history_file }}"
  register: lifecycle_history_raw
  when: lifecycle_history_stat.stat.exists

- name: Parse history and collect rollback candidates | 解析历史并收集回滚候选
  ansible.builtin.set_fact:
    lifecycle_history_data: >-
      {{ (lifecycle_history_raw.content | b64decode | from_json) if lifecycle_history_stat.stat.exists else [] }}

- name: Collect successful deployments | 收集成功的部署记录
  ansible.builtin.set_fact:
    lifecycle_rollback_candidates: >-
      {{ lifecycle_history_data | selectattr('status', 'in', ['success', 'unverified']) | list }}

- name: Fail when no successful deployment is recorded | 无成功部署记录时失败
  ansible.builtin.fail:
    msg: >-
      {{ lifecycle_history_file }} holds {{ lifecycle_history_data | length }} record(s) but none
      with status success/unverified; nothing to roll back to for {{ lifecycle_target_role }} on
      {{ inventory_hostname }}.
  when:
    - lifecycle_rollback_candidates | length == 0
    - lifecycle_rollback_explicit_dir | length == 0

- name: Refuse 'prev' when already at the initial configuration | 已处于初始配置时拒绝 prev
  ansible.builtin.fail:
    msg: >-
      {{ lifecycle_target_role }} on {{ inventory_hostname }} is already at the initial
      (pre-first-deployment) configuration; pick an explicit version
      ({{ lifecycle_rollback_candidates | map(attribute='version') | join(', ') }}) to roll forward.
  when:
    - lifecycle_rollback_explicit_dir | length == 0
    - lifecycle_rollback_requested == 'prev'
    - lifecycle_rollback_current == 'initial'

- name: Pick the previous version | 选择上一版本
  ansible.builtin.set_fact:
    lifecycle_rollback_target: >-
      {{ lifecycle_rollback_candidates[lifecycle_rb_index | int - 1]
         if lifecycle_rb_index | int >= 1 else lifecycle_rollback_candidates[0] }}
    lifecycle_rollback_phase: "{{ 'post' if lifecycle_rb_index | int >= 1 else 'pre' }}"
    lifecycle_rollback_alternate: >-
      {{ lifecycle_rollback_candidates[lifecycle_rb_index | int] if lifecycle_rb_index | int >= 1 else {} }}
  vars:
    lifecycle_rb_versions: "{{ lifecycle_rollback_candidates | map(attribute='version') | list }}"
    lifecycle_rb_index: >-
      {{ lifecycle_rb_versions.index(lifecycle_rollback_current)
         if lifecycle_rollback_current in lifecycle_rb_versions
         else (lifecycle_rb_versions | length - 1) }}
  when:
    - lifecycle_rollback_explicit_dir | length == 0
    - lifecycle_rollback_requested == 'prev'

- name: Pick the initial (pre-first-deployment) configuration | 选择初始配置
  ansible.builtin.set_fact:
    lifecycle_rollback_target: "{{ lifecycle_rollback_candidates[0] }}"
    lifecycle_rollback_phase: pre
    lifecycle_rollback_alternate: {}
  when:
    - lifecycle_rollback_explicit_dir | length == 0
    - lifecycle_rollback_requested == 'initial'

- name: Fail when the requested version is unknown | 请求的版本不存在时失败
  ansible.builtin.fail:
    msg: >-
      Version '{{ lifecycle_rollback_requested }}' is not a successful deployment of
      {{ lifecycle_target_role }} on {{ inventory_hostname }}. Available:
      {{ lifecycle_rollback_candidates | map(attribute='version') | join(', ') }} (or prev / initial).
  when:
    - lifecycle_rollback_explicit_dir | length == 0
    - lifecycle_rollback_requested not in ['prev', 'initial']
    - lifecycle_rollback_candidates | selectattr('version', 'eq', lifecycle_rollback_requested) | list | length == 0

- name: Pick the requested version | 选择指定版本
  ansible.builtin.set_fact:
    lifecycle_rollback_target: "{{ lifecycle_rollback_candidates[lifecycle_rb_index | int] }}"
    lifecycle_rollback_phase: post
    lifecycle_rollback_alternate: >-
      {{ lifecycle_rollback_candidates[lifecycle_rb_index | int + 1]
         if lifecycle_rb_index | int + 1 < lifecycle_rollback_candidates | length else {} }}
  vars:
    lifecycle_rb_index: >-
      {{ (lifecycle_rollback_candidates | map(attribute='version') | list).index(lifecycle_rollback_requested) }}
  when:
    - lifecycle_rollback_explicit_dir | length == 0
    - lifecycle_rollback_requested not in ['prev', 'initial']

- name: Resolve snapshot directories to try | 解析候选快照目录
  ansible.builtin.set_fact:
    lifecycle_rollback_target_label: >-
      {{ 'dir:' ~ lifecycle_rollback_explicit_dir if lifecycle_rollback_explicit_dir | length > 0
         else (lifecycle_rollback_target.version if lifecycle_rollback_phase == 'post'
               else 'initial (before ' ~ lifecycle_rollback_target.version ~ ')') }}
    lifecycle_rollback_sources: >-
      {{ [lifecycle_rollback_explicit_dir] if lifecycle_rollback_explicit_dir | length > 0
         else ([lifecycle_rollback_target.backup_location ~ '/' ~ lifecycle_rollback_phase]
               + ([lifecycle_rollback_alternate.backup_location ~ '/pre']
                  if lifecycle_rollback_alternate.backup_location is defined else [])
               + [lifecycle_rollback_target.backup_location]) }}

- name: Check candidate snapshot directories | 检查候选快照目录
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ lifecycle_rollback_sources }}"
  register: lifecycle_rollback_source_stat

- name: Select the snapshot directory | 选择快照目录
  ansible.builtin.set_fact:
    lifecycle_rollback_source_dir: >-
      {{ lifecycle_rollback_source_stat.results | selectattr('stat.exists') | selectattr('stat.isdir')
         | map(attribute='item') | first | default('') }}

- name: Fail when no snapshot directory exists | 快照目录不存在时失败
  ansible.builtin.fail:
    msg: >-
      Cannot roll back {{ lifecycle_target_role }} on {{ inventory_hostname }} to
      {{ lifecycle_rollback_target_label }}: none of {{ lifecycle_rollback_sources | join(', ') }} exists.
  when: lifecycle_rollback_source_dir | length == 0

# --- Determine which files will be overwritten -------------------------------
- name: Check source manifest | 检查来源清单
  ansible.builtin.stat:
    path: "{{ lifecycle_rollback_source_dir }}/manifest.json"
    get_checksum: false
  register: lifecycle_rollback_manifest_stat

- name: Read source manifest | 读取来源清单
  ansible.builtin.slurp:
    src: "{{ lifecycle_rollback_source_dir }}/manifest.json"
  register: lifecycle_rollback_manifest_raw
  when: lifecycle_rollback_manifest_stat.stat.exists

- name: Determine files the rollback will overwrite | 确定回滚将覆盖的文件
  ansible.builtin.set_fact:
    lifecycle_rollback_files: >-
      {{ ((lifecycle_rollback_manifest_raw.content | b64decode | from_json).files | map(attribute='original') | list)
         if lifecycle_rollback_manifest_stat.stat.exists else lifecycle_backup_files }}
    lifecycle_pre_rollback_snapshot_dir: "{{ lifecycle_backup_root }}/{{ lifecycle_rollback_timestamp }}-pre-rollback"
    lifecycle_rollback_restored_version: >-
      {{ (lifecycle_rollback_target.version if lifecycle_rollback_phase == 'post' else 'initial')
         if lifecycle_rollback_explicit_dir | length == 0
         else (((lifecycle_rollback_manifest_raw.content | b64decode | from_json).version | default('', true))
               if lifecycle_rollback_manifest_stat.stat.exists else '')
              | default('dir:' ~ lifecycle_rollback_explicit_dir, true) }}
    lifecycle_snapshot_entries: []

- name: Show rollback plan | 显示回滚计划
  ansible.builtin.debug:
    msg:
      - >-
        Rollback {{ lifecycle_target_role }} on {{ inventory_hostname }}:
        {{ lifecycle_rollback_current }} -> {{ lifecycle_rollback_target_label }}
      - "Source snapshot: {{ lifecycle_rollback_source_dir }}"
      - "Files: {{ lifecycle_rollback_files | join(', ') }}"
      - "Safety snapshot of current files: {{ lifecycle_pre_rollback_snapshot_dir }}"
      - "Service to restart: {{ lifecycle_service_name | default('none', true) }}"

- name: Stop here in dry-run mode | 干运行模式到此为止
  ansible.builtin.meta: end_host
  when: lifecycle_dry_run | bool

- name: Never let the safety snapshot overwrite the restore source | 安全快照不得覆盖恢复来源
  ansible.builtin.fail:
    msg: >-
      Refusing to roll back: the safety snapshot directory {{ lifecycle_pre_rollback_snapshot_dir }}
      is the directory being restored. Wait a second and retry, or restore a different snapshot.
  when: lifecycle_pre_rollback_snapshot_dir == lifecycle_rollback_source_dir

# --- Make the rollback itself reversible --------------------------------------
- name: Snapshot current files before rolling back | 回滚前快照当前文件
  ansible.builtin.include_tasks: snapshot.yml
  vars:
    lifecycle_backup_files: "{{ lifecycle_rollback_files }}"
    lifecycle_snapshot_dir: "{{ lifecycle_pre_rollback_snapshot_dir }}"
    lifecycle_snapshot_phase: pre_rollback
    lifecycle_snapshot_version: "{{ lifecycle_rollback_current }}"
  when: lifecycle_rollback_files | length > 0

- name: Record whether a safety snapshot exists | 记录安全快照是否存在
  ansible.builtin.set_fact:
    lifecycle_pre_rollback_snapshot_taken: "{{ lifecycle_snapshot_entries | default([]) | length > 0 }}"

# --- Restore + validate, reverting on any error -------------------------------
- name: Restore configuration and validate it | 恢复配置并校验
  block:
    - name: Restore files from the selected snapshot | 从所选快照恢复文件
      ansible.builtin.include_tasks: restore.yml
      vars:
        lifecycle_restore_dir: "{{ lifecycle_rollback_source_dir }}"

    - name: Validate restored configuration | 校验恢复后的配置
      ansible.builtin.include_tasks: validate.yml
  rescue:
    - name: Revert to the pre-rollback snapshot | 还原到回滚前快照
      ansible.builtin.include_tasks: restore.yml
      vars:
        lifecycle_restore_dir: "{{ lifecycle_pre_rollback_snapshot_dir }}"
      when: lifecycle_pre_rollback_snapshot_taken | bool

    - name: Fail after reverting | 还原后报错退出
      ansible.builtin.fail:
        msg: >-
          Rollback of {{ lifecycle_target_role }} to {{ lifecycle_rollback_target_label }} on
          {{ inventory_hostname }} failed while restoring or validating
          {{ lifecycle_rollback_source_dir }}. The previous files were put back from
          {{ lifecycle_pre_rollback_snapshot_dir }}; the service was not restarted.

- name: Reload systemd when unit files were restored | 恢复了 unit 文件时重载 systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: lifecycle_restore_needs_daemon_reload | bool

- name: Restart service after rollback | 回滚后重启服务
  ansible.builtin.systemd_service:
    name: "{{ lifecycle_service_name }}"
    state: restarted
    enabled: true
  when:
    - lifecycle_service_name | length > 0
    - lifecycle_restore_changed | bool or lifecycle_pre_rollback_state.service_state | default('unknown') != 'active'

- name: Probe service state after rollback | 回滚后探测服务状态
  ansible.builtin.include_tasks: probe_service.yml

- name: Keep the post-rollback service state | 保存回滚后服务状态
  ansible.builtin.set_fact:
    lifecycle_post_rollback_service: "{{ lifecycle_service_probe }}"

- name: Verify service health after rollback | 验证回滚后服务健康
  when: lifecycle_hooks_verify_enabled | bool
  block:
    - name: Wait for the service port | 等待服务端口
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ lifecycle_port | int }}"
        timeout: "{{ lifecycle_hooks_verify_timeout | int }}"
        state: started
      when: lifecycle_port | int > 0

    - name: Query the health endpoint | 请求健康检查地址
      ansible.builtin.uri:
        url: "{{ lifecycle_health_url_effective }}"
        method: GET
        status_code: "{{ lifecycle_hooks_verify_status_codes }}"
        timeout: "{{ lifecycle_hooks_verify_timeout | int }}"
        validate_certs: false
      register: lifecycle_post_rollback_health
      retries: "{{ lifecycle_hooks_verify_retries | int }}"
      delay: "{{ lifecycle_hooks_verify_delay | int }}"
      until: lifecycle_post_rollback_health.status in lifecycle_hooks_verify_status_codes
      when: lifecycle_health_url_effective | length > 0
  rescue:
    - name: Mark health check as failed | 标记健康检查失败
      ansible.builtin.set_fact:
        lifecycle_post_rollback_health_ok: false

- name: Evaluate rollback health | 评估回滚后健康状态
  ansible.builtin.set_fact:
    lifecycle_post_rollback_healthy: >-
      {{ lifecycle_post_rollback_health_ok | bool
         and (lifecycle_service_name | length == 0
              or lifecycle_post_rollback_service.active_state == 'active') }}

- name: Revert the rollback because the service is unhealthy | 服务不健康，撤销回滚
  when:
    - lifecycle_hooks_verify_enabled | bool
    - not lifecycle_post_rollback_healthy | bool
    - lifecycle_rollback_revert_on_unhealthy | bool
    - lifecycle_pre_rollback_snapshot_taken | bool
  block:
    - name: Put the pre-rollback files back | 放回回滚前的文件
      ansible.builtin.include_tasks: restore.yml
      vars:
        lifecycle_restore_dir: "{{ lifecycle_pre_rollback_snapshot_dir }}"

    - name: Restart service after reverting | 撤销后重启服务
      ansible.builtin.systemd_service:
        name: "{{ lifecycle_service_name }}"
        state: restarted
        daemon_reload: "{{ lifecycle_restore_needs_daemon_reload | bool }}"
      when: lifecycle_service_name | length > 0

# --- Record the outcome --------------------------------------------------------
- name: Build rollback record | 生成回滚记录
  ansible.builtin.set_fact:
    lifecycle_rollback_record:
      version: "{{ lifecycle_rollback_restored_version }}"
      timestamp: "{{ lifecycle_now_iso }}"
      status: >-
        {{ 'rolled_back' if (lifecycle_post_rollback_healthy | bool or not lifecycle_hooks_verify_enabled | bool)
           else 'rollback_failed' }}
      from_version: "{{ lifecycle_rollback_current }}"
      restored_from: "{{ lifecycle_rollback_source_dir }}"
      pre_rollback_snapshot: >-
        {{ lifecycle_pre_rollback_snapshot_dir if lifecycle_pre_rollback_snapshot_taken | bool else '' }}
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_post_rollback_service.active_state }}"
      health_status: "{{ lifecycle_post_rollback_health.status | default(0) }}"
      triggered_by: >-
        {{ lookup('env', 'GITHUB_ACTOR') | default(lookup('env', 'USER'), true) | default('unknown', true) }}

- name: Update state file after rollback | 回滚后更新状态文件
  ansible.builtin.copy:
    content: "{{ lifecycle_state_data | to_nice_json }}\n"
    dest: "{{ lifecycle_state_file }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    lifecycle_state_data:
      role: "{{ lifecycle_target_role }}"
      host: "{{ inventory_hostname }}"
      current_version: "{{ lifecycle_rollback_record.version }}"
      timestamp: "{{ lifecycle_rollback_record.timestamp }}"
      status: "{{ lifecycle_rollback_record.status }}"
      previous_version: "{{ lifecycle_rollback_record.from_version }}"
      restored_from: "{{ lifecycle_rollback_record.restored_from }}"
      pre_rollback_snapshot: "{{ lifecycle_rollback_record.pre_rollback_snapshot }}"
      service: "{{ lifecycle_service_name }}"
      service_state: "{{ lifecycle_rollback_record.service_state }}"
      health_status: "{{ lifecycle_rollback_record.health_status }}"
      history_file: "{{ lifecycle_history_file }}"
      rollback_available: true

- name: Append rollback record to history | 追加回滚记录到历史
  ansible.builtin.copy:
    content: "{{ (lifecycle_history_data | default([]) + [lifecycle_rollback_record]) | to_nice_json }}\n"
    dest: "{{ lifecycle_history_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Send rollback notification | 发送回滚通知
  ansible.builtin.include_tasks: notify.yml
  vars:
    lifecycle_notify_event: rollback
    lifecycle_notify_status: "{{ lifecycle_rollback_record.status }}"
    lifecycle_notify_details:
      from_version: "{{ lifecycle_rollback_record.from_version }}"
      to_version: "{{ lifecycle_rollback_record.version }}"
      restored_from: "{{ lifecycle_rollback_record.restored_from }}"
      service_state: "{{ lifecycle_rollback_record.service_state }}"
      health_status: "{{ lifecycle_rollback_record.health_status }}"

- name: Fail when the service is unhealthy after rollback | 回滚后服务不健康时失败
  ansible.builtin.fail:
    msg: >-
      {{ lifecycle_target_role }} on {{ inventory_hostname }} is unhealthy after rolling back to
      {{ lifecycle_rollback_target_label }} (service {{ lifecycle_service_name }}=
      {{ lifecycle_rollback_record.service_state }}, health={{ lifecycle_rollback_record.health_status }}).
      {% if lifecycle_rollback_revert_on_unhealthy | bool and lifecycle_pre_rollback_snapshot_taken | bool %}
      The pre-rollback files were put back from {{ lifecycle_pre_rollback_snapshot_dir }}.
      {% else %}
      The rolled-back files were kept; the previous files are in {{ lifecycle_pre_rollback_snapshot_dir }}
      (restore them with -e lifecycle_restore_from={{ lifecycle_pre_rollback_snapshot_dir }}).
      {% endif %}
  when:
    - lifecycle_hooks_verify_enabled | bool
    - lifecycle_hooks_verify_strict | bool
    - not lifecycle_post_rollback_healthy | bool

- name: Set lifecycle result | 设置结果
  ansible.builtin.set_fact:
    lifecycle_result: post_rollback_completed
