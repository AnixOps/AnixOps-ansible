---
# =============================================================================
# Cleanup hook | 清理 hook
# =============================================================================
# Stops/disables the service, removes packages, archives (or removes) the
# configuration directories, prunes snapshot versions, removes the unit file
# and the state files. Requires cleanup_confirm=yes (or cleanup_force=yes).
# The unit handled here is lifecycle_cleanup_service_name (<role>_cleanup_service_name,
# default <role>_service_name); '' leaves every unit alone, e.g. a host-wide cron or docker.

- name: Require explicit confirmation | 要求明确确认
  ansible.builtin.fail:
    msg: >-
      Refusing to clean up {{ lifecycle_target_role }} on {{ inventory_hostname }}:
      pass -e cleanup_confirm=yes (or -e cleanup_force=yes) to confirm.
  when: not (lifecycle_cleanup_confirm | bool or lifecycle_cleanup_force | bool)

- name: Refuse to clean up protected roles | 拒绝清理受保护的角色
  ansible.builtin.fail:
    msg: >-
      Cleanup of role '{{ lifecycle_target_role }}' is not allowed: it owns host-critical
      configuration (for common: /etc/ssh host keys, chrony, fail2ban and the base package
      set), so it can only be re-deployed, never cleaned up. Protected roles:
      {{ (['common'] + lifecycle_cleanup_protected_roles) | unique | join(', ') }}.
  when: lifecycle_target_role in (['common'] + lifecycle_cleanup_protected_roles)

- name: Refuse to remove the configuration directories of common | 拒绝删除 common 的配置目录
  ansible.builtin.fail:
    msg: "cleanup_keep_data=false is not allowed for role common (/etc/ssh holds the host keys)."
  when:
    - lifecycle_target_role == 'common'
    - not lifecycle_cleanup_keep_data | bool

- name: Resolve effective cleanup options | 解析有效的清理选项
  ansible.builtin.set_fact:
    lifecycle_cleanup_keep_data_effective: >-
      {{ lifecycle_cleanup_keep_data | bool and lifecycle_cleanup_strategy != 'aggressive' }}
    lifecycle_cleanup_keep_package_effective: >-
      {{ lifecycle_cleanup_keep_package | bool and lifecycle_cleanup_strategy != 'aggressive' }}
    lifecycle_cleanup_timestamp: "{{ lifecycle_now_stamp }}"

- name: Show cleanup plan | 显示清理计划
  ansible.builtin.debug:
    msg:
      - "Cleanup {{ lifecycle_target_role }} on {{ inventory_hostname }} (strategy={{ lifecycle_cleanup_strategy }})"
      - "Service to stop/disable: {{ lifecycle_cleanup_service_name | default('none', true) }}"
      - >-
        Packages to remove: {{ 'none (kept)' if lifecycle_cleanup_keep_package_effective | bool
        else (lifecycle_cleanup_packages | join(', ') | default('none', true)) }}
      - >-
        Config dirs: {{ lifecycle_config_dirs | join(', ') }} ->
        {{ 'archived to ' ~ lifecycle_cleanup_archive_path if lifecycle_cleanup_keep_data_effective | bool
           else 'REMOVED' }}
      - "Snapshot versions kept: {{ lifecycle_cleanup_keep_backups }} newest under {{ lifecycle_backup_root }}"
      - "State files: {{ 'kept' if lifecycle_cleanup_keep_state | bool else 'removed' }}"

- name: Stop here in dry-run mode | 干运行模式到此为止
  ansible.builtin.meta: end_host
  when: lifecycle_dry_run | bool

- name: Probe service unit | 探测服务 unit
  ansible.builtin.include_tasks: probe_service.yml
  vars:
    lifecycle_service_name: "{{ lifecycle_cleanup_service_name }}"

- name: Stop and disable service | 停止并禁用服务
  ansible.builtin.systemd_service:
    name: "{{ lifecycle_cleanup_service_name }}"
    state: stopped
    enabled: false
  when:
    - lifecycle_cleanup_service_name | length > 0
    - lifecycle_service_probe.present | bool

- name: Remove packages | 删除软件包
  ansible.builtin.package:
    name: "{{ lifecycle_cleanup_packages }}"
    state: absent
  register: lifecycle_cleanup_packages
  retries: 3
  delay: 5
  until: lifecycle_cleanup_packages is succeeded
  failed_when: lifecycle_cleanup_packages is failed and not lifecycle_cleanup_force | bool
  when:
    - not lifecycle_cleanup_keep_package_effective | bool
    - lifecycle_cleanup_packages | length > 0

- name: Check configuration directories | 检查配置目录
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ lifecycle_config_dirs }}"
  register: lifecycle_cleanup_dir_stat

- name: Collect existing configuration directories | 收集存在的配置目录
  ansible.builtin.set_fact:
    lifecycle_cleanup_existing_dirs: >-
      {{ lifecycle_cleanup_dir_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}

- name: Ensure archive directory exists | 确保归档目录存在
  ansible.builtin.file:
    path: "{{ lifecycle_cleanup_archive_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - lifecycle_cleanup_archive_enabled | bool
    - lifecycle_cleanup_existing_dirs | length > 0

- name: Archive configuration directories | 归档配置目录
  community.general.archive:
    path: "{{ lifecycle_cleanup_existing_dirs }}"
    dest: "{{ lifecycle_cleanup_archive_path }}/{{ lifecycle_target_role }}_{{ lifecycle_cleanup_timestamp }}.tar.gz"
    format: gz
    owner: root
    group: root
    mode: "0600"
  register: lifecycle_cleanup_archive
  failed_when: lifecycle_cleanup_archive is failed and not lifecycle_cleanup_force | bool
  when:
    - lifecycle_cleanup_archive_enabled | bool
    - lifecycle_cleanup_existing_dirs | length > 0

- name: Remove configuration directories | 删除配置目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lifecycle_cleanup_existing_dirs }}"
  when: not lifecycle_cleanup_keep_data_effective | bool

- name: Check backup root | 检查备份根目录
  ansible.builtin.stat:
    path: "{{ lifecycle_backup_root }}"
    get_checksum: false
  register: lifecycle_backup_root_stat

- name: List snapshot versions | 列出快照版本
  ansible.builtin.find:
    paths: "{{ lifecycle_backup_root }}"
    file_type: directory
    recurse: false
  register: lifecycle_cleanup_versions
  when: lifecycle_backup_root_stat.stat.exists and lifecycle_backup_root_stat.stat.isdir

- name: Remove snapshot versions beyond the keep limit | 删除超出保留数量的快照
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (lifecycle_cleanup_versions.files | default([]) | sort(attribute='mtime', reverse=true)
        | map(attribute='path') | list)[lifecycle_cleanup_keep_backups | int:] }}

- name: Check for a role-owned systemd unit file | 检查角色自带的 systemd unit 文件
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ lifecycle_cleanup_service_name }}.service"
    get_checksum: false
  register: lifecycle_cleanup_unit_stat
  when:
    - lifecycle_cleanup_remove_unit | bool
    - lifecycle_cleanup_service_name | length > 0

- name: Remove systemd unit file | 删除 systemd unit 文件
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ lifecycle_cleanup_service_name }}.service"
    state: absent
  when: lifecycle_cleanup_unit_stat.stat.exists | default(false)

- name: Reload systemd after removing the unit | 删除 unit 后重载 systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: lifecycle_cleanup_unit_stat.stat.exists | default(false)

- name: Remove state files | 删除状态文件
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lifecycle_state_file }}"
    - "{{ lifecycle_history_file }}"
    - "{{ lifecycle_pre_deploy_file }}"
    - "{{ lifecycle_pre_rollback_file }}"
  when: not lifecycle_cleanup_keep_state | bool

- name: Send cleanup notification | 发送清理通知
  ansible.builtin.include_tasks: notify.yml
  vars:
    lifecycle_notify_event: cleanup
    lifecycle_notify_status: success
    lifecycle_notify_details:
      strategy: "{{ lifecycle_cleanup_strategy }}"
      archive: "{{ lifecycle_cleanup_archive.dest | default('') }}"
      config_dirs_removed: "{{ not lifecycle_cleanup_keep_data_effective | bool }}"

- name: Show cleanup summary | 显示清理摘要
  ansible.builtin.debug:
    msg:
      - "Cleanup completed: {{ lifecycle_target_role }} on {{ inventory_hostname }}"
      - >-
        Service: {{ 'none (left untouched)' if lifecycle_cleanup_service_name | length == 0
        else ('stopped and disabled' if lifecycle_service_probe.present | bool else 'not installed') }}
      - "Archive: {{ lifecycle_cleanup_archive.dest | default('none') }}"
      - "Config dirs removed: {{ not lifecycle_cleanup_keep_data_effective | bool }}"
      - >-
        Snapshot versions kept:
        {{ [lifecycle_cleanup_versions.files | default([]) | length, lifecycle_cleanup_keep_backups | int] | min }}

- name: Set lifecycle result | 设置结果
  ansible.builtin.set_fact:
    lifecycle_result: cleanup_completed
