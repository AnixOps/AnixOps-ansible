---
# =============================================================================
# Shared snapshot routine | 共用快照流程
# =============================================================================
# Input : lifecycle_snapshot_dir     absolute directory to write into
#         lifecycle_snapshot_phase   pre | post | pre_rollback (recorded in manifest)
#         lifecycle_snapshot_version version label recorded in the manifest
# Output: lifecycle_snapshot_manifest (dict) and <dir>/manifest.json
#
# Files are stored as <NN>-<basename> so two files sharing a basename never
# collide. manifest.json maps every stored file back to its ORIGINAL absolute
# path, owner, group and mode - restore.yml relies on it, never on guessing
# "/etc/<role>/<basename>".

- name: Create snapshot directory | 创建快照目录
  ansible.builtin.file:
    path: "{{ lifecycle_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ lifecycle_hooks_backup_dir_mode }}"

- name: Check which contract files exist | 检查约定文件是否存在
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ lifecycle_backup_files }}"
  register: lifecycle_snapshot_stat

- name: Copy existing files into the snapshot | 复制文件到快照目录
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "{{ lifecycle_snapshot_dir }}/{{ '%02d' | format(lifecycle_idx) }}-{{ item.item | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop: "{{ lifecycle_snapshot_stat.results }}"
  loop_control:
    index_var: lifecycle_idx
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isreg

- name: Reset snapshot entry list | 重置快照条目列表
  ansible.builtin.set_fact:
    lifecycle_snapshot_entries: []

- name: Record snapshot entries | 记录快照条目
  ansible.builtin.set_fact:
    lifecycle_snapshot_entries: >-
      {{ lifecycle_snapshot_entries + [{
           'stored': ('%02d' | format(lifecycle_idx)) ~ '-' ~ (item.item | basename),
           'original': item.item,
           'owner': item.stat.pw_name | default('root'),
           'group': item.stat.gr_name | default('root'),
           'mode': item.stat.mode | default('0644')
         }] }}
  loop: "{{ lifecycle_snapshot_stat.results }}"
  loop_control:
    index_var: lifecycle_idx
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isreg

- name: Build snapshot manifest | 生成快照清单
  ansible.builtin.set_fact:
    lifecycle_snapshot_manifest:
      role: "{{ lifecycle_target_role }}"
      host: "{{ inventory_hostname }}"
      phase: "{{ lifecycle_snapshot_phase }}"
      version: "{{ lifecycle_snapshot_version | default('') }}"
      timestamp: "{{ lifecycle_now_iso }}"
      files: "{{ lifecycle_snapshot_entries }}"

- name: Write snapshot manifest | 写入快照清单
  ansible.builtin.copy:
    content: "{{ lifecycle_snapshot_manifest | to_nice_json }}\n"
    dest: "{{ lifecycle_snapshot_dir }}/manifest.json"
    owner: root
    group: root
    mode: "0600"
