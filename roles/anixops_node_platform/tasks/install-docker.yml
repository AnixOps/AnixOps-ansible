---
# Install Docker Engine and the Compose plugin from the official apt repository.
# 从官方 apt 仓库安装 Docker Engine 与 Compose 插件（deb822 源 + 独立 GPG 密钥）。

- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in ["Debian", "Ubuntu"]
    fail_msg: >-
      anixops_node_platform supports Debian and Ubuntu hosts only
      (detected {{ ansible_distribution | default('unknown') }} {{ ansible_distribution_release | default('') }}).

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: "{{ anixops_node_platform_docker_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: anixops_node_platform_apt_prerequisites
  retries: 3
  delay: 10
  until: anixops_node_platform_apt_prerequisites is succeeded

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ anixops_node_platform_docker_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ anixops_node_platform_docker_apt_key_url }}"
    dest: "{{ anixops_node_platform_docker_apt_key_path }}"
    checksum: "{{ anixops_node_platform_docker_apt_key_checksum | default('', true) | string | trim or omit }}"
    owner: root
    group: root
    mode: "0644"
  register: anixops_node_platform_docker_apt_key
  retries: 3
  delay: 10
  until: anixops_node_platform_docker_apt_key is succeeded

- name: Remove the legacy one-line Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: anixops_node_platform_docker_legacy_source

- name: Configure the Docker apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ anixops_node_platform_docker_apt_repo_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ anixops_node_platform_docker_apt_arch }}"
    signed_by: "{{ anixops_node_platform_docker_apt_key_path }}"
    state: present
    mode: "0644"
  register: anixops_node_platform_docker_apt_repo

- name: Refresh the apt cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  register: anixops_node_platform_apt_refresh
  retries: 3
  delay: 10
  until: anixops_node_platform_apt_refresh is succeeded
  when: >-
    anixops_node_platform_docker_apt_repo is changed
    or anixops_node_platform_docker_apt_key is changed
    or anixops_node_platform_docker_legacy_source is changed

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ anixops_node_platform_docker_packages }}"
    state: present
  register: anixops_node_platform_apt_docker
  retries: 3
  delay: 10
  until: anixops_node_platform_apt_docker is succeeded

- name: Ensure the Docker daemon is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ anixops_node_platform_service_name }}"
    state: started
    enabled: true

- name: Confirm the Docker CLI is available
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: anixops_node_platform_docker_version
  changed_when: false

- name: Confirm the Docker Compose plugin is available
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
      - --short
  register: anixops_node_platform_compose_version
  changed_when: false

- name: Show Docker toolchain versions
  ansible.builtin.debug:
    msg: >-
      {{ anixops_node_platform_docker_version.stdout | default('docker ?') }} /
      compose {{ anixops_node_platform_compose_version.stdout | default('?') }}
