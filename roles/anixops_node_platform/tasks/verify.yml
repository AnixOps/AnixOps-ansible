---
# Post-deployment verification. Failures bubble up to the rescue block in
# main.yml, which prints `docker compose ps` and the last 100 log lines.
# 部署后验证；失败时由 main.yml 的 rescue 输出诊断信息。

- name: Wait for the web container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_web_container_name }}"
  register: anixops_node_platform_web_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_web_health.stdout | default('') | trim == "healthy"

- name: Wait for the API container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_api_container_name }}"
  register: anixops_node_platform_api_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_api_health.stdout | default('') | trim == "healthy"

- name: Wait for the PostgreSQL container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_postgres_container_name }}"
  register: anixops_node_platform_postgres_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_postgres_health.stdout | default('') | trim == "healthy"

- name: Wait for the Redis container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_redis_container_name }}"
  register: anixops_node_platform_redis_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_redis_health.stdout | default('') | trim == "healthy"

- name: Wait for the provision container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_provision_container_name }}"
  register: anixops_node_platform_provision_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_provision_health.stdout | default('') | trim == "healthy"

- name: Wait for the scheduler container to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ anixops_node_platform_scheduler_container_name }}"
  register: anixops_node_platform_scheduler_health
  changed_when: false
  retries: "{{ anixops_node_platform_healthcheck_retries | int }}"
  delay: "{{ anixops_node_platform_healthcheck_delay | int }}"
  until: anixops_node_platform_scheduler_health.stdout | default('') | trim == "healthy"

- name: Verify the web port responds locally
  ansible.builtin.uri:
    url: "http://{{ anixops_node_platform_frontend_bind_address }}:{{ anixops_node_platform_frontend_port }}/"
    status_code: 200
  register: anixops_node_platform_web_uri
  retries: 10
  delay: 5
  until: anixops_node_platform_web_uri is succeeded

- name: Verify the API health endpoint responds locally
  ansible.builtin.uri:
    url: "http://{{ anixops_node_platform_api_bind_address }}:{{ anixops_node_platform_api_port }}/health"
    status_code: 200
  register: anixops_node_platform_api_uri
  retries: 10
  delay: 5
  until: anixops_node_platform_api_uri is succeeded

- name: Show node platform verification summary
  ansible.builtin.debug:
    msg: >-
      web={{ anixops_node_platform_web_health.stdout | default('?') | trim }}
      api={{ anixops_node_platform_api_health.stdout | default('?') | trim }}
      postgres={{ anixops_node_platform_postgres_health.stdout | default('?') | trim }}
      redis={{ anixops_node_platform_redis_health.stdout | default('?') | trim }}
      provision={{ anixops_node_platform_provision_health.stdout | default('?') | trim }}
      scheduler={{ anixops_node_platform_scheduler_health.stdout | default('?') | trim }}
      frontend_http={{ anixops_node_platform_web_uri.status | default('?') }}
      api_http={{ anixops_node_platform_api_uri.status | default('?') }}
