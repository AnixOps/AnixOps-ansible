---
# TLS material for the HTTPS vhost: operator-provided PEM (base64 from Actions
# secrets) or a self-signed fallback so Nginx can route by server_name.
# HTTPS 证书：优先使用密钥提供的 PEM，否则生成自签名回退证书。
# Nginx runs on the host and reads the files only on start/reload, so every task
# that changes them notifies `Reload nginx` (handler of the nginx role, flushed
# after `nginx -t` in the same play).

- name: Ensure OpenSSL is installed for node platform TLS
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: anixops_node_platform_apt_openssl
  retries: 3
  delay: 10
  until: anixops_node_platform_apt_openssl is succeeded
  when: ansible_os_family == "Debian"

- name: Validate that certificate and key secrets are provided together
  ansible.builtin.assert:
    that:
      - >-
        (anixops_node_platform_ssl_certificate_pem | default('', true) | string | length > 0)
        == (anixops_node_platform_ssl_certificate_key_pem | default('', true) | string | length > 0)
    fail_msg: >-
      ANIXOPS_NODE_PLATFORM_SSL_CERTIFICATE_PEM and ANIXOPS_NODE_PLATFORM_SSL_CERTIFICATE_KEY_PEM
      must be set together (both base64-encoded PEM) or both left empty.
    quiet: true

- name: Ensure node platform TLS directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ anixops_node_platform_ssl_cert | dirname }}"
    - "{{ anixops_node_platform_ssl_key | dirname }}"

- name: Install node platform TLS certificate from Actions secret when provided
  ansible.builtin.copy:
    content: "{{ anixops_node_platform_ssl_certificate_pem | b64decode }}"
    dest: "{{ anixops_node_platform_ssl_cert }}"
    owner: root
    group: root
    mode: "0644"
    validate: "openssl x509 -noout -in %s"
  when:
    - anixops_node_platform_ssl_certificate_pem | default('', true) | string | length > 0
    - anixops_node_platform_ssl_certificate_key_pem | default('', true) | string | length > 0
  no_log: true
  notify: Reload nginx

- name: Install node platform TLS key from Actions secret when provided
  ansible.builtin.copy:
    content: "{{ anixops_node_platform_ssl_certificate_key_pem | b64decode }}"
    dest: "{{ anixops_node_platform_ssl_key }}"
    owner: root
    group: root
    mode: "0600"
    validate: "openssl pkey -noout -in %s"
  when:
    - anixops_node_platform_ssl_certificate_pem | default('', true) | string | length > 0
    - anixops_node_platform_ssl_certificate_key_pem | default('', true) | string | length > 0
  no_log: true
  notify: Reload nginx

- name: Check node platform TLS certificate
  ansible.builtin.stat:
    path: "{{ anixops_node_platform_ssl_cert }}"
  register: anixops_node_platform_ssl_cert_stat

- name: Check node platform TLS key
  ansible.builtin.stat:
    path: "{{ anixops_node_platform_ssl_key }}"
  register: anixops_node_platform_ssl_key_stat

- name: Refuse to continue with an orphaned certificate or key
  ansible.builtin.fail:
    msg: >-
      Exactly one of {{ anixops_node_platform_ssl_cert }} / {{ anixops_node_platform_ssl_key }} exists.
      Provide both PEM secrets or remove the orphaned file so a matching self-signed pair can be created.
  when: anixops_node_platform_ssl_cert_stat.stat.exists != anixops_node_platform_ssl_key_stat.stat.exists

- name: Refuse to continue without a certificate when the self-signed fallback is disabled
  ansible.builtin.fail:
    msg: >-
      SSL is enabled but {{ anixops_node_platform_ssl_cert }} does not exist and
      anixops_node_platform_ssl_self_signed_fallback is false. Provide
      ANIXOPS_NODE_PLATFORM_SSL_CERTIFICATE_PEM / _KEY_PEM, place the files at the
      configured paths, set ANIXOPS_NODE_PLATFORM_SSL_SELF_SIGNED_FALLBACK=true or
      set ANIXOPS_NODE_PLATFORM_SSL_ENABLED=false.
  when:
    - not (anixops_node_platform_ssl_self_signed_fallback | default(true) | bool)
    - not anixops_node_platform_ssl_cert_stat.stat.exists

- name: Create self-signed node platform TLS certificate when missing
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -sha256
      - -days
      - "{{ anixops_node_platform_ssl_self_signed_days | int }}"
      - -keyout
      - "{{ anixops_node_platform_ssl_key }}"
      - -out
      - "{{ anixops_node_platform_ssl_cert }}"
      - -subj
      - "/CN={{ anixops_node_platform_server_name }}"
      - -addext
      - "subjectAltName=DNS:{{ anixops_node_platform_server_name }}"
    creates: "{{ anixops_node_platform_ssl_key }}"
  when:
    - anixops_node_platform_ssl_self_signed_fallback | default(true) | bool
    - not anixops_node_platform_ssl_cert_stat.stat.exists
  notify: Reload nginx

- name: Restrict node platform TLS key permissions
  ansible.builtin.file:
    path: "{{ anixops_node_platform_ssl_key }}"
    owner: root
    group: root
    mode: "0600"
