---
# =============================================================================
# promtail role - default variables | promtail 角色默认变量
# =============================================================================
# Override any value in inventory group_vars/host_vars or with `-e`.
# The role reads only the prefixed variables below (plus the legacy public
# knobs `loki_server_url` and `promtail_app_log_dir`); `promtail_port` falls
# back to `loki.promtail.port` from group_vars/all, the same value the
# prometheus role scrapes. The other keys of that dict are informational.
# =============================================================================

# --- Release / download ------------------------------------------------------
promtail_version: "2.9.3"
promtail_download_url: "https://github.com/grafana/loki/releases/download"
# Optional integrity check of the release archive, e.g. "sha256:<hex>".
# An empty string disables verification.
promtail_checksum: ""
# Architecture suffix of the release archive (amd64 / arm64). `_target_arch`
# from group_vars/all wins when defined.
promtail_arch: "{{ _target_arch | default('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}"
promtail_archive: "promtail-linux-{{ promtail_arch }}.zip"
promtail_archive_url: "{{ promtail_download_url }}/v{{ promtail_version }}/{{ promtail_archive }}"

# --- Installation ------------------------------------------------------------
promtail_install_path: /usr/local/bin/promtail
promtail_user: promtail
promtail_group: promtail
# Supplementary groups that grant read access to log files. The group
# `systemd-journal` is appended automatically when it exists on the host.
promtail_log_groups:
  - adm
promtail_config_dir: /etc/promtail
promtail_config_path: "{{ promtail_config_dir }}/config.yml"
promtail_positions_dir: /var/lib/promtail
promtail_positions_file: "{{ promtail_positions_dir }}/positions.yaml"
promtail_unit_path: "/etc/systemd/system/{{ promtail_service_name }}.service"
# Validate the rendered config with `promtail -config.file=<tmp> -check-syntax`
# before it replaces the live file. Skipped automatically when the installed
# binary does not advertise the flag in `promtail -help`.
promtail_config_validate: true

# --- Runtime -----------------------------------------------------------------
promtail_port: "{{ ((loki | default({})).promtail | default({})).port | default(9080) }}"
# Bind address of the HTTP server (/ready, /metrics, /targets). Empty or
# 0.0.0.0 binds all interfaces.
promtail_listen_address: "0.0.0.0"
promtail_log_level: info
# Extra command line flags appended to ExecStart, e.g. ["-config.expand-env=true"].
promtail_extra_args: []
# Set to false when log files live under /home (ProtectHome= hides it).
promtail_unit_protect_home: true

# --- Loki client -------------------------------------------------------------
# Resolution order: `loki_server_url` (legacy knob) -> env LOKI_URL -> localhost.
promtail_loki_url: "{{ loki_server_url | default(lookup('env', 'LOKI_URL') | default('http://localhost:3100', true)) }}"
# Multi-tenant Loki: X-Scope-OrgID header. Empty disables.
promtail_loki_tenant_id: ""
# HTTP basic auth towards Loki (e.g. nginx in front of Loki). Empty disables.
promtail_loki_basic_auth_username: ""
promtail_loki_basic_auth_password: ""
# Batching and back-off: keeps shipping resilient while Loki is unreachable.
promtail_client_batchwait: 1s
promtail_client_batchsize: 1048576
promtail_client_timeout: 10s
promtail_client_backoff_min_period: 500ms
promtail_client_backoff_max_period: 5m
promtail_client_backoff_max_retries: 10
# Labels attached to every stream. Empty values are dropped at render time.
promtail_external_labels:
  host: "{{ inventory_hostname }}"
  alias: "{{ server_alias | default(inventory_hostname) }}"
  location: "{{ location | default('') }}"
  environment: "{{ server_environment | default('') }}"

# --- Scrape configuration ----------------------------------------------------
# Directory with application logs (*.log) shipped by the `applications` job.
promtail_app_log_dir: /var/log/apps
# File-based jobs. Each item is a raw promtail scrape_config mapping.
promtail_scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          __path__: /var/log/*log
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          __path__: /var/log/auth.log
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog
  - job_name: applications
    static_configs:
      - targets: [localhost]
        labels:
          job: applications
          __path__: "{{ promtail_app_log_dir }}/*.log"
# Additional operator-defined scrape_configs appended after the defaults.
promtail_extra_scrape_configs: []
# systemd journal job. Requires a promtail build with journal support (the
# official release binaries have it) and read access to the journal (group
# adm / systemd-journal, handled by this role). Set to false to disable.
promtail_journal_enabled: true
promtail_journal_max_age: 12h
promtail_journal_scrape_config:
  job_name: journal
  journal:
    max_age: "{{ promtail_journal_max_age }}"
    labels:
      job: journal
  relabel_configs:
    - source_labels: ["__journal__systemd_unit"]
      target_label: unit

# --- Verification ------------------------------------------------------------
promtail_verify_retries: 6
promtail_verify_delay: 5

# --- Lifecycle contract (roles/lifecycle, playbooks/maintenance/rollback.yml) --
promtail_service_name: promtail
promtail_health_host: >-
  {{ '127.0.0.1' if promtail_listen_address in ['', '0.0.0.0', '::', '[::]'] else promtail_listen_address }}
promtail_health_url: "http://{{ promtail_health_host }}:{{ promtail_port }}/ready"
promtail_backup_files:
  - "{{ promtail_config_path }}"
  - "{{ promtail_unit_path }}"
promtail_config_dirs:
  - "{{ promtail_config_dir }}"
  - "{{ promtail_positions_dir }}"
promtail_packages: []
