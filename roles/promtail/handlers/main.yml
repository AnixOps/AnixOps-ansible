---
# =============================================================================
# promtail handlers | promtail 处理器
# =============================================================================
# Handler order matters: `Reload systemd` is defined first so a changed unit
# file is re-read before the service is restarted.
# =============================================================================

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart promtail
  ansible.builtin.systemd_service:
    name: "{{ promtail_service_name }}"
    state: restarted
