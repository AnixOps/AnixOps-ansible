---
# =============================================================================
# promtail role - entry point | promtail 角色入口
# =============================================================================
# install.yml   -> download / upgrade the binary (only when the version differs)
# configure.yml -> system user, directories, validated config, hardened unit
# service.yml   -> flush handlers, then enable + start the service
# verify.yml    -> /ready health check; on failure dump the journal, restore
#                  the previous config/unit backups and fail loudly
# =============================================================================

- name: Install promtail binary
  ansible.builtin.import_tasks: install.yml
  tags: [promtail, promtail_install]

- name: Configure promtail user, configuration and systemd unit
  ansible.builtin.import_tasks: configure.yml
  tags: [promtail, promtail_configure]

- name: Enable and start promtail
  ansible.builtin.import_tasks: service.yml
  tags: [promtail, promtail_service]

- name: Verify promtail health
  ansible.builtin.import_tasks: verify.yml
  tags: [promtail, promtail_verify]
