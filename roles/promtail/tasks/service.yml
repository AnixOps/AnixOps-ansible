---
# =============================================================================
# promtail - service | 启动服务
# =============================================================================
# Handlers are flushed first so systemd has re-read the unit (and restarted a
# running instance on binary/config/unit change) before we enable and start it.
# =============================================================================

- name: Apply pending promtail handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start the promtail service
  ansible.builtin.systemd_service:
    name: "{{ promtail_service_name }}"
    enabled: true
    state: started
