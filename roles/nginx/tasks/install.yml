---
# Package installation | 安装软件包

- name: Install Nginx packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: "{{ nginx_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  register: nginx_apt_result
  retries: 3
  delay: 10
  until: nginx_apt_result is succeeded
  when: ansible_os_family == "Debian"

- name: Install Nginx packages (RedHat)
  ansible.builtin.package:
    name: "{{ nginx_packages }}"
    state: "{{ nginx_package_state }}"
  register: nginx_package_result
  retries: 3
  delay: 10
  until: nginx_package_result is succeeded
  when: ansible_os_family == "RedHat"
