---
# Service start with diagnostics | 启动服务，失败时收集诊断信息

- name: Ensure Nginx is running and enabled at boot
  block:
    - name: Start and enable Nginx
      ansible.builtin.service:
        name: "{{ nginx_service_name }}"
        state: started
        enabled: true

  rescue:
    - name: Capture the Nginx unit status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "{{ nginx_service_name }}"
          - --no-pager
          - --full
      register: nginx_unit_status
      changed_when: false
      failed_when: false

    - name: Capture the last Nginx journal entries
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ nginx_service_name }}"
          - --no-pager
          - -n
          - "80"
      register: nginx_journal_tail
      changed_when: false
      failed_when: false

    - name: List processes listening on the web ports
      ansible.builtin.command:
        argv:
          - ss
          - -Hltnp
          - "( {{ nginx_diagnostic_ports | map('regex_replace', '^', 'sport = :') | join(' or ') }} )"
      register: nginx_port_listeners
      changed_when: false
      failed_when: false

    - name: Show Nginx start-up diagnostics
      ansible.builtin.debug:
        msg: |
          Nginx failed to start on {{ inventory_hostname }}.

          systemctl status {{ nginx_service_name }}:
          {{ nginx_unit_status.stdout | default('') }}

          journalctl -u {{ nginx_service_name }} -n 80:
          {{ nginx_journal_tail.stdout | default('') }}

          Listeners on ports {{ nginx_diagnostic_ports | join('/') }} (ss -Hltnp):
          {{ nginx_port_listeners.stdout | default('') | trim | default('none', true) }}

    - name: Fail because Nginx could not be started
      ansible.builtin.fail:
        msg: >-
          Nginx could not be started on {{ inventory_hostname }}:
          {{ ansible_failed_result.msg | default('see the diagnostics above') }}.
          If another service holds the web ports, either free the port manually or set
          nginx_stop_conflicting_services: true (stops apache2/httpd/caddy/traefik via systemd).
