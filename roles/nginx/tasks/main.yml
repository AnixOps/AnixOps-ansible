---
# Nginx role - Web 服务器
# 安装和配置 Nginx

- name: Fix broken apt sources (Debian/Ubuntu)
  shell: |
    # Remove conflicting Grafana apt sources
    rm -f /etc/apt/sources.list.d/grafana.list /etc/apt/sources.list.d/grafana.list.save
    # Clean any broken sources
    find /etc/apt/sources.list.d -name '*.list' -exec grep -l 'apt.grafana.com' {} \; 2>/dev/null | while read f; do
      if ! grep -q '\[signed-by=' "$f" 2>/dev/null; then
        rm -f "$f"
      fi
    done
    apt-get update 2>/dev/null || true
  ignore_errors: yes
  when: ansible_os_family == "Debian"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install Nginx
  apt:
    name: nginx
    state: present
  when: ansible_os_family == "Debian"

- name: Install Nginx (RedHat)
  package:
    name: nginx
    state: present
  when: ansible_os_family == "RedHat"

- name: Stop services that may already bind ports 80/443
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: "{{ nginx_conflicting_services }}"
  ignore_errors: yes
  when: nginx_stop_conflicting_services | default(true) | bool

- name: Inspect processes listening on ports 80 and 443
  ansible.builtin.shell: |
    ss -H -ltnp '( sport = :80 or sport = :443 )' | awk '{
      if (match($0, /pid=([0-9]+)/, m)) {
        print m[1]
      }
    }' | sort -u
  args:
    executable: /bin/bash
  register: nginx_port_pids
  changed_when: false
  failed_when: false
  when: nginx_stop_conflicting_services | default(true) | bool

- name: Stop listeners bound to ports 80 and 443
  ansible.builtin.shell: |
    set -euo pipefail

    for pid in {{ nginx_port_pids.stdout_lines | default([]) | join(' ') }}; do
      if [ -r "/proc/$pid/cmdline" ]; then
        cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline")"
        case "$cmdline" in
          *nginx*)
            continue
            ;;
          *)
            kill "$pid" || true
            ;;
        esac
      fi
    done
  args:
    executable: /bin/bash
  register: nginx_port_stop_result
  changed_when: nginx_port_stop_result.rc == 0 and (nginx_port_pids.stdout_lines | default([]) | length > 0)
  failed_when: false
  when:
    - nginx_stop_conflicting_services | default(true) | bool
    - nginx_port_pids.stdout_lines | default([]) | length > 0

- name: Wait briefly for web ports to clear
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 10
  loop:
    - 80
    - 443
  when: nginx_stop_conflicting_services | default(true) | bool

- name: Validate Nginx configuration before starting service
  ansible.builtin.command: nginx -t
  register: nginx_config_test
  changed_when: false
  failed_when: nginx_config_test.rc != 0

- name: Show Nginx configuration test output
  ansible.builtin.debug:
    msg: |
      nginx -t stdout:
      {{ nginx_config_test.stdout | default('') }}

      nginx -t stderr:
      {{ nginx_config_test.stderr | default('') }}
  when: nginx_config_test.rc != 0

- name: Create Nginx configuration directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/conf.d
    - /var/log/nginx

- name: Deploy main Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
    backup: yes
  notify: reload nginx

- name: Create proxy_params
  copy:
    content: |
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout {{ nginx_proxy_timeout }};
      proxy_send_timeout {{ nginx_proxy_timeout }};
      proxy_read_timeout {{ nginx_proxy_timeout }};
      send_timeout {{ nginx_proxy_timeout }};
    dest: /etc/nginx/proxy_params
    mode: '0644'

- name: Deploy custom configuration snippets
  copy:
    content: "{{ item.content }}"
    dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
    mode: '0644'
  loop: "{{ nginx_custom_configs }}"
  notify: reload nginx

- name: Deploy default virtual host
  template:
    src: default-site.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: '0644'
    backup: yes
  when: nginx_default_site_enabled | default(true) | bool
  notify: reload nginx

- name: Enable default site
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  when: nginx_default_site_enabled | default(true) | bool
  notify: reload nginx

- name: Disable default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: not (nginx_default_site_enabled | default(true) | bool)
  notify: reload nginx

- name: Deploy dynamic virtual hosts
  template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    mode: '0644'
    backup: yes
  loop: "{{ nginx_sites + nginx_group_sites + nginx_host_sites }}"
  when: (nginx_sites + nginx_group_sites + nginx_host_sites) | length > 0 and (item.enabled | default(true) | bool)
  notify: reload nginx

- name: Enable dynamic virtual hosts
  file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: link
  loop: "{{ nginx_sites + nginx_group_sites + nginx_host_sites }}"
  when: (nginx_sites + nginx_group_sites + nginx_host_sites) | length > 0 and (item.enabled | default(true) | bool)
  notify: reload nginx

- name: Disable unwanted virtual hosts
  file:
    path: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: absent
  loop: "{{ nginx_sites + nginx_group_sites + nginx_host_sites }}"
  when: (nginx_sites + nginx_group_sites + nginx_host_sites) | length > 0 and not (item.enabled | default(true) | bool)
  notify: reload nginx

- name: Check for host-specific raw config files
  local_action: stat path="{{ role_path }}/templates/hosts/{{ inventory_hostname }}.conf.j2"
  register: host_specific_config
  become: no

- name: Deploy host-specific raw config
  template:
    src: "hosts/{{ inventory_hostname }}.conf.j2"
    dest: "/etc/nginx/sites-available/{{ inventory_hostname }}_custom.conf"
    mode: '0644'
  when: host_specific_config.stat.exists
  notify: reload nginx

- name: Enable host-specific raw config
  file:
    src: "/etc/nginx/sites-available/{{ inventory_hostname }}_custom.conf"
    dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}_custom.conf"
    state: link
  when: host_specific_config.stat.exists
  notify: reload nginx

- name: Remove default Nginx welcome page (if exists)
  file:
    path: /var/www/html/index.nginx-debian.html
    state: absent

- name: Create web root directory
  file:
    path: /var/www/html
    state: directory
    mode: '0755'
    owner: www-data
    group: www-data

- name: Deploy custom index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
    owner: www-data
    group: www-data

- name: Ensure Nginx is enabled and running
  block:
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
  rescue:
    - name: Capture Nginx service status
      ansible.builtin.shell: systemctl status nginx --no-pager -l || true
      args:
        executable: /bin/bash
      register: nginx_service_status
      changed_when: false
      failed_when: false

    - name: Capture Nginx journal output
      ansible.builtin.shell: journalctl -xeu nginx --no-pager | tail -n 80 || true
      args:
        executable: /bin/bash
      register: nginx_journal
      changed_when: false
      failed_when: false

    - name: Show Nginx startup diagnostics
      ansible.builtin.debug:
        msg: |
          nginx service status:
          {{ nginx_service_status.stdout | default('') }}

          nginx journal tail:
          {{ nginx_journal.stdout | default('') }}

- name: Verify Nginx is responding
  uri:
    url: "http://localhost"
    status_code: 200
  register: nginx_health
  retries: 3
  delay: 5
  until: nginx_health.status == 200
