---
# Conflicting services | 处理占用 80/443 端口的其它服务
# Included only when nginx_stop_conflicting_services is true. Nginx itself is
# never touched and no process is ever signalled: the listed services are stopped
# and disabled through systemd, and only when service_facts shows the unit exists.

- name: Gather service facts to detect services that conflict with Nginx
  ansible.builtin.service_facts:

- name: Stop and disable services that conflict with Nginx on the web ports
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ nginx_conflicting_services | reject('equalto', nginx_service_name) | list }}"
  vars:
    nginx_conflict_unit: >-
      {{ ansible_facts.services[item ~ '.service'] | default(ansible_facts.services[item] | default({})) }}
  when:
    - nginx_conflict_unit | length > 0
    - nginx_conflict_unit.status | default('') != 'not-found'
