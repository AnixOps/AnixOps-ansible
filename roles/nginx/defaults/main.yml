---
# =============================================================================
# Nginx role defaults | Nginx 角色默认变量
# =============================================================================
# Every variable is prefixed with nginx_. The legacy `nginx:` dictionary
# (worker_processes, worker_connections, keepalive_timeout, client_max_body_size,
# log_format, extra_http_configs) that lives in inventory group_vars is still
# honoured: the prefixed tuning variables below fall back to it.
# 所有变量均以 nginx_ 为前缀；清单中旧的 `nginx:` 字典仍作为回退值被读取。
# =============================================================================

# -----------------------------------------------------------------------------
# Packages and service | 软件包与服务
# -----------------------------------------------------------------------------
nginx_packages:
  - nginx
nginx_package_state: present
nginx_service_name: nginx
# User/group the worker processes run as (www-data on Debian/Ubuntu, nginx on RedHat).
nginx_user: "{{ 'nginx' if ansible_os_family | default('Debian') == 'RedHat' else 'www-data' }}"
nginx_group: "{{ nginx_user }}"
# Group owning rotated log files (Debian uses adm).
nginx_log_group: "{{ 'root' if ansible_os_family | default('Debian') == 'RedHat' else 'adm' }}"
nginx_pid_file: /run/nginx.pid
nginx_log_dir: /var/log/nginx
# Dynamic module include. RedHat has no modules-enabled directory, so the
# distribution's module glob is used there. An empty string disables the include.
nginx_modules_include: >-
  {{ '/usr/share/nginx/modules/*.conf' if ansible_os_family | default('Debian') == 'RedHat'
     else '/etc/nginx/modules-enabled/*.conf' }}

# -----------------------------------------------------------------------------
# Lifecycle contract | 生命周期约定 (consumed by roles/lifecycle and rollback.yml)
# -----------------------------------------------------------------------------
nginx_port: 80
# URL probed after every deploy. The default site answers 200 on /health; when the
# default site is disabled the first vhost on nginx_port is probed on / instead.
nginx_health_url: >-
  http://127.0.0.1:{{ nginx_port }}{{ '/health' if nginx_default_site_enabled | bool else '/' }}
# Status codes that count as healthy. Redirects, auth challenges and 404 are
# accepted because a custom first vhost may legitimately answer with them; upstream
# errors (502/503/504) are not, so a vhost whose backend is down is reported.
nginx_health_status_codes: [200, 204, 301, 302, 307, 308, 401, 403, 404]
nginx_health_retries: 5
nginx_health_delay: 5
nginx_health_validate_certs: false
# Roll the configuration back (and reload) when the health check still fails after
# all retries. Set to false to keep the new configuration and only fail the host.
nginx_rollback_on_health_failure: true
nginx_backup_files:
  - /etc/nginx/nginx.conf
  - /etc/nginx/proxy_params
  - /etc/nginx/sites-available/default
nginx_config_dirs:
  - /etc/nginx

# -----------------------------------------------------------------------------
# Conflicting services | 占用 80/443 端口的服务
# -----------------------------------------------------------------------------
# Nginx itself is never stopped, disabled or killed by this role and no process is
# ever signalled. When enabled, the services below are stopped and disabled through
# systemd, and only when service_facts shows the unit exists on the host.
nginx_stop_conflicting_services: false
nginx_conflicting_services:
  - apache2
  - httpd
  - caddy
  - traefik
# Ports listed by the `ss -Hltnp` diagnostic when Nginx fails to start.
nginx_diagnostic_ports: [80, 443]

# -----------------------------------------------------------------------------
# Core tuning | 核心参数 (fall back to the legacy `nginx:` dictionary)
# -----------------------------------------------------------------------------
nginx_worker_processes: "{{ (nginx | default({})).worker_processes | default('auto') }}"
nginx_worker_connections: "{{ (nginx | default({})).worker_connections | default(1024) }}"
nginx_keepalive_timeout: "{{ (nginx | default({})).keepalive_timeout | default(65) }}"
nginx_client_max_body_size: "{{ (nginx | default({})).client_max_body_size | default('16M') }}"
nginx_default_log_format: >-
  $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent
  "$http_referer" "$http_user_agent" "$http_x_forwarded_for"
nginx_log_format: "{{ (nginx | default({})).log_format | default(nginx_default_log_format) }}"
# Raw directives appended to the http {} block.
nginx_extra_http_configs: "{{ (nginx | default({})).extra_http_configs | default('') }}"
nginx_types_hash_max_size: 2048
nginx_server_names_hash_bucket_size: 64
nginx_server_tokens: "off"
nginx_error_log_level: warn
nginx_gzip_enabled: true

# TLS defaults inherited by every vhost (a site may override protocols/ciphers).
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
nginx_ssl_prefer_server_ciphers: "on"
nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
nginx_ssl_session_cache: "shared:SSL:10m"
nginx_ssl_session_timeout: 1d
nginx_ssl_session_tickets: "off"

# -----------------------------------------------------------------------------
# Security headers | 安全响应头 (conf.d/security-headers.conf, http context)
# -----------------------------------------------------------------------------
# nginx does not inherit add_header into a server/location block that defines its
# own add_header; such blocks must repeat the headers they need.
nginx_security_headers_enabled: true
nginx_security_headers:
  X-Content-Type-Options: nosniff
  X-Frame-Options: SAMEORIGIN
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: "camera=(), microphone=(), geolocation=()"
# HSTS is off by default: enable it only once every HTTPS host name served by this
# host has a valid certificate, otherwise browsers lock visitors out for max-age.
nginx_hsts_enabled: false
nginx_hsts_header: "max-age=31536000; includeSubDomains"

# -----------------------------------------------------------------------------
# Sites | 站点
# -----------------------------------------------------------------------------
# nginx_sites, nginx_group_sites (group_vars) and nginx_host_sites (host_vars) are
# merged. Keys per site: name (required), enabled (true), listen (80), listen_ipv6
# (false), extra_listen ([]), http2 (false), default_server (false), server_name
# ("_"), root, index, client_max_body_size, ssl {cert, key, protocols, ciphers},
# custom_head, locations [{path, root, alias, try_files, proxy_pass, return,
# custom_content}], custom_tail, access_log, error_log. See README.md.
nginx_sites: []
nginx_group_sites: []
nginx_host_sites: []
nginx_all_sites: "{{ nginx_sites + nginx_group_sites + nginx_host_sites }}"
# Ship the catch-all default site (/, /health, /nginx_status) on nginx_port.
nginx_default_site_enabled: true
nginx_default_site_ipv6: true
# Remove symlinks in sites-enabled that this role does not manage (a distribution
# default or a hand-made vhost). Off by default so manual vhosts survive; turn it
# on for hosts whose Nginx must be fully declarative.
nginx_prune_unmanaged_sites: false
# Timeouts (seconds) written to /etc/nginx/proxy_params.
nginx_proxy_timeout: 300
# Extra http-level snippets written to /etc/nginx/conf.d/<name>.conf.
nginx_custom_configs: []
# Example:
# nginx_custom_configs:
#   - name: rate-limit
#     content: |
#       limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# -----------------------------------------------------------------------------
# Web root and log rotation | 站点根目录与日志轮转
# -----------------------------------------------------------------------------
nginx_web_root: /var/www/html
nginx_deploy_index: true
# Manage /etc/logrotate.d/nginx (daily, compressed) and keep this many days.
nginx_logrotate_managed: true
nginx_log_rotate_days: 14
