---
# =============================================================================
# Nginx handlers | Nginx 处理器
# =============================================================================
# `Reload nginx` is notified by every configuration task and flushed by
# tasks/main.yml only after `nginx -t` accepted the complete configuration, so a
# reload never drops in-flight requests. It is also safe when Nginx is not running
# yet: tasks/main.yml ensures the service is started before the flush, and on
# systemd hosts ansible.builtin.service delegates to the systemd module, which
# starts an inactive unit instead of failing when asked to reload it.
# =============================================================================

- name: Reload nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: reloaded

- name: Restart nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: restarted
