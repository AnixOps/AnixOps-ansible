---
# =============================================================================
# Grafana - preflight | 前置检查
# =============================================================================

- name: Assert that grafana_admin_password is set | 断言已设置 grafana_admin_password
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password | string | length > 0
      - grafana_admin_password | string != 'admin'
    fail_msg: >-
      grafana_admin_password must be a non-empty, non-default value. Provide it via
      group_vars (vault), `-e grafana_admin_password=...` or the GRAFANA_ADMIN_PASSWORD
      environment variable before deploying Grafana.
    quiet: true
  no_log: true

- name: Assert that the target runs a Debian based distribution | 断言目标为 Debian 系发行版
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "roles/grafana supports Debian/Ubuntu only (apt.grafana.com); got {{ ansible_os_family }}."
    quiet: true
