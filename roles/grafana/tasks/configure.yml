---
# =============================================================================
# Grafana - configure | 配置
# =============================================================================

- name: Deploy grafana.ini | 部署 grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_file }}"
    owner: root
    group: "{{ grafana_group }}"
    mode: "0640"
    backup: true
  register: grafana_config_result
  no_log: true
  notify: Restart grafana

- name: Create provisioning and dashboard directories | 创建 provisioning 与仪表盘目录
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ grafana_group }}"
    mode: "0755"
  loop:
    - { path: "{{ grafana_provisioning_dir }}/datasources", owner: root }
    - { path: "{{ grafana_provisioning_dir }}/dashboards", owner: root }
    - { path: "{{ grafana_dashboards_dir }}", owner: "{{ grafana_user }}" }
  loop_control:
    label: "{{ item.path }}"

- name: Provision Prometheus datasource | 配置 Prometheus 数据源
  ansible.builtin.template:
    src: datasource-prometheus.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
    owner: root
    group: "{{ grafana_group }}"
    mode: "0640"
    backup: true
  notify: Restart grafana

- name: Provision Loki datasource | 配置 Loki 数据源
  ansible.builtin.template:
    src: datasource-loki.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/loki.yml"
    owner: root
    group: "{{ grafana_group }}"
    mode: "0640"
    backup: true
  notify: Restart grafana

- name: Provision dashboard file provider | 配置仪表盘文件 provider
  ansible.builtin.template:
    src: dashboards-provider.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/anixops.yml"
    owner: root
    group: "{{ grafana_group }}"
    mode: "0640"
    backup: true
  notify: Restart grafana

- name: Collect dashboard files from the repository | 收集仓库中的仪表盘文件
  ansible.builtin.set_fact:
    grafana_dashboard_files: >-
      {{ lookup('ansible.builtin.fileglob', grafana_dashboards_src_dir ~ '/*.json', wantlist=True) | sort }}

# The file provider re-reads the directory every grafana_dashboards_update_interval
# seconds, so dashboard changes need no restart.
- name: Deploy dashboards | 部署仪表盘
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ grafana_dashboards_dir }}/{{ item | basename }}"
    owner: root
    group: "{{ grafana_group }}"
    mode: "0644"
  loop: "{{ grafana_dashboard_files }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Find dashboards present on the host | 查找主机上已有的仪表盘
  ansible.builtin.find:
    paths: "{{ grafana_dashboards_dir }}"
    patterns: "*.json"
    file_type: file
  register: grafana_dashboards_on_host
  when: grafana_dashboards_prune | bool

- name: Remove dashboards that are no longer in the repository | 删除仓库中已不存在的仪表盘
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (grafana_dashboards_on_host.files | default([]) | map(attribute='path') | list)
       | difference(grafana_dashboard_files | map('basename')
                    | map('regex_replace', '^', grafana_dashboards_dir ~ '/') | list) }}
  when: grafana_dashboards_prune | bool
