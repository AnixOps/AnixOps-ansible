---
# =============================================================================
# Grafana server role | Grafana 角色
# =============================================================================
# preflight -> admin password present, supported OS
# install   -> signed-by keyring, deb822 repository, package (optionally pinned)
# configure -> grafana.ini, datasources, dashboards provisioning
# service   -> flush handlers, enable + start, optional admin password reset
# verify    -> /api/health with retries, rollback on failure
# =============================================================================

- name: Run Grafana preflight checks | Grafana 前置检查
  ansible.builtin.include_tasks: preflight.yml

- name: Install Grafana | 安装 Grafana
  ansible.builtin.include_tasks: install.yml

- name: Configure Grafana | 配置 Grafana
  ansible.builtin.include_tasks: configure.yml

- name: Manage Grafana service | 管理 Grafana 服务
  ansible.builtin.include_tasks: service.yml

- name: Verify Grafana | 验证 Grafana
  ansible.builtin.include_tasks: verify.yml

- name: Show Grafana summary | 显示 Grafana 摘要
  ansible.builtin.debug:
    msg: >-
      Grafana ready on {{ grafana_http_addr }}:{{ grafana_http_port }} (root_url {{ grafana_root_url }},
      datasources: Prometheus {{ grafana_prometheus_url }}, Loki {{ grafana_loki_url }},
      dashboards: {{ grafana_dashboards_dir }})
