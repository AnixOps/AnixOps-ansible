---
# =============================================================================
# Speedtest - install | 安装
# =============================================================================

- name: Check for an existing speedtest binary | 检查已安装的二进制文件
  ansible.builtin.stat:
    path: "{{ speedtest_install_dir }}/{{ speedtest_bin_name }}"
  register: speedtest_binary_stat

- name: Download and install speedtest | 下载并安装 speedtest
  when: (not speedtest_binary_stat.stat.exists) or (speedtest_force_update | bool)
  block:
    - name: Create temporary download directory | 创建临时下载目录
      ansible.builtin.tempfile:
        state: directory
        suffix: speedtest
      register: speedtest_tmpdir

    - name: Download speedtest binary | 下载 speedtest 二进制文件
      ansible.builtin.get_url:
        url: "{{ speedtest_download_url | trim }}"
        dest: "{{ speedtest_tmpdir.path }}/{{ speedtest_bin_name }}"
        checksum: "{{ speedtest_checksum if speedtest_checksum | length > 0 else omit }}"
        timeout: "{{ speedtest_download_timeout }}"
        mode: "0755"
      register: speedtest_download
      retries: "{{ speedtest_download_retries }}"
      delay: "{{ speedtest_download_delay }}"
      until: speedtest_download is succeeded

    - name: Check that the downloaded binary runs | 检查下载的二进制文件可运行
      ansible.builtin.command:
        argv:
          - "{{ speedtest_tmpdir.path }}/{{ speedtest_bin_name }}"
          - --version
      register: speedtest_download_probe
      changed_when: false

    - name: Install speedtest binary | 安装 speedtest 二进制文件
      ansible.builtin.copy:
        src: "{{ speedtest_tmpdir.path }}/{{ speedtest_bin_name }}"
        dest: "{{ speedtest_install_dir }}/{{ speedtest_bin_name }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
  always:
    - name: Remove temporary download directory | 删除临时下载目录
      ansible.builtin.file:
        path: "{{ speedtest_tmpdir.path }}"
        state: absent
      when: speedtest_tmpdir.path is defined
