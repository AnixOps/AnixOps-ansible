---
# =============================================================================
# Speedtest - verify | 验证
# =============================================================================

- name: Read installed speedtest version | 读取已安装的 speedtest 版本
  ansible.builtin.command:
    argv:
      - "{{ speedtest_install_dir }}/{{ speedtest_bin_name }}"
      - --version
  register: speedtest_version_probe
  changed_when: false

- name: Show speedtest summary | 显示 speedtest 摘要
  ansible.builtin.debug:
    msg: >-
      speedtest installed at {{ speedtest_install_dir }}/{{ speedtest_bin_name }}
      ({{ speedtest_version_probe.stdout_lines | default(['unknown']) | first }});
      usage: {{ speedtest_bin_name }} --help
