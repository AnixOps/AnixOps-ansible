---
# =============================================================================
# Speedtest role - defaults | Speedtest 角色默认变量
# =============================================================================
# Installs the AnixOps speedtest CLI binary from GitHub releases.

# -----------------------------------------------------------------------------
# Source | 来源
# -----------------------------------------------------------------------------
speedtest_repo_owner: "AnixOps"
speedtest_repo_name: "AnixOps-speedtest"
# "latest" follows the newest GitHub release; otherwise an exact release tag
# (as published, e.g. "v1.2.0").
speedtest_version: "latest"
speedtest_arch_map:
  x86_64: amd64
  aarch64: arm64
speedtest_arch: "{{ _target_arch | default(speedtest_arch_map[ansible_architecture] | default('amd64')) }}"
speedtest_asset_name: "speedtest-linux-{{ speedtest_arch }}"
# Full download URL; override to point at a mirror or a private build.
speedtest_download_url: >-
  https://github.com/{{ speedtest_repo_owner }}/{{ speedtest_repo_name }}/releases/{{
  'latest/download' if speedtest_version == 'latest' else 'download/' ~ speedtest_version }}/{{ speedtest_asset_name }}
# Optional checksum, e.g. "sha256:<hex>".
speedtest_checksum: ""
speedtest_download_timeout: 60
speedtest_download_retries: 5
speedtest_download_delay: 10

# -----------------------------------------------------------------------------
# Installation | 安装
# -----------------------------------------------------------------------------
speedtest_install_dir: "/usr/local/bin"
speedtest_bin_name: "speedtest"
# The binary is downloaded only when it is missing. Set to true to re-download
# (the file is replaced only when its content differs, so a re-run of an
# unchanged release still reports no change).
speedtest_force_update: false

# -----------------------------------------------------------------------------
# Lifecycle contract | 生命周期契约 (no daemon: empty values)
# -----------------------------------------------------------------------------
speedtest_service_name: ""
speedtest_port: 0
speedtest_health_url: ""
speedtest_backup_files: []
speedtest_packages: []
speedtest_config_dirs: []
