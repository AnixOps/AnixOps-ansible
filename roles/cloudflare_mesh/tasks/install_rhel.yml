---
# =============================================================================
# RHEL-compatible: Cloudflare rpm repository + cloudflare-warp | RHEL 安装
# =============================================================================
# RHEL 9+ needs EPEL enabled for the client's dependencies (see README).

- name: Add the Cloudflare rpm repository | 添加 Cloudflare rpm 软件源
  ansible.builtin.yum_repository:
    name: cloudflare-warp
    description: Cloudflare One Client
    baseurl: "{{ cloudflare_mesh_rpm_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ cloudflare_mesh_rpm_gpgkey }}"
    enabled: true

- name: Install the Cloudflare One client | 安装 Cloudflare One 客户端
  ansible.builtin.dnf:
    name: "{{ cloudflare_mesh_package }}"
    state: present
  register: cloudflare_mesh_dnf_install
  retries: "{{ cloudflare_mesh_download_retries }}"
  delay: "{{ cloudflare_mesh_download_delay }}"
  until: cloudflare_mesh_dnf_install is succeeded
