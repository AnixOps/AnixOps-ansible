---
# =============================================================================
# cloudflare_mesh - main entry point | 主入口
# =============================================================================
# validate -> install (per OS family) -> sysctl + enroll + connect + verify

- name: Validate the Mesh enrollment token and OS family
  ansible.builtin.assert:
    that:
      - cloudflare_mesh_token | length > 0
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      cloudflare_mesh_token must be set (export CLOUDFLARE_MESH_TOKEN; Zero Trust dashboard > Networking >
      Mesh > Add node > CLI enrollment string) and the host must be Debian/Ubuntu or RHEL-compatible
      (got os_family '{{ ansible_os_family }}').
    quiet: true

- name: Include Debian/Ubuntu installation tasks | 包含 Debian/Ubuntu 安装任务
  ansible.builtin.include_tasks: install_debian.yml
  when: ansible_os_family == 'Debian'

- name: Include RHEL installation tasks | 包含 RHEL 安装任务
  ansible.builtin.include_tasks: install_rhel.yml
  when: ansible_os_family == 'RedHat'

- name: Configure and enroll the Mesh node | 配置并注册 Mesh 节点
  ansible.builtin.include_tasks: configure.yml
