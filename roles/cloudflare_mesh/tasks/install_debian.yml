---
# =============================================================================
# Debian/Ubuntu: Cloudflare apt repository + cloudflare-warp | Debian/Ubuntu 安装
# =============================================================================

- name: Install repository prerequisites | 安装软件源依赖
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: cloudflare_mesh_apt_prereqs
  retries: "{{ cloudflare_mesh_download_retries }}"
  delay: "{{ cloudflare_mesh_download_delay }}"
  until: cloudflare_mesh_apt_prereqs is succeeded

- name: Download the Cloudflare package signing key | 下载 Cloudflare 签名密钥
  ansible.builtin.get_url:
    url: "{{ cloudflare_mesh_apt_key_url }}"
    dest: "{{ cloudflare_mesh_apt_key_file }}"
    owner: root
    group: root
    mode: "0644"
  register: cloudflare_mesh_apt_key
  retries: "{{ cloudflare_mesh_download_retries }}"
  delay: "{{ cloudflare_mesh_download_delay }}"
  until: cloudflare_mesh_apt_key is succeeded

- name: Check the dearmored Cloudflare keyring | 检查二进制签名密钥
  ansible.builtin.stat:
    path: "{{ cloudflare_mesh_apt_keyring }}"
    get_checksum: false
  register: cloudflare_mesh_apt_keyring_stat

- name: Check the downloaded Cloudflare signing key | 检查下载的签名密钥
  ansible.builtin.stat:
    path: "{{ cloudflare_mesh_apt_key_file }}"
    get_checksum: false
  register: cloudflare_mesh_apt_key_file_stat

# apt trusts only the dearmored keyring (signed-by points at the .gpg file), so
# it is rebuilt whenever the downloaded key changed or is newer than the keyring.
# A rotated upstream key is picked up, and a run interrupted between download and
# dearmor converges on the next run. | 下载的密钥更新时重新生成 keyring
- name: Dearmor the Cloudflare package signing key | 转换签名密钥为二进制格式
  ansible.builtin.command:
    argv:
      - gpg
      - --yes
      - --dearmor
      - --output
      - "{{ cloudflare_mesh_apt_keyring }}"
      - "{{ cloudflare_mesh_apt_key_file }}"
  when: >-
    (cloudflare_mesh_apt_key is changed)
    or (not cloudflare_mesh_apt_keyring_stat.stat.exists)
    or (cloudflare_mesh_apt_key_file_stat.stat.exists
        and cloudflare_mesh_apt_key_file_stat.stat.mtime > cloudflare_mesh_apt_keyring_stat.stat.mtime)
  changed_when: true

- name: Add the Cloudflare apt repository | 添加 Cloudflare apt 软件源
  ansible.builtin.apt_repository:
    repo: "{{ cloudflare_mesh_apt_repo }}"
    state: present
    filename: cloudflare-client
    update_cache: true
  register: cloudflare_mesh_apt_repo_result
  retries: "{{ cloudflare_mesh_download_retries }}"
  delay: "{{ cloudflare_mesh_download_delay }}"
  until: cloudflare_mesh_apt_repo_result is succeeded

- name: Install the Cloudflare One client | 安装 Cloudflare One 客户端
  ansible.builtin.apt:
    name: "{{ cloudflare_mesh_package }}"
    state: present
  register: cloudflare_mesh_apt_install
  retries: "{{ cloudflare_mesh_download_retries }}"
  delay: "{{ cloudflare_mesh_download_delay }}"
  until: cloudflare_mesh_apt_install is succeeded
