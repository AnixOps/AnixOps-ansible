---
# Prometheus handlers. Order matters: on a first install the unit change
# triggers "Reload systemd" + "Restart prometheus" and only afterwards the
# config change triggers "Reload prometheus" (SIGHUP through ExecReload).
# `state: reloaded` starts the unit when it is not running. The restart
# handler also daemon-reloads so a unit change is picked up even when several
# roles share one play and their same-named "Reload systemd" handlers merge.

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: "{{ prometheus_service_name }}"
    state: restarted
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: "{{ prometheus_service_name }}"
    state: reloaded
