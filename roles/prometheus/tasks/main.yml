---
# =============================================================================
# Prometheus server role | Prometheus 服务端角色
# =============================================================================
# install   -> user, directories, architecture/version aware binary install
# configure -> alert rules, prometheus.yml (promtool validated), systemd unit
# service   -> flush handlers, enable + start
# verify    -> /-/healthy and /-/ready with retries, rollback on failure
# =============================================================================

- name: Install Prometheus | 安装 Prometheus
  ansible.builtin.include_tasks: install.yml

- name: Configure Prometheus | 配置 Prometheus
  ansible.builtin.include_tasks: configure.yml

- name: Manage Prometheus service | 管理 Prometheus 服务
  ansible.builtin.include_tasks: service.yml

- name: Verify Prometheus | 验证 Prometheus
  ansible.builtin.include_tasks: verify.yml

- name: Show Prometheus summary | 显示 Prometheus 摘要
  ansible.builtin.debug:
    msg: >-
      Prometheus {{ prometheus_version }} ready on {{ prometheus_listen_address }}
      (config {{ prometheus_config_file }}, rules {{ prometheus_rules_dir }},
      data {{ prometheus_data_dir }}, retention {{ prometheus_retention_time }})
