---
# =============================================================================
# Prometheus - verify | 验证
# =============================================================================
# Health is checked with retries. On failure the journal tail is shown, the
# backups produced by the template tasks are restored, the service restarted
# and the play fails with a clear message.

- name: Verify prometheus health and readiness | 验证 prometheus 健康与就绪状态
  block:
    - name: Wait for prometheus /-/healthy | 等待 /-/healthy
      ansible.builtin.uri:
        url: "{{ prometheus_health_url }}"
        status_code: 200
        timeout: 10
      register: prometheus_healthy
      retries: "{{ prometheus_verify_retries }}"
      delay: "{{ prometheus_verify_delay }}"
      until: prometheus_healthy.status == 200

    - name: Wait for prometheus /-/ready | 等待 /-/ready
      ansible.builtin.uri:
        url: "{{ prometheus_ready_url }}"
        status_code: 200
        timeout: 10
      register: prometheus_ready
      retries: "{{ prometheus_verify_retries }}"
      delay: "{{ prometheus_verify_delay }}"
      until: prometheus_ready.status == 200
  rescue:
    - name: Collect prometheus journal tail | 收集 prometheus 日志尾部
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ prometheus_service_name }}"
          - -n
          - "50"
          - --no-pager
      register: prometheus_journal
      changed_when: false
      failed_when: false

    - name: Show prometheus journal tail | 显示 prometheus 日志尾部
      ansible.builtin.debug:
        msg: "{{ prometheus_journal.stdout_lines | default([]) }}"

    - name: Restore previous prometheus.yml | 恢复之前的 prometheus.yml
      ansible.builtin.copy:
        src: "{{ prometheus_config_result.backup_file }}"
        dest: "{{ prometheus_config_file }}"
        owner: root
        group: "{{ prometheus_group }}"
        mode: "0644"
        remote_src: true
      when: prometheus_config_result.backup_file is defined

    - name: Restore previous prometheus unit | 恢复之前的 prometheus 单元文件
      ansible.builtin.copy:
        src: "{{ prometheus_unit_result.backup_file }}"
        dest: "{{ prometheus_unit_file }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      when: prometheus_unit_result.backup_file is defined

    - name: Restart prometheus with the restored configuration | 使用恢复的配置重启 prometheus
      ansible.builtin.systemd_service:
        name: "{{ prometheus_service_name }}"
        state: restarted
        daemon_reload: true
      when: >-
        prometheus_config_result.backup_file is defined or
        prometheus_unit_result.backup_file is defined

    - name: Fail because prometheus did not become healthy | prometheus 未能恢复健康，任务失败
      ansible.builtin.fail:
        msg: >-
          Prometheus did not answer 200 on {{ prometheus_health_url }} / {{ prometheus_ready_url }}
          within {{ prometheus_verify_retries * prometheus_verify_delay }}s.
          {% if prometheus_config_result.backup_file is defined or prometheus_unit_result.backup_file is defined %}
          The previous configuration was restored and the service restarted.
          {% endif %}
          Inspect `journalctl -u {{ prometheus_service_name }}` on {{ inventory_hostname }}.
