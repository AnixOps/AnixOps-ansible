---
# =============================================================================
# Prometheus - configure | 配置
# =============================================================================
# Order: rule files first (validated individually), then prometheus.yml
# (promtool check config also resolves rule_files), then the systemd unit.

# -----------------------------------------------------------------------------
# Alert rules | 告警规则
# -----------------------------------------------------------------------------
- name: Collect alert rule files from the repository | 收集仓库中的告警规则文件
  ansible.builtin.set_fact:
    prometheus_rule_files: "{{ lookup('ansible.builtin.fileglob', prometheus_rules_src_dir ~ '/*.yml', wantlist=True) | sort }}"

- name: Deploy alert rule files | 部署告警规则文件
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_rules_dir }}/{{ item | basename }}"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0644"
    backup: true
    validate: "{{ prometheus_install_dir }}/promtool check rules %s"
  loop: "{{ prometheus_rule_files }}"
  loop_control:
    label: "{{ item | basename }}"
  notify: Reload prometheus

- name: Find rule files present on the host | 查找主机上已有的规则文件
  ansible.builtin.find:
    paths: "{{ prometheus_rules_dir }}"
    patterns: "*.yml,*.yaml"
    file_type: file
  register: prometheus_rules_on_host
  when: prometheus_rules_prune | bool

- name: Remove rule files that are no longer in the repository | 删除仓库中已不存在的规则文件
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (prometheus_rules_on_host.files | default([]) | map(attribute='path') | list)
       | difference(prometheus_rule_files | map('basename') | map('regex_replace', '^', prometheus_rules_dir ~ '/') | list) }}
  when: prometheus_rules_prune | bool
  notify: Reload prometheus

# -----------------------------------------------------------------------------
# Main configuration | 主配置
# -----------------------------------------------------------------------------
- name: Deploy prometheus.yml | 部署 prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0644"
    backup: true
    validate: "{{ prometheus_install_dir }}/promtool check config %s"
  register: prometheus_config_result
  notify: Reload prometheus

# -----------------------------------------------------------------------------
# systemd unit | systemd 单元
# -----------------------------------------------------------------------------
- name: Deploy prometheus systemd unit | 部署 prometheus systemd 单元
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: "{{ prometheus_unit_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: prometheus_unit_result
  notify:
    - Reload systemd
    - Restart prometheus
