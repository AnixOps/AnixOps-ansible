---
# =============================================================================
# k8s_dashboard_deploy role defaults | k8s_dashboard_deploy 角色默认变量
# =============================================================================
# Deploys the upstream Kubernetes Dashboard on a k3s node, grants an admin
# service account, stores its token in a root-only file and exposes the
# dashboard on 127.0.0.1:8443 through a hardened kubectl port-forward service.
# The public vhost (TLS termination) is rendered by roles/nginx from
# roles/nginx/templates/k8s/k8s-dashboard.conf.j2 and is NOT part of this role.

# Public name of the dashboard (used by the nginx vhost and the summary).
k8s_dashboard_deploy_domain: "{{ k8s_dashboard_domain | default('dashboard.local') }}"

# --- Upstream manifest | 上游清单 --------------------------------------------
# v2.7.0 is the last release shipping the all-in-one recommended.yaml
# (v3+ is Helm-only); pin and verify with a sha256 when you upgrade.
k8s_dashboard_deploy_version: "v2.7.0"
k8s_dashboard_deploy_manifest_url: >-
  https://raw.githubusercontent.com/kubernetes/dashboard/{{ k8s_dashboard_deploy_version }}/aio/deploy/recommended.yaml
# get_url checksum syntax: "sha256:<hex>"; "" = skip verification.
k8s_dashboard_deploy_manifest_checksum: ""
k8s_dashboard_deploy_manifest_dir: /usr/local/share/k8s-dashboard
k8s_dashboard_deploy_download_retries: 5
k8s_dashboard_deploy_download_delay: 10

# --- Cluster access | 集群访问 ------------------------------------------------
k8s_dashboard_deploy_kubeconfig_path: "{{ kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}"
k8s_dashboard_deploy_kubectl_bin: /usr/local/bin/kubectl
k8s_dashboard_deploy_k3s_bin: /usr/local/bin/k3s
k8s_dashboard_deploy_k3s_service_name: k3s
k8s_dashboard_deploy_namespace: kubernetes-dashboard
k8s_dashboard_deploy_service_account: admin-user

# --- Access token | 访问令牌 --------------------------------------------------
# bound  : "kubectl create token" with k8s_dashboard_deploy_token_duration; generated only when the
#          token file is missing (or k8s_dashboard_deploy_token_rotate is true) -> idempotent.
# secret : long-lived kubernetes.io/service-account-token Secret; the token never expires and is
#          re-read on every run (file content stays identical -> idempotent).
k8s_dashboard_deploy_token_mode: bound
k8s_dashboard_deploy_token_duration: "8760h"
k8s_dashboard_deploy_token_rotate: false
k8s_dashboard_deploy_token_file: /root/k8s-dashboard-token.txt

# --- Local port-forward | 本地端口转发 ----------------------------------------
k8s_dashboard_deploy_bind_address: 127.0.0.1
k8s_dashboard_deploy_rollout_timeout: "120s"
k8s_dashboard_deploy_ready_retries: 5
k8s_dashboard_deploy_ready_delay: 10

# --- Lifecycle contract (consumed by roles/lifecycle) | 生命周期契约 ---------
k8s_dashboard_deploy_port: 8443
k8s_dashboard_deploy_health_url: "https://{{ k8s_dashboard_deploy_bind_address }}:{{ k8s_dashboard_deploy_port }}/"
k8s_dashboard_deploy_service_name: kubectl-port-forward
k8s_dashboard_deploy_backup_files:
  - "/etc/systemd/system/{{ k8s_dashboard_deploy_service_name }}.service"
k8s_dashboard_deploy_config_dirs:
  - "{{ k8s_dashboard_deploy_manifest_dir }}"
k8s_dashboard_deploy_packages: []
