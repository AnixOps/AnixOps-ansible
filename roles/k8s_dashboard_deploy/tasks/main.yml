---
# =============================================================================
# k8s_dashboard_deploy | 部署 Kubernetes Dashboard
# =============================================================================
# manifests (pinned download) -> kubectl apply -> rollout wait -> admin token
# (0600 file, never logged) -> hardened kubectl port-forward unit with rollback

- name: Check that k3s is installed
  ansible.builtin.stat:
    path: "{{ k8s_dashboard_deploy_k3s_bin }}"
  register: k8s_dashboard_deploy_k3s_binary

- name: Assert that k3s is installed
  ansible.builtin.assert:
    that:
      - k8s_dashboard_deploy_k3s_binary.stat.exists
      - k8s_dashboard_deploy_token_mode in ['bound', 'secret']
    fail_msg: >-
      k3s must be installed on {{ inventory_hostname }} (run the k8s_provision role first) and
      k8s_dashboard_deploy_token_mode must be 'bound' or 'secret'.
    quiet: true

- name: Ensure the manifest directory exists
  ansible.builtin.file:
    path: "{{ k8s_dashboard_deploy_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Kubernetes Dashboard manifest {{ k8s_dashboard_deploy_version }}
  ansible.builtin.get_url:
    url: "{{ k8s_dashboard_deploy_manifest_url }}"
    dest: "{{ k8s_dashboard_deploy_manifest_dir }}/recommended-{{ k8s_dashboard_deploy_version }}.yaml"
    checksum: "{{ k8s_dashboard_deploy_manifest_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  register: k8s_dashboard_deploy_manifest
  retries: "{{ k8s_dashboard_deploy_download_retries }}"
  delay: "{{ k8s_dashboard_deploy_download_delay }}"
  until: k8s_dashboard_deploy_manifest is succeeded

- name: Render the admin service account manifest
  ansible.builtin.template:
    src: admin-user.yaml.j2
    dest: "{{ k8s_dashboard_deploy_manifest_dir }}/admin-user.yaml"
    owner: root
    group: root
    mode: "0644"

# The kustomization drops the placeholder data of the CSRF Secret so a re-run stays unchanged.
# kustomization 去掉 CSRF Secret 的占位 data，重复执行保持 unchanged。
- name: Render the Dashboard kustomization
  ansible.builtin.template:
    src: kustomization.yaml.j2
    dest: "{{ k8s_dashboard_deploy_manifest_dir }}/kustomization.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Apply the Kubernetes Dashboard manifests
  ansible.builtin.command:
    argv:
      - "{{ k8s_dashboard_deploy_kubectl_bin }}"
      - apply
      - "--kustomize={{ k8s_dashboard_deploy_manifest_dir }}"
  environment:
    KUBECONFIG: "{{ k8s_dashboard_deploy_kubeconfig_path }}"
  register: k8s_dashboard_deploy_apply
  changed_when: "'created' in k8s_dashboard_deploy_apply.stdout or 'configured' in k8s_dashboard_deploy_apply.stdout"
  retries: 3
  delay: 10
  until: k8s_dashboard_deploy_apply.rc == 0

- name: Wait for the Dashboard deployment to roll out
  ansible.builtin.command:
    argv:
      - "{{ k8s_dashboard_deploy_kubectl_bin }}"
      - "--namespace={{ k8s_dashboard_deploy_namespace }}"
      - rollout
      - status
      - deployment/kubernetes-dashboard
      - "--timeout={{ k8s_dashboard_deploy_rollout_timeout }}"
  environment:
    KUBECONFIG: "{{ k8s_dashboard_deploy_kubeconfig_path }}"
  register: k8s_dashboard_deploy_rollout
  changed_when: false
  retries: "{{ k8s_dashboard_deploy_ready_retries }}"
  delay: "{{ k8s_dashboard_deploy_ready_delay }}"
  until: k8s_dashboard_deploy_rollout.rc == 0

# --- Token: bound mode ------------------------------------------------------
- name: Check whether the Dashboard token file exists
  ansible.builtin.stat:
    path: "{{ k8s_dashboard_deploy_token_file }}"
  register: k8s_dashboard_deploy_token_stat
  when: k8s_dashboard_deploy_token_mode == 'bound'

- name: Create a bound service account token
  ansible.builtin.command:
    argv:
      - "{{ k8s_dashboard_deploy_kubectl_bin }}"
      - "--namespace={{ k8s_dashboard_deploy_namespace }}"
      - create
      - token
      - "{{ k8s_dashboard_deploy_service_account }}"
      - "--duration={{ k8s_dashboard_deploy_token_duration }}"
  environment:
    KUBECONFIG: "{{ k8s_dashboard_deploy_kubeconfig_path }}"
  register: k8s_dashboard_deploy_token_bound
  changed_when: true
  no_log: true
  when:
    - k8s_dashboard_deploy_token_mode == 'bound'
    - not k8s_dashboard_deploy_token_stat.stat.exists or k8s_dashboard_deploy_token_rotate | bool

- name: Write the Dashboard token file (bound token)
  ansible.builtin.copy:
    content: "{{ k8s_dashboard_deploy_token_bound.stdout }}\n"
    dest: "{{ k8s_dashboard_deploy_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - k8s_dashboard_deploy_token_mode == 'bound'
    - k8s_dashboard_deploy_token_bound is not skipped

# --- Token: secret mode -----------------------------------------------------
- name: Read the long-lived token from the service account Secret
  ansible.builtin.command:
    argv:
      - "{{ k8s_dashboard_deploy_kubectl_bin }}"
      - "--namespace={{ k8s_dashboard_deploy_namespace }}"
      - get
      - secret
      - "{{ k8s_dashboard_deploy_service_account }}-token"
      - "--output=jsonpath={.data.token}"
  environment:
    KUBECONFIG: "{{ k8s_dashboard_deploy_kubeconfig_path }}"
  register: k8s_dashboard_deploy_token_secret
  changed_when: false
  no_log: true
  retries: 10
  delay: 3
  until: k8s_dashboard_deploy_token_secret.stdout | default('') | length > 0
  when: k8s_dashboard_deploy_token_mode == 'secret'

- name: Write the Dashboard token file (long-lived token)
  ansible.builtin.copy:
    content: "{{ k8s_dashboard_deploy_token_secret.stdout | b64decode }}\n"
    dest: "{{ k8s_dashboard_deploy_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: k8s_dashboard_deploy_token_mode == 'secret'

# --- Local port-forward service ----------------------------------------------
- name: Install the kubectl port-forward systemd unit
  ansible.builtin.template:
    src: kubectl-port-forward.service.j2
    dest: "/etc/systemd/system/{{ k8s_dashboard_deploy_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: k8s_dashboard_deploy_unit
  notify:
    - Reload systemd
    - Restart kubectl-port-forward

- name: Roll out the port-forward service
  block:
    - name: Apply pending port-forward handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure the port-forward service is enabled and running
      ansible.builtin.systemd_service:
        name: "{{ k8s_dashboard_deploy_service_name }}"
        state: started
        enabled: true

    - name: Wait for the port-forward listener
      ansible.builtin.wait_for:
        host: "{{ k8s_dashboard_deploy_bind_address }}"
        port: "{{ k8s_dashboard_deploy_port }}"
        timeout: 60

    - name: Verify the Dashboard answers through the port-forward
      ansible.builtin.uri:
        url: "{{ k8s_dashboard_deploy_health_url }}"
        validate_certs: false
        status_code: 200
      register: k8s_dashboard_deploy_health
      retries: "{{ k8s_dashboard_deploy_ready_retries }}"
      delay: "{{ k8s_dashboard_deploy_ready_delay }}"
      until: k8s_dashboard_deploy_health.status | default(0) == 200
  rescue:
    - name: Restore the previous port-forward unit
      ansible.builtin.copy:
        src: "{{ k8s_dashboard_deploy_unit.backup_file }}"
        dest: "/etc/systemd/system/{{ k8s_dashboard_deploy_service_name }}.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: k8s_dashboard_deploy_unit.backup_file is defined

    - name: Restart the port-forward service with the restored unit
      ansible.builtin.systemd_service:
        name: "{{ k8s_dashboard_deploy_service_name }}"
        state: restarted
        daemon_reload: true
      when: k8s_dashboard_deploy_unit.backup_file is defined

    - name: Fail after the port-forward rollback
      ansible.builtin.fail:
        msg: >-
          The Kubernetes Dashboard is not reachable on {{ k8s_dashboard_deploy_health_url }}; the previous
          {{ k8s_dashboard_deploy_service_name }}.service was restored when one existed. Inspect
          'journalctl -u {{ k8s_dashboard_deploy_service_name }}' and
          'kubectl -n {{ k8s_dashboard_deploy_namespace }} get pods' on {{ inventory_hostname }}.

- name: Show the deployment summary
  ansible.builtin.debug:
    msg:
      - "Dashboard {{ k8s_dashboard_deploy_version }} deployed in namespace {{ k8s_dashboard_deploy_namespace }}"
      - "Local endpoint: {{ k8s_dashboard_deploy_health_url }} ({{ k8s_dashboard_deploy_service_name }}.service)"
      - "Public URL (nginx vhost): https://{{ k8s_dashboard_deploy_domain }}"
      - "Token file: {{ k8s_dashboard_deploy_token_file }} (mode 0600, {{ k8s_dashboard_deploy_token_mode }} token)"
