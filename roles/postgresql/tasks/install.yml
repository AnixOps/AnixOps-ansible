---
# =============================================================================
# PostgreSQL installation | PostgreSQL 安装
# =============================================================================
# Distribution packages by default. With postgresql_use_pgdg the official PGDG
# repository is added as a signed deb822 source (no shell / apt-key hacks).

- name: Configure the PGDG apt repository | 配置 PGDG apt 源
  when: postgresql_use_pgdg | bool
  block:
    - name: Install apt prerequisites | 安装前置依赖
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: postgresql_apt_prereq
      retries: 5
      delay: 10
      until: postgresql_apt_prereq is succeeded

    - name: Create apt keyrings directory | 创建 keyrings 目录
      ansible.builtin.file:
        path: "{{ postgresql_pgdg_key_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the PGDG signing key | 下载 PGDG 签名密钥
      ansible.builtin.get_url:
        url: "{{ postgresql_pgdg_key_url }}"
        dest: "{{ postgresql_pgdg_key_path }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 30
      register: postgresql_pgdg_key
      retries: 5
      delay: 10
      until: postgresql_pgdg_key is succeeded

    - name: Configure the PGDG repository (deb822) | 配置 PGDG 软件源
      ansible.builtin.deb822_repository:
        name: pgdg
        types: [deb]
        uris: "{{ postgresql_pgdg_repo_url }}"
        suites: "{{ ansible_distribution_release }}-pgdg"
        components: [main]
        signed_by: "{{ postgresql_pgdg_key_path }}"
        state: present
        enabled: true
      register: postgresql_pgdg_repo

# On a fresh Debian/Ubuntu host the postgresql-<version> postinst creates the
# "main" cluster itself (create_main_cluster), so the pg_createcluster task below
# is skipped there. The checksum flag therefore reaches that automatic
# pg_createcluster through a createcluster.d drop-in (included by the ucf-managed
# createcluster.conf, which stays untouched). The drop-in is only written while
# no cluster exists on the host (the same test Debian uses): it also applies to
# the cluster pg_upgradecluster creates, and pg_upgrade refuses to combine a
# cluster without checksums with one that has them. Existing clusters are never
# changed; enable checksums on them offline with pg_checksums --enable. | 新集群启用数据校验
- name: Check for the PostgreSQL cluster configuration directory | 检查集群配置目录
  ansible.builtin.stat:
    path: /etc/postgresql
  register: postgresql_etc_dir

- name: Find existing PostgreSQL clusters | 查找现有集群
  ansible.builtin.find:
    paths: /etc/postgresql
    patterns: postgresql.conf
    recurse: true
    depth: 3
  register: postgresql_existing_clusters
  when: postgresql_etc_dir.stat.exists

- name: Enable data checksums for clusters created on a fresh host | 为新主机上创建的集群启用数据校验
  when:
    - postgresql_data_checksums | bool
    - (not postgresql_etc_dir.stat.exists) or (postgresql_existing_clusters.matched | int == 0)
  block:
    - name: Create the createcluster.d drop-in directory | 创建 createcluster.d 目录
      ansible.builtin.file:
        path: /etc/postgresql-common/createcluster.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the data checksum drop-in | 部署数据校验配置
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (postgresql role)
          initdb_options = '--data-checksums'
        dest: /etc/postgresql-common/createcluster.d/50-anixops-checksums.conf
        owner: root
        group: root
        mode: "0644"
        backup: true

- name: Remove the data checksum drop-in when checksums are disabled | 关闭时移除数据校验配置
  ansible.builtin.file:
    path: /etc/postgresql-common/createcluster.d/50-anixops-checksums.conf
    state: absent
  when: not (postgresql_data_checksums | bool)

# The apt cache is refreshed unconditionally right after the PGDG source was
# added (cache_valid_time 0) and at most hourly otherwise.
- name: Install PostgreSQL packages | 安装 PostgreSQL 软件包
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if (postgresql_pgdg_repo is defined and postgresql_pgdg_repo is changed) else 3600 }}"
  register: postgresql_apt_install
  retries: 5
  delay: 10
  until: postgresql_apt_install is succeeded

- name: List existing clusters | 列出现有集群
  ansible.builtin.command:
    argv:
      - pg_lsclusters
      - --no-header
  register: postgresql_clusters
  changed_when: false
  check_mode: false

# Only a MISSING cluster is created. An existing cluster is never dropped or
# recreated by this role, whatever its state, to rule out data loss.
- name: Create the cluster when missing | 创建缺失的集群
  ansible.builtin.command:
    argv: >-
      {{ ['pg_createcluster', postgresql_version | string, postgresql_cluster_name]
         + (['--', '--data-checksums'] if postgresql_data_checksums | bool else []) }}
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  when: >-
    postgresql_clusters.stdout_lines
    | select('match', '^' ~ (postgresql_version | string) ~ '\s+' ~ postgresql_cluster_name ~ '\s')
    | list | length == 0

- name: Ensure PostgreSQL is enabled and running | 确保 PostgreSQL 已启用并运行
  ansible.builtin.systemd:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true
