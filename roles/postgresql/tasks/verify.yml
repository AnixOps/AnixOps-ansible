---
# =============================================================================
# PostgreSQL verification | PostgreSQL 验证
# =============================================================================

- name: Gather service facts | 收集服务状态
  ansible.builtin.service_facts:

- name: Record the PostgreSQL instance state | 记录实例服务状态
  ansible.builtin.set_fact:
    postgresql_service_state: >-
      {{ (ansible_facts.services[postgresql_instance_service ~ '.service'] | default({})).state | default('unknown') }}

- name: Check the PostgreSQL instance is running | 检查实例运行状态
  ansible.builtin.assert:
    that:
      - postgresql_service_state == 'running'
    fail_msg: "{{ postgresql_instance_service }} state is '{{ postgresql_service_state }}' (expected 'running')."
    quiet: true

- name: Confirm PostgreSQL accepts connections | 确认 PostgreSQL 可接受连接
  ansible.builtin.command:
    argv:
      - pg_isready
      - -q
      - -h
      - "{{ postgresql_socket_dir }}"
      - -p
      - "{{ postgresql_port }}"
  become: true
  become_user: postgres
  register: postgresql_verify_ready
  changed_when: false
  retries: "{{ postgresql_ready_retries }}"
  delay: "{{ postgresql_ready_delay }}"
  until: postgresql_verify_ready.rc == 0

- name: Confirm the application role can log in (Unix socket) | 确认应用账号可通过 socket 登录
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -h
      - "{{ postgresql_socket_dir }}"
      - -p
      - "{{ postgresql_port }}"
      - -U
      - "{{ postgresql_user }}"
      - -d
      - "{{ postgresql_database }}"
      - -tAc
      - "SELECT 1"
  environment:
    PGPASSWORD: "{{ postgresql_password }}"
    PGCONNECT_TIMEOUT: "5"
  register: postgresql_verify_socket_login
  changed_when: false
  failed_when: postgresql_verify_socket_login.rc != 0 or postgresql_verify_socket_login.stdout | trim != '1'
  no_log: true

- name: Confirm the application role can log in over TCP | 确认应用账号可通过 TCP 登录
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -h
      - 127.0.0.1
      - -p
      - "{{ postgresql_port }}"
      - -U
      - "{{ postgresql_user }}"
      - -d
      - "{{ postgresql_database }}"
      - -tAc
      - "SELECT 1"
  environment:
    PGPASSWORD: "{{ postgresql_password }}"
    PGCONNECT_TIMEOUT: "5"
  register: postgresql_verify_tcp_login
  changed_when: false
  failed_when: postgresql_verify_tcp_login.rc != 0 or postgresql_verify_tcp_login.stdout | trim != '1'
  no_log: true
  when:
    - postgresql_verify_tcp | bool
    - "'127.0.0.1/32' in postgresql_allowed_cidrs"

- name: Show deployment summary | 显示部署摘要
  ansible.builtin.debug:
    msg: >-
      PostgreSQL {{ postgresql_version }}/{{ postgresql_cluster_name }} on {{ inventory_hostname }}:
      service={{ postgresql_service_state }} listen={{ postgresql_listen_addresses }}
      port={{ postgresql_port }} database={{ postgresql_database }} role={{ postgresql_user }}
      allowed={{ postgresql_allowed_cidrs | join(',') }} tls={{ postgresql_ssl_active | default(false) }}
      shared_buffers={{ postgresql_shared_buffers }} backups={{ postgresql_backup_enabled | bool }}
