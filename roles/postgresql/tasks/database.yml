---
# =============================================================================
# Application role and database | 应用账号与数据库
# =============================================================================
# Every write is guarded by a read-only existence check so a second run is
# changed=0. Statements are fed through stdin (never argv) and tasks handling
# the password run with no_log.

- name: Check whether the application role exists | 检查应用账号是否存在
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname = {{ postgresql_sql_user_literal }}"
  become: true
  become_user: postgres
  register: postgresql_role_check
  changed_when: false

- name: Create the application role | 创建应用账号
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
    stdin: "CREATE ROLE {{ postgresql_sql_user_ident }} WITH LOGIN PASSWORD {{ postgresql_sql_password_literal }};"
  become: true
  become_user: postgres
  no_log: true
  changed_when: true
  when: postgresql_role_check.stdout | trim != '1'

- name: Check whether the application database exists | 检查应用数据库是否存在
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname = {{ postgresql_sql_db_literal }}"
  become: true
  become_user: postgres
  register: postgresql_db_check
  changed_when: false

- name: Create the application database | 创建应用数据库
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
    stdin: "CREATE DATABASE {{ postgresql_sql_db_ident }} OWNER {{ postgresql_sql_user_ident }} ENCODING 'UTF8';"
  become: true
  become_user: postgres
  changed_when: true
  when: postgresql_db_check.stdout | trim != '1'

- name: Check database privileges of the application role | 检查数据库权限
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -tAc
      - >-
        SELECT has_database_privilege({{ postgresql_sql_user_literal }}, {{ postgresql_sql_db_literal }},
        'CREATE,CONNECT,TEMP')
  become: true
  become_user: postgres
  register: postgresql_privilege_check
  changed_when: false

- name: Grant privileges on the database | 授予数据库权限
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
    stdin: "GRANT ALL PRIVILEGES ON DATABASE {{ postgresql_sql_db_ident }} TO {{ postgresql_sql_user_ident }};"
  become: true
  become_user: postgres
  changed_when: true
  when: postgresql_privilege_check.stdout | trim != 't'

# The password cannot be compared against the stored verifier, so a login is
# attempted over the Unix socket (scram rule in pg_hba.conf). Only when it
# fails is the password (re)set, which also migrates legacy md5 verifiers.
- name: Test the application role login | 测试应用账号登录
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -h
      - "{{ postgresql_socket_dir }}"
      - -p
      - "{{ postgresql_port }}"
      - -U
      - "{{ postgresql_user }}"
      - -d
      - "{{ postgresql_database }}"
      - -tAc
      - "SELECT 1"
  environment:
    PGPASSWORD: "{{ postgresql_password }}"
    PGCONNECT_TIMEOUT: "5"
  register: postgresql_login_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Set the application role password | 设置应用账号密码
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
    stdin: "ALTER ROLE {{ postgresql_sql_user_ident }} WITH LOGIN PASSWORD {{ postgresql_sql_password_literal }};"
  become: true
  become_user: postgres
  no_log: true
  changed_when: true
  when: postgresql_login_check.rc != 0 or postgresql_login_check.stdout | trim != '1'
