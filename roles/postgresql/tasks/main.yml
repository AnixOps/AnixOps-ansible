---
# =============================================================================
# PostgreSQL main tasks | PostgreSQL 主任务
# =============================================================================
# validate -> install -> configure (rollback-safe) -> database objects ->
# backups -> verify

- name: Validate supported operating system | 校验操作系统
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "The postgresql role supports Debian/Ubuntu hosts only (apt + pg_createcluster layout)."
    quiet: true

- name: Validate required variables | 校验必需变量
  ansible.builtin.assert:
    that:
      - postgresql_password | default('') | length > 0
      - postgresql_user | default('') | length > 0
      - postgresql_database | default('') | length > 0
    fail_msg: |
      Missing PostgreSQL configuration | 缺少 PostgreSQL 配置:
      - V2BOARD_PG_PASSWORD (application role password, required)
      - V2BOARD_PG_USER / V2BOARD_PG_DATABASE (default: v2board)
    quiet: true

- name: Include installation tasks | 安装
  ansible.builtin.include_tasks: install.yml

- name: Include configuration tasks | 配置
  ansible.builtin.include_tasks: configure.yml

- name: Include database provisioning tasks | 创建数据库对象
  ansible.builtin.include_tasks: database.yml

- name: Include backup tasks | 备份
  ansible.builtin.include_tasks: backup.yml

- name: Include verification tasks | 验证
  ansible.builtin.include_tasks: verify.yml
