---
# =============================================================================
# Logical backups (optional) | 逻辑备份（可选）
# =============================================================================
# A daily pg_dump (custom format) plus pg_dumpall --globals-only, run by the
# postgres user from cron, with retention. Disabled by default; disabling it
# again removes the cron entry and the script.

- name: Create the backup directory | 创建备份目录
  ansible.builtin.file:
    path: "{{ postgresql_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: postgresql_backup_enabled | bool

- name: Install the backup script | 安装备份脚本
  ansible.builtin.template:
    src: pg_backup.sh.j2
    dest: "{{ postgresql_backup_script }}"
    owner: root
    group: postgres
    mode: "0750"
    backup: true
  when: postgresql_backup_enabled | bool

- name: Remove the backup script when backups are disabled | 禁用时移除备份脚本
  ansible.builtin.file:
    path: "{{ postgresql_backup_script }}"
    state: absent
  when: not postgresql_backup_enabled | bool

- name: Manage the daily backup cron job | 管理每日备份计划任务
  ansible.builtin.cron:
    name: "PostgreSQL logical backup ({{ postgresql_database }})"
    user: postgres
    hour: "{{ postgresql_backup_hour }}"
    minute: "{{ postgresql_backup_minute }}"
    job: "{{ postgresql_backup_script }}"
    state: "{{ postgresql_backup_enabled | bool | ternary('present', 'absent') }}"
