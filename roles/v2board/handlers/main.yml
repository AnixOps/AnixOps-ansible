---
# =============================================================================
# V2board handlers | V2board 处理器
# =============================================================================
# Tasks notify "Restart v2board"; the handler matching the active deployment
# method runs (both listen on the same topic).
# The systemd restart reloads units itself: same-named "Reload systemd" handlers
# of roles sharing one play merge, and the last role loaded wins.

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart v2board container
  community.docker.docker_container:
    name: "{{ v2board_docker_container_name }}"
    state: started
    restart: true
  when: v2board_deploy_method == 'docker'
  listen: Restart v2board

- name: Restart v2board service
  ansible.builtin.systemd:
    name: "{{ v2board_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true
  when: v2board_deploy_method == 'binary'
  listen: Restart v2board
