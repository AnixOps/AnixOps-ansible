---
# =============================================================================
# V2board role defaults | V2board 角色默认变量
# =============================================================================
# Secrets and most knobs are read from environment variables so the same role
# works from GitHub Actions (secrets exported as env) and from a local shell.
# Every variable can also be overridden in inventory/group_vars.
# 密钥与大部分参数从环境变量读取，亦可在 inventory 中覆盖。
# =============================================================================

# --- Deployment method: "docker" (default) or "binary" ------------------------
v2board_deploy_method: "{{ lookup('env', 'V2BOARD_DEPLOY_METHOD') or 'docker' }}"

# Target architecture suffix used for apt repositories and release assets.
v2board_arch: "{{ _target_arch | default(('arm64' if ansible_architecture == 'aarch64' else 'amd64')) }}"

# =============================================================================
# Docker deployment | Docker 部署
# =============================================================================
v2board_docker_image: "kalijerry/v2board"
v2board_docker_tag: "{{ lookup('env', 'V2BOARD_DOCKER_TAG') or 'latest' }}"
v2board_docker_container_name: "v2board"
v2board_docker_network: "host"
v2board_docker_restart_policy: "unless-stopped"
# Re-pull the image on every run when the tag is "latest". The task only
# reports "changed" when the image id actually differs.
v2board_docker_pull: true
# Install Docker Engine from the official apt repository when "docker" is
# missing on the host. Set to false when Docker is managed elsewhere.
v2board_docker_install: true
v2board_docker_apt_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
v2board_docker_apt_key_path: "/etc/apt/keyrings/docker.asc"
v2board_docker_apt_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
v2board_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
# Python libraries required on the target by the community.docker modules.
v2board_docker_python_packages:
  - python3-requests
# Number of container log lines shown when the health check fails.
v2board_docker_log_tail: 100
# Container-side mount points (must match the image).
v2board_docker_volumes:
  - "{{ v2board_config_dir }}/config.yaml:/etc/v2board/config.yaml:ro"
  - "{{ v2board_data_dir }}/frontend:/var/lib/v2board/frontend"
  - "{{ v2board_data_dir }}/logs:/var/lib/v2board/logs"
  - "{{ v2board_data_dir }}/data:/var/lib/v2board/data"

# =============================================================================
# Binary deployment | 二进制部署
# =============================================================================
v2board_repo_owner: "AnixOps"
v2board_repo_name: "v2board_AnixOps"
v2board_install_dir: "/usr/local/v2board"
v2board_config_dir: "/etc/v2board"
v2board_data_dir: "/var/lib/v2board"
v2board_bin_name: "v2board"

# Custom archive URL (overrides the GitHub release lookup when non-empty).
v2board_binary_url: "{{ lookup('env', 'V2BOARD_BINARY_URL') or '' }}"
# Release tag to install, or "latest" to resolve the newest release tag.
v2board_binary_version: "{{ lookup('env', 'V2BOARD_BINARY_VERSION') or 'latest' }}"
v2board_github_api_url: "https://api.github.com/repos/{{ v2board_repo_owner }}/{{ v2board_repo_name }}/releases/latest"
# Optional checksums in get_url format, e.g. "sha256:<hex>" or "sha256:<url>".
v2board_binary_checksum: ""
v2board_frontend_checksum: ""
# Re-download even when the installed version marker already matches.
v2board_force_update: false
# Marker file recording the installed release (used for idempotent upgrades).
v2board_version_file: "{{ v2board_install_dir }}/.installed-version"
# systemd service account (root keeps the historical behaviour).
v2board_service_user: "root"
v2board_service_group: "root"
# Write stdout/stderr to files under the data dir instead of the journal.
v2board_systemd_log_files: false

# =============================================================================
# Shared application configuration | 应用配置（两种部署方式共用）
# =============================================================================
# Use "development" for the first deployment to trigger GORM AutoMigrate and
# switch to "production" afterwards (production skips AutoMigrate).
v2board_env: "{{ lookup('env', 'V2BOARD_ENV') or 'development' }}"

# Ports | 端口
v2board_frontend_port: "{{ lookup('env', 'V2BOARD_FRONTEND_PORT') or '3001' }}"
v2board_api_port: "{{ lookup('env', 'V2BOARD_API_PORT') or '8080' }}"
v2board_grpc_port: "{{ lookup('env', 'V2BOARD_GRPC_PORT') or '50051' }}"
v2board_nodex_port: "{{ lookup('env', 'V2BOARD_NODEX_PORT') or '18081' }}"

# Database | 数据库
v2board_db_type: "{{ lookup('env', 'V2BOARD_DB_TYPE') or 'postgres' }}"
v2board_pg_host: "{{ lookup('env', 'V2BOARD_PG_HOST') or 'localhost' }}"
v2board_pg_port: "5432"
# Same env variables and fallbacks as postgresql_user / postgresql_database.
v2board_pg_user: "{{ lookup('env', 'V2BOARD_PG_USER') or 'v2board' }}"
v2board_pg_password: "{{ lookup('env', 'V2BOARD_PG_PASSWORD') or '' }}"
v2board_pg_database: "{{ lookup('env', 'V2BOARD_PG_DATABASE') or 'v2board' }}"
v2board_redis_host: "{{ lookup('env', 'V2BOARD_REDIS_HOST') or 'localhost' }}"
v2board_redis_port: "6379"
v2board_redis_password: "{{ lookup('env', 'V2BOARD_REDIS_PASSWORD') or '' }}"

# Secrets (required) | 密钥（必需）
v2board_jwt_secret: "{{ lookup('env', 'V2BOARD_JWT_SECRET') or '' }}"
v2board_api_token: "{{ lookup('env', 'V2BOARD_API_TOKEN') or '' }}"
v2board_admin_email: "{{ lookup('env', 'V2BOARD_ADMIN_EMAIL') or '' }}"
v2board_admin_password: "{{ lookup('env', 'V2BOARD_ADMIN_PASSWORD') or '' }}"

# =============================================================================
# Health check | 健康检查
# =============================================================================
v2board_health_path: "/api/v2/status"
v2board_health_status_codes: [200]
v2board_health_retries: 12
v2board_health_delay: 5
v2board_health_timeout: 10

# =============================================================================
# Lifecycle contract (consumed by roles/lifecycle) | 生命周期契约
# =============================================================================
v2board_port: "{{ v2board_api_port }}"
v2board_health_url: "http://127.0.0.1:{{ v2board_api_port }}{{ v2board_health_path }}"
v2board_backup_files:
  - "{{ v2board_config_dir }}/config.yaml"
v2board_config_dirs:
  - "{{ v2board_config_dir }}"
  - "{{ v2board_data_dir }}"
# v2board itself is not an apt package; Docker Engine is deliberately not
# listed so a lifecycle "cleanup" never removes the container runtime.
v2board_packages: []
# systemd unit only in binary mode; docker mode runs a plain container (no unit),
# which lifecycle and rollback.yml restart through v2board_container_name.
v2board_service_name: "{{ 'v2board' if v2board_deploy_method == 'binary' else '' }}"
v2board_container_name: "{{ v2board_docker_container_name if v2board_deploy_method == 'docker' else '' }}"
# Cleanup still stops and removes a v2board.service unit when one exists (binary
# mode, or left over from a binary-to-docker switch); absent units are skipped.
v2board_cleanup_service_name: "{{ v2board_service_name or 'v2board' }}"
