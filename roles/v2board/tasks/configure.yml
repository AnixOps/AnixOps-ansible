---
# =============================================================================
# V2board binary configuration | V2board 二进制配置
# =============================================================================
# Render config + unit -> flush handlers (daemon-reload / restart) -> ensure the
# service is enabled and started. Health verification lives in verify.yml.

- name: Render config.yaml | 渲染 config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ v2board_config_dir }}/config.yaml"
    owner: root
    group: "{{ v2board_service_group }}"
    mode: "0640"
    backup: true
  register: v2board_config_result
  no_log: true
  notify: Restart v2board

- name: Install the v2board systemd unit | 安装 v2board systemd 单元
  ansible.builtin.template:
    src: v2board.service.j2
    dest: "/etc/systemd/system/{{ v2board_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: v2board_unit_result
  notify:
    - Reload systemd
    - Restart v2board

- name: Apply pending handlers before starting the service | 启动前执行挂起的处理器
  ansible.builtin.meta: flush_handlers

- name: Enable and start v2board | 启用并启动 v2board
  ansible.builtin.systemd:
    name: "{{ v2board_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
