---
# =============================================================================
# V2board Docker configuration | V2board Docker 配置
# =============================================================================
# Render config.yaml -> (re)create the container idempotently -> flush handlers
# so a changed configuration restarts the container before verification.

- name: Render config.yaml | 渲染 config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ v2board_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  register: v2board_config_result
  no_log: true
  notify: Restart v2board

- name: Start the v2board container | 启动 v2board 容器
  community.docker.docker_container:
    name: "{{ v2board_docker_container_name }}"
    image: "{{ v2board_docker_image }}:{{ v2board_docker_tag }}"
    state: started
    pull: false
    restart_policy: "{{ v2board_docker_restart_policy }}"
    network_mode: "{{ v2board_docker_network }}"
    volumes: "{{ v2board_docker_volumes }}"
    container_default_behavior: no_defaults
    comparisons:
      image: strict
      volumes: strict
      network_mode: strict
      restart_policy: strict
  register: v2board_container_result

- name: Apply pending handlers before verification | 在验证前执行挂起的处理器
  ansible.builtin.meta: flush_handlers
