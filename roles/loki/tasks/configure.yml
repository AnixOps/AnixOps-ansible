---
# =============================================================================
# Loki - configure | 配置
# =============================================================================

# `loki -verify-config` parses and validates the rendered file (schema,
# storage, limits) without starting any module. The binary is always present
# here because install.yml runs first.
- name: Deploy loki-config.yml | 部署 loki-config.yml
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_config_file }}"
    owner: root
    group: "{{ loki_group }}"
    mode: "0640"
    backup: true
    validate: "{{ loki_install_dir }}/loki -config.file=%s -verify-config"
  register: loki_config_result
  notify: Restart loki

- name: Deploy loki systemd unit | 部署 loki systemd 单元
  ansible.builtin.template:
    src: loki.service.j2
    dest: "{{ loki_unit_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: loki_unit_result
  notify:
    - Reload systemd
    - Restart loki
