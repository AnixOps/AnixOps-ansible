---
# =============================================================================
# Loki server role | Loki 日志服务端角色
# =============================================================================
# install   -> user, directories, architecture/version aware binary install
# configure -> loki-config.yml (validated with `loki -verify-config`), unit
# service   -> flush handlers, enable + start
# verify    -> /ready with retries, rollback on failure
# =============================================================================

- name: Install Loki | 安装 Loki
  ansible.builtin.include_tasks: install.yml

- name: Configure Loki | 配置 Loki
  ansible.builtin.include_tasks: configure.yml

- name: Manage Loki service | 管理 Loki 服务
  ansible.builtin.include_tasks: service.yml

- name: Verify Loki | 验证 Loki
  ansible.builtin.include_tasks: verify.yml

- name: Show Loki summary | 显示 Loki 摘要
  ansible.builtin.debug:
    msg: >-
      Loki {{ loki_version }} ready on {{ loki_listen_address }}:{{ loki_port }}
      (gRPC {{ loki_grpc_port }}, config {{ loki_config_file }}, data {{ loki_data_dir }},
      retention {{ loki_retention_period if loki_retention_enabled | bool else 'disabled' }})
