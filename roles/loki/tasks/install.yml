---
# =============================================================================
# Loki - install | 安装
# =============================================================================

- name: Create loki system group | 创建 loki 系统组
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true
    state: present

- name: Create loki system user | 创建 loki 系统用户
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create loki configuration directory | 创建配置目录
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    owner: root
    group: "{{ loki_group }}"
    mode: "0755"

- name: Create loki data directory | 创建数据目录
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0750"

- name: Install loki dependency packages | 安装 loki 依赖包
  ansible.builtin.package:
    name: "{{ loki_dependency_packages }}"
    state: present
  register: loki_dependency_install
  retries: 3
  delay: 10
  until: loki_dependency_install is succeeded
  when: loki_dependency_packages | length > 0

# -----------------------------------------------------------------------------
# Version detection | 版本检测
# -----------------------------------------------------------------------------
- name: Check for an existing loki binary | 检查已安装的二进制文件
  ansible.builtin.stat:
    path: "{{ loki_install_dir }}/loki"
  register: loki_binary_stat

- name: Read installed loki version | 读取已安装版本
  ansible.builtin.command:
    argv:
      - "{{ loki_install_dir }}/loki"
      - --version
  register: loki_version_probe
  changed_when: false
  failed_when: false
  when: loki_binary_stat.stat.exists

- name: Determine installed loki version | 确定已安装版本
  ansible.builtin.set_fact:
    loki_installed_version: >-
      {{ ((loki_version_probe.stdout | default('')) ~ ' ' ~ (loki_version_probe.stderr | default('')))
         | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}

- name: Set install flag | 设置安装标志
  ansible.builtin.set_fact:
    loki_install_required: >-
      {{ (not loki_binary_stat.stat.exists) or (loki_installed_version | trim != loki_version) }}

# -----------------------------------------------------------------------------
# Download and install | 下载并安装
# -----------------------------------------------------------------------------
- name: Download and install loki | 下载并安装 loki
  when: loki_install_required | bool
  block:
    - name: Create temporary download directory | 创建临时下载目录
      ansible.builtin.tempfile:
        state: directory
        suffix: loki
      register: loki_tmpdir

    - name: Download loki release archive | 下载 loki 发布包
      ansible.builtin.get_url:
        url: "{{ loki_release_url }}"
        dest: "{{ loki_tmpdir.path }}/loki.zip"
        checksum: "{{ loki_checksum if loki_checksum | length > 0 else omit }}"
        timeout: "{{ loki_download_timeout }}"
        mode: "0644"
      register: loki_download
      retries: "{{ loki_download_retries }}"
      delay: "{{ loki_download_delay }}"
      until: loki_download is succeeded

    - name: Extract loki release archive | 解压 loki 发布包
      ansible.builtin.unarchive:
        src: "{{ loki_tmpdir.path }}/loki.zip"
        dest: "{{ loki_tmpdir.path }}"
        remote_src: true

    - name: Install loki binary | 安装 loki 二进制文件
      ansible.builtin.copy:
        src: "{{ loki_tmpdir.path }}/loki-linux-{{ loki_arch }}"
        dest: "{{ loki_install_dir }}/loki"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart loki
  always:
    - name: Remove temporary download directory | 删除临时下载目录
      ansible.builtin.file:
        path: "{{ loki_tmpdir.path }}"
        state: absent
      when: loki_tmpdir.path is defined
