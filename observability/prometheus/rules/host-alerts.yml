---
# =============================================================================
# Prometheus alert rules - host monitoring | 主机监控告警规则
# =============================================================================
# Deployed by roles/prometheus to /etc/prometheus/rules/ (validated with
# `promtool check rules`). node_exporter targets are relabelled by the role:
#   instance   -> friendly alias (server_alias, falls back to inventory name)
#   target_ip  -> scraped address (ip:port)
#   location / environment / description -> inventory metadata
# Every alert carries `severity` (warning|critical) and `category`.
# =============================================================================
groups:
  # ---------------------------------------------------------------------------
  # Availability | 可用性
  # ---------------------------------------------------------------------------
  - name: host_availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: >-
            Scrape job {{ $labels.job }} has failed for {{ $labels.instance }}
            ({{ $labels.target_ip }}) for more than 2 minutes.

      - alert: NodeExporterDown
        expr: up{job="node_exporter"} == 0
        for: 3m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "node_exporter unreachable on {{ $labels.instance }}"
          description: >-
            node_exporter on {{ $labels.instance }} ({{ $labels.target_ip }},
            {{ $labels.location }}, {{ $labels.environment }}) has been unreachable for 3 minutes.
            The host may be down or port 9100 may be blocked.

      - alert: HostRebooted
        expr: >-
          node_time_seconds{job="node_exporter"} - node_boot_time_seconds{job="node_exporter"} < 600
        for: 0m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.instance }} rebooted recently"
          description: "{{ $labels.instance }} booted {{ $value | humanizeDuration }} ago."

  # ---------------------------------------------------------------------------
  # CPU and memory | CPU 与内存
  # ---------------------------------------------------------------------------
  - name: host_resources
    rules:
      - alert: HighCPUUsage
        expr: >-
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node_exporter",mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 80% for 10 minutes (current {{ $value | printf \"%.1f\" }}%)."

      - alert: CriticalCPUUsage
        expr: >-
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node_exporter",mode="idle"}[5m])) * 100) > 95
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 95% for 5 minutes (current {{ $value | printf \"%.1f\" }}%)."

      - alert: HighLoadAverage
        expr: >-
          node_load15{job="node_exporter"}
            / count by (instance) (node_cpu_seconds_total{job="node_exporter",mode="idle"}) > 2
        for: 15m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High 15m load on {{ $labels.instance }}"
          description: "15 minute load average per core is {{ $value | printf \"%.2f\" }} (threshold 2)."

      - alert: HighMemoryUsage
        expr: >-
          (1 - node_memory_MemAvailable_bytes{job="node_exporter"}
                 / node_memory_MemTotal_bytes{job="node_exporter"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 85% for 10 minutes (current {{ $value | printf \"%.1f\" }}%)."

      - alert: CriticalMemoryUsage
        expr: >-
          (1 - node_memory_MemAvailable_bytes{job="node_exporter"}
                 / node_memory_MemTotal_bytes{job="node_exporter"}) * 100 > 95
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 95% for 5 minutes (current {{ $value | printf \"%.1f\" }}%)."

      - alert: OOMKillDetected
        expr: increase(node_vmstat_oom_kill{job="node_exporter"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "OOM kill on {{ $labels.instance }}"
          description: >-
            The kernel OOM killer terminated {{ $value | printf "%.0f" }} process(es) in the last 10
            minutes.

  # ---------------------------------------------------------------------------
  # Storage | 存储
  # ---------------------------------------------------------------------------
  - name: host_storage
    rules:
      - alert: HighDiskUsage
        expr: >-
          (1 - node_filesystem_avail_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"}
                 / node_filesystem_size_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"})
            * 100 > 80
        for: 10m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Disk {{ $labels.mountpoint }} above 80% on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} ({{ $labels.device }}) is {{ $value | printf \"%.1f\" }}% full."

      - alert: CriticalDiskUsage
        expr: >-
          (1 - node_filesystem_avail_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"}
                 / node_filesystem_size_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"})
            * 100 > 90
        for: 5m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: "Disk {{ $labels.mountpoint }} above 90% on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} ({{ $labels.device }}) is {{ $value | printf \"%.1f\" }}% full."

      - alert: DiskWillFillIn24h
        expr: >-
          (
            node_filesystem_avail_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"}
              / node_filesystem_size_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"} < 0.25
          )
          and
          (
            predict_linear(
              node_filesystem_avail_bytes{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay"}[6h],
              24 * 3600) < 0
          )
        for: 30m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h"
          description: >-
            Based on the last 6 hours, {{ $labels.mountpoint }} ({{ $labels.device }}) on
            {{ $labels.instance }} is predicted to run out of space within 24 hours.

      - alert: FilesystemReadOnly
        expr: >-
          node_filesystem_readonly{job="node_exporter",fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat|overlay|iso9660"} == 1
        for: 5m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: "Read-only filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}"
          description: >-
            {{ $labels.mountpoint }} ({{ $labels.device }}) was remounted read-only, usually after I/O
            errors.

      - alert: HighDiskIO
        expr: rate(node_disk_io_time_seconds_total{job="node_exporter"}[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Disk {{ $labels.device }} saturated on {{ $labels.instance }}"
          description: >-
            Device {{ $labels.device }} has been busy {{ $value | humanizePercentage }} of the time for 10
            minutes.

  # ---------------------------------------------------------------------------
  # Network and time | 网络与时间
  # ---------------------------------------------------------------------------
  - name: host_network
    rules:
      - alert: NetworkErrors
        expr: >-
          rate(node_network_receive_errs_total{job="node_exporter",device!~"lo|veth.*|docker.*|br-.*"}[5m]) > 10
          or rate(node_network_transmit_errs_total{job="node_exporter",device!~"lo|veth.*|docker.*|br-.*"}[5m]) > 10
        for: 10m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "Network errors on {{ $labels.instance }}/{{ $labels.device }}"
          description: "Interface {{ $labels.device }} reports {{ $value | printf \"%.1f\" }} errors/s."

      - alert: ClockSkew
        expr: abs(node_timex_offset_seconds{job="node_exporter"}) > 0.5
        for: 10m
        labels:
          severity: warning
          category: time
        annotations:
          summary: "Clock skew on {{ $labels.instance }}"
          description: "NTP offset is {{ $value | humanizeDuration }}; check chrony."

      - alert: ClockNotSynchronising
        expr: min_over_time(node_timex_sync_status{job="node_exporter"}[5m]) == 0
        for: 10m
        labels:
          severity: warning
          category: time
        annotations:
          summary: "Clock not synchronising on {{ $labels.instance }}"
          description: "The kernel reports no NTP synchronisation for 10 minutes; check chrony."
