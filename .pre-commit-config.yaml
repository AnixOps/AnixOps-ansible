---
# =============================================================================
# pre-commit hooks for AnixOps-ansible
# =============================================================================
# Install:  pip install -r requirements-dev.txt && pre-commit install
# Run all:  make pre-commit        (= pre-commit run --all-files)
# Update:   pre-commit autoupdate  (then run `make check` before committing)
# =============================================================================
minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

exclude: ^(venv|\.venv|\.ansible|collections|\.git)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Jinja-templated YAML is not valid YAML before rendering.
        exclude: ^(roles/[^/]+/templates/|observability/)
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/ansible/ansible-lint
    rev: v25.1.3
    hooks:
      - id: ansible-lint
        args: [--offline]
        # The hook runs in an isolated venv: ansible-core must be installed there too.
        additional_dependencies:
          - ansible-core>=2.16,<2.19

  - repo: local
    hooks:
      - id: encoding-guard
        name: encoding guard (UTF-8 BOM / GBK mojibake)
        description: >-
          Rejects files that start with a UTF-8 BOM or contain GBK-decoded mojibake
          (the same characters `make encoding-check` looks for).
        language: system
        types: [text]
        entry: >-
          bash -c '
          bom=$(printf "\357\273\277");
          pat=$(printf "\351\210\272|\351\217\210|\351\226\256|\351\220\250|\351\224\233|\351\212\206|\351\215\217|\351\216\264|\346\265\240|\347\222\201|\351\215\231|\\?[^ -~]");
          rc=0;
          for f in "$@"; do
            if head -c 3 "$f" | LC_ALL=C grep -q "$bom"; then echo "$f: starts with a UTF-8 BOM"; rc=1; fi;
            if grep -nI -E "$pat" "$f"; then echo "$f: contains GBK mojibake (rewrite the text)"; rc=1; fi;
          done;
          exit $rc' --

      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x -S warning
        language: python
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
        types: [shell]

      - id: backup-coverage
        name: backup coverage gate (template/copy under /etc need backup true)
        entry: python3 scripts/check-backup-coverage.py
        language: system
        pass_filenames: false
        files: ^(roles/[^/]+/(tasks|handlers|defaults|vars)/|playbooks/|scripts/(check-backup-coverage\.py|backup-coverage-allowlist\.txt))

      - id: pytest
        name: pytest -q tests
        entry: python3 -m pytest -q tests
        language: system
        pass_filenames: false
        files: ^(tests/|scripts/|tools/|playbooks/|roles/|inventories/|\.github/)
