# =============================================================================
# AnixOps Ansible configuration | AnixOps Ansible 配置
# =============================================================================
# Every setting here is a project default. Override per run with environment
# variables (ANSIBLE_*) or CLI flags; never edit this file on a target host.
# =============================================================================

[defaults]
# --- Layout -------------------------------------------------------------------
inventory          = ./inventories/production/hosts.yml
roles_path         = ./roles
collections_path   = ./collections:~/.ansible/collections:/usr/share/ansible/collections
remote_user        = root
interpreter_python = auto_silent

# --- Output -------------------------------------------------------------------
stdout_callback         = ansible.builtin.default
callback_result_format  = yaml
callbacks_enabled       = ansible.posix.profile_tasks, ansible.posix.timer
display_skipped_hosts   = False
display_ok_hosts        = True
show_custom_stats       = True
deprecation_warnings    = True
system_warnings         = True
log_path                = .ansible/ansible.log

# --- Safety -------------------------------------------------------------------
# Hosts are reinstalled/re-keyed frequently; host keys are therefore not
# pinned. Set ANSIBLE_HOST_KEY_CHECKING=True to enforce known_hosts.
host_key_checking       = False
error_on_undefined_vars = True
retry_files_enabled     = False
force_valid_group_names = always

# --- Performance --------------------------------------------------------------
forks                   = 10
timeout                 = 30
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = .ansible/facts_cache
fact_caching_timeout    = 3600

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# ControlPersist keeps one multiplexed connection per host; ServerAlive detects
# dead links instead of hanging the whole play. Route through JumpServer with the
# ANSIBLE_SSH_COMMON_ARGS environment variable (see docs/SSH_KEY_MANAGEMENT.md).
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o UserKnownHostsFile=/dev/null
pipelining = True
retries    = 3

[persistent_connection]
command_timeout = 60
connect_timeout = 60

[diff]
always  = False
context = 3
