---
# =============================================================================
# Prometheus | Prometheus 指标服务
# =============================================================================
# JumpServer job template "prometheus": this file is the entry point, the
# sibling folder templates/ is uploaded next to it.
#
# Variables: enter the names below in the JumpServer variable table. JumpServer
# passes each one with a fixed jms_ prefix (jms_prometheus_port, ...).
# Optional:
#   prometheus_port (9090)
#   prometheus_scrape_targets   comma-separated host:port list of node_exporter
#                               endpoints, e.g. 10.0.0.11:9100,10.0.0.12:9100
#                               (empty = only Prometheus itself is scraped)
#   prometheus_retention (30d)  how long metrics are kept
#   prometheus_image_tag (v2.54.1)
#   prometheus_dir (/opt/prometheus)
# Scope: the selected assets; one host at a time
# =============================================================================

- name: Deploy Prometheus | 部署 Prometheus
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0

  vars:
    prometheus_port: "{{ jms_prometheus_port | default(9090) }}"
    prometheus_scrape_targets: "{{ jms_prometheus_scrape_targets | default('') }}"
    prometheus_retention: "{{ jms_prometheus_retention | default('30d') }}"
    prometheus_image_tag: "{{ jms_prometheus_image_tag | default('v2.54.1') }}"
    prometheus_dir: "{{ jms_prometheus_dir | default('/opt/prometheus') }}"
    prometheus_targets_list: "{{ prometheus_scrape_targets.split(',') | map('trim') | reject('equalto', '') | list }}"

  tasks:
    - name: Install Docker with the official convenience script | 安装 Docker
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://get.docker.com | sh
        executable: /bin/bash
        creates: /usr/bin/docker
      register: prometheus_docker_install
      retries: 3
      delay: 10
      until: prometheus_docker_install is succeeded
      changed_when: prometheus_docker_install.changed

    - name: Enable and start Docker | 启动 Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create the Prometheus directory | 创建 Prometheus 目录
      ansible.builtin.file:
        path: "{{ prometheus_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the compose file | 写入 compose 文件
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ prometheus_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Write the Prometheus configuration | 写入 Prometheus 配置
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      register: prometheus_config

    - name: Start Prometheus with Docker Compose | 启动 Prometheus 容器
      ansible.builtin.command:
        cmd: docker compose up -d --pull missing --force-recreate-if-changed
        chdir: "{{ prometheus_dir }}"
      register: prometheus_compose
      retries: 3
      delay: 10
      until: prometheus_compose is succeeded
      changed_when: true

    - name: Restart Prometheus when its configuration changed | 配置变化时重启
      ansible.builtin.command:
        cmd: docker compose restart prometheus
        chdir: "{{ prometheus_dir }}"
      when: prometheus_config.changed
      changed_when: true

    - name: Wait for Prometheus to become ready | 等待 Prometheus 就绪
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
        status_code: 200
        timeout: 10
      register: prometheus_ready
      retries: 12
      delay: 5
      until: prometheus_ready.status == 200
      changed_when: false
