# =============================================================================
# Staging inventory — PLACEHOLDER | 预生产环境清单（占位）
# =============================================================================
# There is no staging fleet yet. This file only exists so that
# `ansible-inventory -i inventories/staging/hosts.yml --list` stays valid and
# nothing targets production by accident when `-i inventories/staging` is used.
#
# When a staging fleet exists, model it exactly like production:
#   1. create inventories/staging/servers-config.yml (schema v2, see the
#      production file for the format);
#   2. render it:
#        python3 tools/generate_inventory.py local \
#          --config inventories/staging/servers-config.yml \
#          --output inventories/staging/hosts.yml
#   3. put shared variables in inventories/staging/group_vars/all/main.yml
#      (the `vars/` directory next to this file is NOT loaded by Ansible).
# =============================================================================
all:
  children: {}
