---
all:
  hosts:
    jp-1:
      ansible_host: "{{ lookup('env', 'JP_1_V4_SSH') }}"
      server_alias: 日本-1 | Japan-1
      location: Japan
      server_environment: test
      description: Japan web server - Oracle | 日本 Web 服务器 - Oracle
    uk-1:
      ansible_host: "{{ lookup('env', 'UK_1_V4_SSH') }}"
      server_alias: 英国-1 | UK-1
      location: United Kingdom
      server_environment: production
      description: UK web server - Oracle | 英国 Web 服务器 - Oracle
    us-w-1:
      ansible_host: "{{ lookup('env', 'US_W_1_V4_SSH') }}"
      server_alias: 美国西-1 | US-West-1
      location: United States
      server_environment: production
      description: US West web server - Oracle | 美国西 Web 服务器 - Oracle
    sg-1:
      ansible_host: "{{ lookup('env', 'SG_1_V4_SSH') }}"
      server_alias: 新加坡-1 | Singapore-1
      location: Singapore
      server_environment: production
      description: Singapore proxy server - Aliyun | 新加坡代理服务器 - Aliyun
    hk-1:
      ansible_host: "{{ lookup('env', 'HK_1_V4_SSH') }}"
      server_alias: 香港-1 | Hong Kong-1
      location: Hong Kong
      server_environment: production
      description: Hong Kong proxy server - Zouter | 香港代理服务器 - Zouter
    uk-2:
      ansible_host: "{{ lookup('env', 'UK_2_V4_SSH') }}"
      server_alias: 英国-2 | UK-2
      location: United Kingdom
      server_environment: production
      description: UK proxy server - Akko | 英国代理服务器 - Akko
    fr-1:
      ansible_host: "{{ lookup('env', 'FR_1_V4_SSH') }}"
      server_alias: 法国-1 | France-1
      location: France
      server_environment: development
      description: France development server - OVH | 法国开发服务器 - OVH
    pl-1:
      ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
      server_alias: 波兰-1 | Poland-1
      location: Poland
      server_environment: production
      description: Poland observability server (PLG stack) - OVH | 波兰可观测性服务器 (PLG) - OVH
      k8s_role: master
      k8s_provider: k3s
      k3s_version: v1.31.5+k3s1
      k3s_server_args: --disable traefik --disable servicelb --write-kubeconfig-mode 600
      kubeconfig_remote_path: /etc/rancher/k3s/k3s.yaml
      kubeconfig_local_path: ~/.kube/k3s-pl-1.yaml
      cluster_name: k3s-test-pl1
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  children:
    web_servers:
      hosts:
        jp-1: {}
        uk-1: {}
        us-w-1: {}
      vars:
        server_role: web
    proxy_servers:
      hosts:
        sg-1: {}
        hk-1: {}
        uk-2: {}
      vars:
        server_role: proxy
    dev_servers:
      hosts:
        fr-1: {}
      vars:
        server_role: development
    observability:
      hosts:
        pl-1: {}
      vars:
        server_role: observability
    v2bx_servers:
      hosts:
        uk-1: {}
        uk-2: {}
      vars:
        server_role: v2bx_node
    v2board_servers:
      hosts:
        us-w-1: {}
        pl-1: {}
      vars:
        server_role: v2board_panel
    postgres_servers:
      hosts:
        pl-1: {}
      vars:
        server_role: database
    k8s_control_plane:
      hosts:
        pl-1: {}
      vars:
        server_role: k8s_control
    k8s_servers:
      hosts: {}
      vars:
        server_role: kubernetes
    k8s_test:
      hosts:
        pl-1: {}
      vars:
        server_role: k8s_test
    dev:
      hosts:
        fr-1: {}
      vars:
        server_environment: development
    prod:
      hosts: {}
      vars:
        server_environment: production
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('root', true) }}"
    ansible_port: "{{ lookup('env', 'ANSIBLE_PORT') | default('22', true) | int }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
    ansible_python_interpreter: /usr/bin/python3
