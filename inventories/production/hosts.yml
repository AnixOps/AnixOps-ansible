# =============================================================================
# Ansible 涓绘満娓呭崟 | Ansible Inventory
# =============================================================================
# 姝ゆ枃浠跺畾涔夋墍鏈夊彈绠℃湇鍔″櫒鐨勮繛鎺ヤ俊鎭?# This file defines connection information for all managed servers
#
# 璇存槑 | Notes:
#   - 鏈嶅姟鍣?IP 浠庣幆澧冨彉閲忚鍙?| Server IPs are read from environment variables
#   - 鏈湴浣跨敤: 澶嶅埗 .env.example 鍒?.env 骞堕厤缃?#     Local use: Copy .env.example to .env and configure
#   - GitHub Actions: 璁剧疆涓?repository secrets
#     GitHub Actions: Set as repository secrets
# =============================================================================

all:
  children:

    # -------------------------------------------------------------------------
    # Web 鏈嶅姟鍣ㄧ粍 | Web Servers Group
    # -------------------------------------------------------------------------
    # 鐢ㄤ簬閮ㄧ讲 Web 搴旂敤鍜岄潤鎬佽祫婧愭湇鍔?    # Used for deploying web applications and static resource services
    web_servers:
      hosts:
        jp-1:
          ansible_host: "{{ lookup('env', 'JP_1_V4_SSH') }}"
        uk-1:
          ansible_host: "{{ lookup('env', 'UK_1_V4_SSH') }}"
        us-w-1:
          ansible_host: "{{ lookup('env', 'US_W_1_V4_SSH') }}"
      vars:
        server_role: web

    # -------------------------------------------------------------------------
    # Proxy 鏈嶅姟鍣ㄧ粍 | Proxy Servers Group
    # -------------------------------------------------------------------------
    # 閮ㄧ讲 PLG Stack (Prometheus + Loki + Grafana)
    # Deploying PLG Stack (Prometheus + Loki + Grafana)
    proxy_servers:
      hosts:
        sg-1:
          ansible_host: "{{ lookup('env', 'SG_1_V4_SSH') }}"
        hk-1:
          ansible_host: "{{ lookup('env', 'HK_1_V4_SSH') }}"
        uk-2:
          ansible_host: "{{ lookup('env', 'UK_2_V4_SSH') }}"
      vars:
        server_role: proxy

    # -------------------------------------------------------------------------
    # 寮€鍙戞湇鍔″櫒缁?| Development Servers Group
    # -------------------------------------------------------------------------
    # 鐢ㄤ簬寮€鍙戝拰娴嬭瘯鐜 | Used for development and testing environments
    # dev_servers:
    #   hosts:
    #     de-1:
    #       ansible_host: "{{ lookup('env', 'DE_1_V4_SSH') }}"
    #   vars:
    #     server_role: development

    # -------------------------------------------------------------------------
    # Cloudflare Mesh 鑺傜偣缁?| Cloudflare Mesh Nodes Group
    # -------------------------------------------------------------------------
    # 鎵€鏈夊姞鍏?Cloudflare Mesh 缃戠粶鐨勬湇鍔″櫒锛堝師鐢?IP 璺敱锛?00.96.0.0/12锛?    # All servers participating in Cloudflare Mesh network (native IP routing, 100.96.0.0/12)
      hosts:
        pl-1:
      vars:
        server_role: mesh_node

    # -------------------------------------------------------------------------
    # PostgreSQL Database Servers Group | PostgreSQL 鏁版嵁搴撴湇鍔″櫒缁?    # -------------------------------------------------------------------------
    # 閮ㄧ讲 PostgreSQL 鏁版嵁搴擄紝涓?v2board 鎻愪緵鏁版嵁鎸佷箙鍖?    # Deploy PostgreSQL database for v2board data persistence
    postgres_servers:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
      vars:
        server_role: database

    # -------------------------------------------------------------------------
    # V2board 鎺у埗闈㈡澘鏈嶅姟鍣ㄧ粍 | V2board Control Panel Servers Group
    # -------------------------------------------------------------------------
    # V2board 浠ｇ悊鑺傜偣绠＄悊闈㈡澘
    # V2board proxy node management control panel
    v2board_servers:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
      vars:
        server_role: v2board_panel

    # -------------------------------------------------------------------------
    # 鍙娴嬫€ф湇鍔″櫒缁?| Observability Servers Group
    # -------------------------------------------------------------------------
    # 涓ぎ鐩戞帶鍜屾棩蹇楃郴缁?(Prometheus + Loki + Grafana)
    # Central monitoring and logging system (Prometheus + Loki + Grafana)
    observability:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
      vars:
        server_role: observability

    # -------------------------------------------------------------------------
    # Kubernetes 鎺у埗闈㈡澘鏈嶅姟鍣ㄧ粍 | K8s Control Plane Servers Group
    # -------------------------------------------------------------------------
    # Kubernetes 鎺у埗闈㈡澘鍙嶅悜浠ｇ悊 (Dashboard + API + Metrics)
    # Kubernetes control plane reverse proxy (Dashboard + API + Metrics)
    k8s_control_plane:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
      vars:
        server_role: k8s_control

    # -------------------------------------------------------------------------
    # Kubernetes 闆嗙兢鏈嶅姟鍣ㄧ粍 | Kubernetes Cluster Servers Group
    # -------------------------------------------------------------------------
    # Kubernetes 鎺у埗骞抽潰鍜屽伐浣滆妭鐐?| Kubernetes control plane and worker nodes
    k8s_servers:
      hosts:
        fr-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
          k8s_role: master
      vars:
        server_role: kubernetes

    # -------------------------------------------------------------------------
    # K8s 娴嬭瘯鏈嶅姟鍣ㄧ粍 | K8s Test Servers Group
    # -------------------------------------------------------------------------
    # 鐢ㄤ簬 K8s 杩滅▼閮ㄧ讲娴嬭瘯 (浣跨敤 K3s) | For K8s remote deployment testing (using K3s)
    k8s_test:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
          k8s_role: master
          k8s_provider: k3s
          # K3s 閰嶇疆
          k3s_version: v1.27.3+k3s1
          k3s_server_args: "--disable traefik --disable servicelb --write-kubeconfig-mode 644"
          kubeconfig_remote_path: /etc/rancher/k3s/k3s.yaml
          kubeconfig_local_path: /tmp/k3s-pl-1-kubeconfig.yaml
          cluster_name: k3s-test-pl1
          # 浣跨敤杩滅▼鏈嶅姟鍣ㄤ笂鐨?kubeconfig 璺緞杩涜楠岃瘉
          kubeconfig_path: /etc/rancher/k3s/k3s.yaml
      vars:
        server_role: k8s_test

    # -------------------------------------------------------------------------
    # 搴旂敤閮ㄧ讲鐩爣缁?| Application Deployment Targets
    # -------------------------------------------------------------------------
    # 鐢ㄤ簬瀹氫箟搴旂敤閮ㄧ讲鐨勭洰鏍囬泦缇?| Used to define target clusters for app deployment

    # Nginx 娴嬭瘯閮ㄧ讲 | Nginx Test Deployment
    nginx_test:
      hosts:
        pl-1:
          ansible_host: "{{ lookup('env', 'PL_1_V4_SSH') }}"
          deployment_type: remote_k3s
      vars:
        # 閮ㄧ讲閰嶇疆 | Deployment Configuration
        app_name: nginx-test
        app_namespace: nginx-test
        kubeconfig_path: /tmp/k3s-pl-1-kubeconfig.yaml
        cluster_endpoint: "{{ lookup('env', 'PL_1_V4_SSH') }}"
        app_manifest_path: k8s_manifests/nginx-test

  # ===========================================================================
  # 鍏ㄥ眬鍙橀噺 | Global Variables
  # ===========================================================================
  # 搴旂敤浜庢墍鏈変富鏈虹殑閫氱敤鍙橀噺
  # Common variables applied to all hosts
  vars:
    # SSH 杩炴帴閰嶇疆 | SSH Connection Configuration
    ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('root', true) }}"
    ansible_port: "{{ lookup('env', 'ANSIBLE_PORT') | default('22', true) | int }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    # -------------------------------------------------------------------------
    # 鏈嶅姟鍣ㄥ埆鍚嶉厤缃?| Server Aliases Configuration
    # -------------------------------------------------------------------------
    # 鐢ㄤ簬鍦?Prometheus/Grafana/Loki 涓樉绀哄弸濂界殑鏈嶅姟鍣ㄥ悕绉?    # Used to display friendly server names in Prometheus/Grafana/Loki
    # 鏁版嵁婧愶細inventories/production/server_aliases.yml
    # Source: inventories/production/server_aliases.yml
    server_aliases:

      # Web 鏈嶅姟鍣?| Web Servers
      jp-1:
        alias: "鏃ユ湰-1 | Japan-1"
        description: "鏃ユ湰 Web 鏈嶅姟鍣?- 娴嬭瘯鐜 - Oracle | Japan Web Server - Test - Oracle"
        location: "Japan"
        server_environment: "test"

      uk-1:
        alias: "鑻卞浗-1 | UK-1"
        description: "鑻卞浗 Web 鏈嶅姟鍣?- 娴嬭瘯鐜 - Oracle | UK Web Server - Test - Oracle"
        location: "United Kingdom"
        server_environment: "test"

      us-w-1:
        alias: "缇庡浗瑗?1 | US-West-1"
        description: "缇庡浗瑗?Web 鏈嶅姟鍣?- PLG Stack - Oracle | US West Web Server - PLG Stack - Oracle"
        location: "United States"
        server_environment: "production"

      # Proxy 鏈嶅姟鍣?| Proxy Servers
      sg-1:
        alias: "鏂板姞鍧?1 | Singapore-1"
        description: "鏂板姞鍧?Proxy 鏈嶅姟鍣?- PLG Stack - Aliyun | Singapore Proxy Server - PLG Stack - Aliyun"
        location: "Singapore"
        server_environment: "production"

      hk-1:
        alias: "棣欐腐-1 | Hong Kong-1"
        description: "棣欐腐 Proxy 鏈嶅姟鍣?- PLG Stack - Zouter | Hong Kong Proxy Server - PLG Stack - Zouter"
        location: "Hong Kong"
        server_environment: "production"

      uk-2:
        alias: "鑻卞浗-2 | UK-2"
        description: "鑻卞浗 Proxy 鏈嶅姟鍣?- PLG Stack - Akko | UK Proxy Server - PLG Stack - Akko"
        location: "United Kingdom"
        server_environment: "production"

      # 寮€鍙戞湇鍔″櫒 | Development Servers
      fr-1:
        alias: "娉曞浗-1 | France-1"
        description: "娉曞浗 Development 鏈嶅姟鍣?- DEV - OVH | France Development Server - DEV - OVH"
        location: "France"
        server_environment: "development"

      # 鍙娴嬫€ф湇鍔″櫒 | Observability Servers
      pl-1:
        alias: "娉㈠叞-1 | Poland-1"
        description: "娉㈠叞 Observability 鏈嶅姟鍣?- PLG Stack - OVH | Poland Observability Server - PLG Stack - OVH"
        location: "Poland"
        server_environment: "production"
