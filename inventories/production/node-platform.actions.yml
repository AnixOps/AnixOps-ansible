---
# =============================================================================
# Dedicated inventory for the "Deploy AnixOps Node Platform" GitHub Actions
# workflow | 节点平台 GitHub Actions 专用清单
# =============================================================================
# Connection settings come from the workflow environment:
#   ANIXOPS_NODE_PLATFORM_1_V4_SSH  host address (GitHub Environment secret)
#   ANSIBLE_USER / ANSIBLE_PORT     SSH login user and port
#   SSH_KEY_PATH                    exported by .github/actions/setup-ansible
# Host-key checking and SSH multiplexing are configured once in ansible.cfg.
# =============================================================================

all:
  children:
    anixops_node_platform_servers:
      hosts:
        anixops-node-platform-1:
          ansible_host: "{{ lookup('env', 'ANIXOPS_NODE_PLATFORM_1_V4_SSH') }}"
          server_alias: node-platform-1
          location: cloud
          server_environment: production
          description: AnixOps node platform web stack (Nginx edge + compose services)
      vars:
        server_role: node_platform_web
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('root', true) }}"
    ansible_port: "{{ lookup('env', 'ANSIBLE_PORT') | default('22', true) | int }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
    ansible_python_interpreter: /usr/bin/python3
