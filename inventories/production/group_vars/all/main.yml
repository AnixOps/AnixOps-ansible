# =============================================================================
# Global variables | 全局变量配置
# =============================================================================
# Applied to every host of the production inventory. Roles consume these
# operator-facing keys through prefixed defaults with fallbacks, e.g.
# `common_timezone: "{{ timezone | default('Asia/Shanghai') }}"`, so the key
# names below are a stable contract — do not rename them.
#
# Security note | 安全提示:
#   Secrets never live in this file. They come from the environment (.env
#   locally, repository secrets in GitHub Actions) via lookup('env', ...).
# =============================================================================

# -----------------------------------------------------------------------------
# Architecture mapping for binary downloads
# -----------------------------------------------------------------------------
_target_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# -----------------------------------------------------------------------------
# Timezone and locale | 时区和本地化
# -----------------------------------------------------------------------------
timezone: "Asia/Shanghai"
locale: "en_US.UTF-8"

# -----------------------------------------------------------------------------
# Common packages installed on every server | 基础软件包
# -----------------------------------------------------------------------------
common_packages:
  - curl
  - wget
  - vim
  - htop
  - git
  - net-tools
  - telnet
  - unzip
  - tar
  - python3
  - python3-pip
  - chrony  # NTP time synchronisation | NTP 时间同步

# -----------------------------------------------------------------------------
# NTP servers | NTP 服务器
# -----------------------------------------------------------------------------
ntp_servers:
  - "ntp.aliyun.com"
  - "pool.ntp.org"

# -----------------------------------------------------------------------------
# SSH | SSH 配置
# -----------------------------------------------------------------------------
# Key-only access: password authentication is disabled fleet-wide. Root login
# stays enabled because every host is managed as root over SSH keys
# (ANSIBLE_USER defaults to root, see .env.example). Switch ssh_allow_root to
# false only after a sudo-capable admin user (admin_users) has been rolled out
# and ANSIBLE_USER points at it — otherwise Ansible locks itself out.
ssh_port: 22
ssh_allow_root: true
ssh_password_authentication: false
ssh_pubkey_authentication: true

# -----------------------------------------------------------------------------
# Firewall (UFW) | 防火墙
# -----------------------------------------------------------------------------
firewall_enabled: true

# Default policy for incoming traffic. `allow` preserves today's behaviour
# (only the restricted ports below are actively filtered). Set it to `deny`
# once every port a host really needs is listed in firewall_public_ports /
# proxy_additional_ports / the role-specific port variables — the SSH port is
# always allowed before UFW is enabled, so a `deny` policy cannot lock you out.
firewall_default_incoming_policy: allow

# Publicly reachable ports (no whitelist) | 公开端口（无需白名单）
firewall_public_ports:
  - 22     # SSH
  - 80     # HTTP
  - 443    # HTTPS

# Legacy alias kept for roles that still read it | 兼容旧变量名
firewall_allowed_ports:
  - 80     # HTTP
  - 443    # HTTPS

# Restricted ports: reachable only from monitoring_whitelist | 受限端口（仅白名单可访问）
firewall_restricted_ports:
  - 9100   # Prometheus node_exporter
  - 9080   # Promtail (Loki agent)
  - 9090   # Prometheus server
  - 3100   # Loki server
  - 3000   # Grafana
  - 5432   # PostgreSQL — only runs on pl-1 and listens on 127.0.0.1; kept here so
           # that, should it ever bind publicly, access stays whitelist-only.

# Server addresses that must always reach the restricted ports: the
# observability host (Prometheus scrapes node_exporter/promtail on every server).
# Add further entries as "{{ lookup('env', 'OTHER_V4_SSH') | default('', true) }}".
monitoring_allowed_ips:
  - "{{ lookup('env', 'PL_1_V4_SSH') | default('', true) }}"  # pl-1 observability

# Extra whitelist from the environment: GLOBAL_WHITELIST_IPS="1.2.3.4,10.0.0.0/24"
# (comma separated IPs or CIDRs; empty or unset is fine).
global_whitelist_raw: "{{ lookup('env', 'GLOBAL_WHITELIST_IPS') | default('', true) }}"
global_whitelist_split: "{{ global_whitelist_raw.split(',') if (global_whitelist_raw | length > 0) else [] }}"
global_whitelist_cleaned: "{{ global_whitelist_split | map('trim') | reject('equalto', '') | list }}"

# Final whitelist consumed by roles/firewall: env whitelist + server addresses,
# empty strings dropped, duplicates removed. Safe when every source is empty.
monitoring_whitelist: >-
  {{ ((global_whitelist_cleaned | list) + (monitoring_allowed_ips | map('trim') | list))
     | reject('equalto', '') | unique | list }}

# -----------------------------------------------------------------------------
# User management | 用户管理
# -----------------------------------------------------------------------------
# The admin group is chosen per OS family by roles/common (sudo on Debian/Ubuntu,
# wheel on RedHat).
admin_users:
  - name: ansible
    shell: /bin/bash
    state: present

# -----------------------------------------------------------------------------
# Security | 安全配置
# -----------------------------------------------------------------------------
security:
  # Fail2Ban
  fail2ban_enabled: true
  fail2ban_max_retry: 5
  fail2ban_ban_time: 3600  # seconds | 秒

  # System limits | 系统限制
  limits:
    - domain: '*'
      limit_type: soft
      limit_item: nofile
      value: 65535
    - domain: '*'
      limit_type: hard
      limit_item: nofile
      value: 65535

# -----------------------------------------------------------------------------
# Kernel parameters | 内核参数优化
# -----------------------------------------------------------------------------
sysctl_config:
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.ip_forward: 0
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.default.accept_source_route: 0
  kernel.sysrq: 0
  kernel.core_uses_pid: 1
  net.ipv4.tcp_syncookies: 1
  fs.file-max: 65535
  net.core.somaxconn: 1024
  net.ipv4.tcp_max_syn_backlog: 2048

# -----------------------------------------------------------------------------
# Prometheus | Prometheus 监控配置
# -----------------------------------------------------------------------------
prometheus:
  version: "2.45.0"
  port: 9090
  node_exporter:
    version: "1.7.0"
    port: 9100
    download_url: "https://github.com/prometheus/node_exporter/releases/download"
  # Prometheus server URL (PROMETHEUS_URL) | Prometheus 服务器地址
  server_url: "{{ lookup('env', 'PROMETHEUS_URL') | default('http://localhost:9090', true) }}"

# -----------------------------------------------------------------------------
# Loki | Loki 日志配置
# -----------------------------------------------------------------------------
loki:
  version: "2.9.0"
  port: 3100
  promtail:
    version: "2.9.3"
    port: 9080
    download_url: "https://github.com/grafana/loki/releases/download"
  # Loki server URL (LOKI_URL) | Loki 服务器地址
  server_url: "{{ lookup('env', 'LOKI_URL') | default('http://localhost:3100', true) }}"

# -----------------------------------------------------------------------------
# Grafana | Grafana 配置
# -----------------------------------------------------------------------------
grafana:
  # Grafana URL (GRAFANA_URL) | Grafana 访问地址
  url: "{{ lookup('env', 'GRAFANA_URL') | default('http://localhost:3000', true) }}"

# Grafana admin credentials are read by roles/grafana from GRAFANA_ADMIN_USER /
# GRAFANA_ADMIN_PASSWORD (roles/grafana/defaults/main.yml); set them in .env.

# -----------------------------------------------------------------------------
# Nginx | Nginx 配置
# -----------------------------------------------------------------------------
nginx:
  version: "latest"
  worker_processes: auto
  worker_connections: 1024
  client_max_body_size: "10M"
  keepalive_timeout: 65

# -----------------------------------------------------------------------------
# Application defaults | 应用通用配置
# -----------------------------------------------------------------------------
app:
  deploy_dir: /opt/apps
  log_dir: /var/log/apps
  app_user: appuser
  app_group: appgroup
