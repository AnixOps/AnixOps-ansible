group_definitions:

  web_servers:
    description: "Web 搴旂敤鏈嶅姟鍣?| Web Application Servers"
    vars:
      server_role: web

  proxy_servers:
    description: "浠ｇ悊鏈嶅姟鍣?(PLG Stack) | Proxy Servers (PLG Stack)"
    vars:
      server_role: proxy

  dev_servers:
    description: "寮€鍙戞祴璇曟湇鍔″櫒 | Development Test Servers"
    vars:
      server_role: development

  observability:
    description: "鐩戞帶绯荤粺鏈嶅姟鍣?(Prometheus + Loki + Grafana) | Monitoring System Servers (PLG)"
    vars:
      server_role: observability

  v2bx_servers:
    description: "V2bX 浠ｇ悊鑺傜偣 | V2bX Proxy Nodes"
    vars:
      server_role: v2bx_node

  v2board_servers:
    description: "V2board 鎺у埗闈㈡澘 | V2board Control Panels"
    vars:
      server_role: v2board_panel

  postgres_servers:
    description: "PostgreSQL 鏁版嵁搴撴湇鍔″櫒 | PostgreSQL Database Servers"
    vars:
      server_role: database

  # 鐜鍒嗙粍 | Environment Groups
  dev:
