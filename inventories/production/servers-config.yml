---
# =============================================================================
# Server configuration center | 服务器配置中心
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for the production fleet.
# inventories/production/hosts.yml is a GENERATED artifact — never edit it by hand:
#
#   make gen-inventory                                  # regenerate hosts.yml
#   python3 tools/generate_inventory.py local --check   # drift gate (CI + tests)
#
# IP addresses are never stored in git. Every server names the environment
# variable that holds its SSH address: locally it comes from .env (see
# .env.example), in GitHub Actions from a repository secret of the same name.
#
# Schema v2
#   schema_version: 2
#   global_vars:        variables applied to every host (rendered as all.vars)
#   group_definitions:  <group>: { description, vars }
#   servers:            <hostname>:
#                         env_var: NAME            # required, UPPER_SNAKE_CASE
#                         alias / location / description / server_environment
#                         groups: [ ... ]          # required, every name must be defined above
#                         host_vars: { ... }       # optional extra host variables
#
# The generator rejects unknown keys, unknown groups, duplicate hosts and
# duplicate env_vars so that mistakes surface at generation time, not at deploy time.
# =============================================================================
schema_version: 2

# -----------------------------------------------------------------------------
# Global variables | 全局变量
# -----------------------------------------------------------------------------
# SSH connection defaults (ansible_user / ansible_port / ansible_ssh_private_key_file)
# are injected by the generator from ANSIBLE_USER / ANSIBLE_PORT / SSH_KEY_PATH.
# SSH client options (host key checking, ControlPersist, ...) live in ansible.cfg.
global_vars:
  ansible_python_interpreter: /usr/bin/python3

# -----------------------------------------------------------------------------
# Group definitions | 组定义
# -----------------------------------------------------------------------------
group_definitions:
  web_servers:
    description: "Web application servers | Web 应用服务器"
    vars:
      server_role: web

  proxy_servers:
    description: "Proxy servers | 代理服务器"
    vars:
      server_role: proxy

  dev_servers:
    description: "Development and test servers | 开发测试服务器"
    vars:
      server_role: development

  observability:
    description: "Observability stack: Prometheus + Loki + Grafana | 可观测性服务器 (PLG)"
    vars:
      server_role: observability

  v2bx_servers:
    description: "V2bX proxy nodes | V2bX 代理节点"
    vars:
      server_role: v2bx_node

  v2board_servers:
    description: "V2board control panels | V2board 控制面板"
    vars:
      server_role: v2board_panel

  postgres_servers:
    description: "PostgreSQL database servers | PostgreSQL 数据库服务器"
    vars:
      server_role: database

  k8s_control_plane:
    description: "Kubernetes control-plane reverse proxy (Dashboard, API, Metrics) | K8s 控制面板反向代理"
    vars:
      server_role: k8s_control

  # Intentionally EMPTY: no production K3s cluster is rolled out yet.
  # playbooks/platform/k3s.yml targets this group; add a server's name to its
  # `groups:` list below when the first production node is provisioned.
  k8s_servers:
    description: "Production Kubernetes (K3s) cluster nodes | 生产 Kubernetes 集群节点"
    vars:
      server_role: kubernetes

  k8s_test:
    description: "Remote K3s test cluster | K3s 远程测试集群"
    vars:
      server_role: k8s_test

  # Environment label groups | 环境标签组
  # Membership is opt-in: list `dev` or `prod` under a server's `groups:`.
  dev:
    description: "Development environment | 开发环境"
    vars:
      server_environment: development

  prod:
    description: "Production environment | 生产环境"
    vars:
      server_environment: production

# -----------------------------------------------------------------------------
# Servers | 服务器
# -----------------------------------------------------------------------------
servers:

  # --- Web servers | Web 服务器 ------------------------------------------------
  jp-1:
    env_var: JP_1_V4_SSH
    alias: "日本-1 | Japan-1"
    location: "Japan"
    description: "Japan web server - Oracle | 日本 Web 服务器 - Oracle"
    server_environment: test
    groups:
      - web_servers

  uk-1:
    env_var: UK_1_V4_SSH
    alias: "英国-1 | UK-1"
    location: "United Kingdom"
    description: "UK web server - Oracle | 英国 Web 服务器 - Oracle"
    server_environment: production
    groups:
      - web_servers
      - v2bx_servers

  us-w-1:
    env_var: US_W_1_V4_SSH
    alias: "美国西-1 | US-West-1"
    location: "United States"
    description: "US West web server - Oracle | 美国西 Web 服务器 - Oracle"
    server_environment: production
    groups:
      - web_servers
      - v2board_servers

  # --- Proxy servers | 代理服务器 ---------------------------------------------
  sg-1:
    env_var: SG_1_V4_SSH
    alias: "新加坡-1 | Singapore-1"
    location: "Singapore"
    description: "Singapore proxy server - Aliyun | 新加坡代理服务器 - Aliyun"
    server_environment: production
    groups:
      - proxy_servers

  hk-1:
    env_var: HK_1_V4_SSH
    alias: "香港-1 | Hong Kong-1"
    location: "Hong Kong"
    description: "Hong Kong proxy server - Zouter | 香港代理服务器 - Zouter"
    server_environment: production
    groups:
      - proxy_servers

  uk-2:
    env_var: UK_2_V4_SSH
    alias: "英国-2 | UK-2"
    location: "United Kingdom"
    description: "UK proxy server - Akko | 英国代理服务器 - Akko"
    server_environment: production
    groups:
      - proxy_servers
      - v2bx_servers

  # --- Development servers | 开发服务器 ---------------------------------------
  fr-1:
    env_var: FR_1_V4_SSH
    alias: "法国-1 | France-1"
    location: "France"
    description: "France development server - OVH | 法国开发服务器 - OVH"
    server_environment: development
    groups:
      - dev_servers
      - dev

  # --- Observability | 可观测性 -----------------------------------------------
  # pl-1 hosts Prometheus/Loki/Grafana, the V2board panel + PostgreSQL and the
  # remote K3s test cluster. Its address (PL_1_V4_SSH) is also whitelisted for the
  # restricted monitoring ports on every host (group_vars/all/main.yml).
  pl-1:
    env_var: PL_1_V4_SSH
    alias: "波兰-1 | Poland-1"
    location: "Poland"
    description: "Poland observability server (PLG stack) - OVH | 波兰可观测性服务器 (PLG) - OVH"
    server_environment: production
    groups:
      - observability
      - v2board_servers
      - postgres_servers
      - k8s_control_plane
      - k8s_test
    host_vars:
      # K3s test cluster (playbooks/platform/k3s-test.yml, roles/k8s_provision)
      k8s_role: master
      k8s_provider: k3s
      k3s_version: v1.31.5+k3s1
      # Keep the admin kubeconfig root-only (never 644: it holds cluster-admin credentials).
      k3s_server_args: "--disable traefik --disable servicelb --write-kubeconfig-mode 600"
      kubeconfig_remote_path: /etc/rancher/k3s/k3s.yaml
      kubeconfig_local_path: ~/.kube/k3s-pl-1.yaml
      cluster_name: k3s-test-pl1
      # Verification runs against the kubeconfig on the remote server itself.
      kubeconfig_path: /etc/rancher/k3s/k3s.yaml
