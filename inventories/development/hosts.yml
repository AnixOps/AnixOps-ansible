---
# =============================================================================
# Development inventory | 开发环境清单
# =============================================================================
# Local-only targets; nothing in this file connects over SSH.
#
#   ansible-playbook -i inventories/development/hosts.yml playbooks/platform/kind.yml
#
# k8s_local drives roles/k8s_provision with the Kind provider (variable names
# match roles/k8s_provision/defaults/main.yml).
# =============================================================================
all:
  children:
    k8s_local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
      vars:
        k8s_provider: kind
        kind_cluster_name: anixops-dev
